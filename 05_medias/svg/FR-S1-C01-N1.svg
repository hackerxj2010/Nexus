<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 531" width="400" height="531" role="img" aria-labelledby="titre" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif"><title id="titre">Le schéma de la communication</title><rect x="1" y="1" width="398" height="529" rx="18" ry="18" fill="#fffdf8" stroke="#e7dcc8" stroke-width="2"/><text x="200.0" y="34.0" font-size="18" font-weight="bold" fill="#7e22ce" text-anchor="middle">Le schéma de la communication</text><text x="200.0" y="59.0" font-size="13" font-weight="normal" fill="#5b4b3a" text-anchor="middle" font-style="italic">Six éléments, six fonctions du langage</text><rect x="110" y="87.9" width="180" height="58" rx="12" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/><text x="200.0" y="109.9" font-size="14" font-weight="bold" fill="#0369a1" text-anchor="middle">Référent (contexte)</text><text x="200.0" y="128.9" font-size="12.5" font-weight="normal" fill="#2b2118" text-anchor="middle" font-style="italic">fonction référentielle</text><rect x="14" y="179.9" width="112" height="82" rx="12" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1.5"/><text x="70.0" y="201.9" font-size="14" font-weight="bold" fill="#7e22ce" text-anchor="middle">Émetteur</text><text x="70.0" y="220.9" font-size="12.5" font-weight="normal" fill="#2b2118" text-anchor="middle" font-style="italic">fonction</text><text x="70.0" y="235.9" font-size="12.5" font-weight="normal" fill="#2b2118" text-anchor="middle" font-style="italic">expressive</text><text x="70.0" y="250.9" font-size="12.5" font-weight="normal" fill="#2b2118" text-anchor="middle" font-style="italic">(émotive)</text><rect x="144" y="179.9" width="112" height="82" rx="12" fill="#ffe4e6" stroke="#be123c" stroke-width="1.5"/><text x="200.0" y="201.9" font-size="14" font-weight="bold" fill="#be123c" text-anchor="middle">Message</text><text x="200.0" y="220.9" font-size="12.5" font-weight="normal" fill="#2b2118" text-anchor="middle" font-style="italic">fonction</text><text x="200.0" y="235.9" font-size="12.5" font-weight="normal" fill="#2b2118" text-anchor="middle" font-style="italic">poétique</text><rect x="274" y="179.9" width="112" height="82" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/><text x="330.0" y="201.9" font-size="14" font-weight="bold" fill="#15803d" text-anchor="middle">Récepteur</text><text x="330.0" y="220.9" font-size="12.5" font-weight="normal" fill="#2b2118" text-anchor="middle" font-style="italic">fonction</text><text x="330.0" y="235.9" font-size="12.5" font-weight="normal" fill="#2b2118" text-anchor="middle" font-style="italic">conative</text><text x="330.0" y="250.9" font-size="12.5" font-weight="normal" fill="#2b2118" text-anchor="middle" font-style="italic">(impressive)</text><line x1="126.0" y1="220.9" x2="142.0" y2="220.9" stroke="#5b4b3a" stroke-width="2"/><polygon points="142.0,220.9 135.1,224.9 135.1,216.9" fill="#5b4b3a"/><line x1="256.0" y1="220.9" x2="272.0" y2="220.9" stroke="#5b4b3a" stroke-width="2"/><polygon points="272.0,220.9 265.1,224.9 265.1,216.9" fill="#5b4b3a"/><line x1="200" y1="145.9" x2="200" y2="179.9" stroke="#c9b8a3" stroke-width="2" stroke-dasharray="5 4"/><rect x="24" y="295.9" width="168" height="62" rx="12" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/><text x="108.0" y="317.9" font-size="14" font-weight="bold" fill="#b45309" text-anchor="middle">Canal</text><text x="108.0" y="336.9" font-size="12.5" font-weight="normal" fill="#2b2118" text-anchor="middle" font-style="italic">fonction phatique</text><rect x="208" y="295.9" width="168" height="62" rx="12" fill="#e0e7ff" stroke="#4338ca" stroke-width="1.5"/><text x="292.0" y="317.9" font-size="14" font-weight="bold" fill="#4338ca" text-anchor="middle">Code</text><text x="292.0" y="336.9" font-size="12.5" font-weight="normal" fill="#2b2118" text-anchor="middle" font-style="italic">fonction</text><text x="292.0" y="351.9" font-size="12.5" font-weight="normal" fill="#2b2118" text-anchor="middle" font-style="italic">métalinguistique</text><line x1="200" y1="261.9" x2="110" y2="295.9" stroke="#c9b8a3" stroke-width="2" stroke-dasharray="5 4"/><line x1="200" y1="261.9" x2="290" y2="295.9" stroke="#c9b8a3" stroke-width="2" stroke-dasharray="5 4"/><text x="24.0" y="383.9" font-size="13" font-weight="bold" fill="#7e22ce" text-anchor="start">Expressive :</text><text x="150.0" y="383.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">« Que je suis content ! »</text><text x="24.0" y="405.9" font-size="13" font-weight="bold" fill="#15803d" text-anchor="start">Conative :</text><text x="150.0" y="405.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">« Viens vite ! »</text><text x="24.0" y="427.9" font-size="13" font-weight="bold" fill="#b45309" text-anchor="start">Phatique :</text><text x="150.0" y="427.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">« Allô, tu m’entends ? »</text><text x="24.0" y="449.9" font-size="13" font-weight="bold" fill="#4338ca" text-anchor="start">Métalinguistique :</text><text x="150.0" y="449.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">« Zémidjan signifie… »</text><text x="24.0" y="471.9" font-size="13" font-weight="bold" fill="#0369a1" text-anchor="start">Référentielle :</text><text x="150.0" y="471.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">« Lomé est au bord de la mer. »</text><text x="24.0" y="493.9" font-size="13" font-weight="bold" fill="#be123c" text-anchor="start">Poétique :</text><text x="150.0" y="493.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">Jeux de sons, de rythme, d’images</text><text x="386" y="522" font-size="10" fill="#8a7a66" text-anchor="end">Nexus · Français 2nde</text></svg>