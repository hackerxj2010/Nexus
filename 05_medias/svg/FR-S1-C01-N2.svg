<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 379" width="400" height="379" role="img" aria-labelledby="titre" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif"><title id="titre">Énoncé ancré ou énoncé coupé ?</title><rect x="1" y="1" width="398" height="377" rx="18" ry="18" fill="#fffdf8" stroke="#e7dcc8" stroke-width="2"/><text x="200.0" y="34.0" font-size="18" font-weight="bold" fill="#7e22ce" text-anchor="middle">Énoncé ancré ou énoncé coupé ?</text><text x="200.0" y="59.0" font-size="13" font-weight="normal" fill="#5b4b3a" text-anchor="middle" font-style="italic">Pose-toi les questions : qui, à qui, où, quand ?</text><rect x="20" y="85.9" width="360" height="30.5" fill="#7e22ce"/><line x1="113.60000000000001" y1="85.9" x2="113.60000000000001" y2="116.4" stroke="#e2d4bf" stroke-width="1"/><line x1="246.8" y1="85.9" x2="246.8" y2="116.4" stroke="#e2d4bf" stroke-width="1"/><text x="28.0" y="104.9" font-size="13.5" font-weight="bold" fill="#ffffff" text-anchor="start">Indice</text><text x="121.6" y="104.9" font-size="13.5" font-weight="bold" fill="#ffffff" text-anchor="start">Ancré (discours)</text><text x="254.8" y="104.9" font-size="13.5" font-weight="bold" fill="#ffffff" text-anchor="start">Coupé (récit)</text><rect x="20" y="116.4" width="360" height="47.0" fill="#f6efe3"/><line x1="113.60000000000001" y1="116.4" x2="113.60000000000001" y2="163.4" stroke="#e2d4bf" stroke-width="1"/><line x1="246.8" y1="116.4" x2="246.8" y2="163.4" stroke="#e2d4bf" stroke-width="1"/><text x="28.0" y="135.4" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">Personnes</text><text x="121.6" y="135.4" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">je, tu, nous,</text><text x="121.6" y="151.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">vous</text><text x="254.8" y="135.4" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">il, elle, ils</text><rect x="20" y="163.4" width="360" height="47.0" fill="#fffaf0"/><line x1="113.60000000000001" y1="163.4" x2="113.60000000000001" y2="210.4" stroke="#e2d4bf" stroke-width="1"/><line x1="246.8" y1="163.4" x2="246.8" y2="210.4" stroke="#e2d4bf" stroke-width="1"/><text x="28.0" y="182.4" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">Temps</text><text x="121.6" y="182.4" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">présent, passé</text><text x="121.6" y="198.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">composé, futur</text><text x="254.8" y="182.4" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">passé simple,</text><text x="254.8" y="198.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">imparfait</text><rect x="20" y="210.4" width="360" height="63.5" fill="#f6efe3"/><line x1="113.60000000000001" y1="210.4" x2="113.60000000000001" y2="273.9" stroke="#e2d4bf" stroke-width="1"/><line x1="246.8" y1="210.4" x2="246.8" y2="273.9" stroke="#e2d4bf" stroke-width="1"/><text x="28.0" y="229.4" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">Temps</text><text x="28.0" y="245.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">(repères)</text><text x="121.6" y="229.4" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">aujourd'hui,</text><text x="121.6" y="245.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">hier, demain</text><text x="254.8" y="229.4" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">ce jour-là, la</text><text x="254.8" y="245.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">veille, le</text><text x="254.8" y="262.4" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">lendemain</text><rect x="20" y="273.9" width="360" height="30.5" fill="#fffaf0"/><line x1="113.60000000000001" y1="273.9" x2="113.60000000000001" y2="304.4" stroke="#e2d4bf" stroke-width="1"/><line x1="246.8" y1="273.9" x2="246.8" y2="304.4" stroke="#e2d4bf" stroke-width="1"/><text x="28.0" y="292.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">Lieu</text><text x="121.6" y="292.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">ici</text><text x="254.8" y="292.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">là, là-bas</text><rect x="20" y="304.4" width="360" height="47.0" fill="#f6efe3"/><line x1="113.60000000000001" y1="304.4" x2="113.60000000000001" y2="351.4" stroke="#e2d4bf" stroke-width="1"/><line x1="246.8" y1="304.4" x2="246.8" y2="351.4" stroke="#e2d4bf" stroke-width="1"/><text x="28.0" y="323.4" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">Exemples</text><text x="121.6" y="323.4" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">lettre, dialogue,</text><text x="121.6" y="339.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">discours</text><text x="254.8" y="323.4" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">conte, roman,</text><text x="254.8" y="339.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">récit historique</text><rect x="20" y="85.9" width="360" height="265.5" rx="6" fill="none" stroke="#c9b8a3" stroke-width="1.5"/><text x="386" y="370" font-size="10" fill="#8a7a66" text-anchor="end">Nexus · Français 2nde</text></svg>