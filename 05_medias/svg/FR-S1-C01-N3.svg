<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 493" width="400" height="493" role="img" aria-labelledby="titre" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif"><title id="titre">La modalisation</title><rect x="1" y="1" width="398" height="491" rx="18" ry="18" fill="#fffdf8" stroke="#e7dcc8" stroke-width="2"/><text x="200.0" y="34.0" font-size="18" font-weight="bold" fill="#7e22ce" text-anchor="middle">La modalisation</text><rect x="60" y="67" width="280" height="56" rx="22" fill="#7e22ce"/><text x="200.0" y="87.0" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">Comment l'énonciateur montre son</text><text x="200.0" y="106.0" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">avis</text><path d="M200.0,123 C200.0,140.0 107.0,140.0 107.0,157" fill="none" stroke="#c9b8a3" stroke-width="2"/><path d="M200.0,123 C200.0,140.0 293.0,140.0 293.0,157" fill="none" stroke="#c9b8a3" stroke-width="2"/><rect x="20" y="157" width="174" height="98" rx="12" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1.5"/><text x="30.0" y="178.0" font-size="14" font-weight="bold" fill="#7e22ce" text-anchor="start">Adverbes</text><text x="30.0" y="197.0" font-size="13" font-weight="bold" fill="#7e22ce" text-anchor="start">•</text><text x="42.0" y="197.0" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">certainement,</text><text x="42.0" y="213.0" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">peut-être</text><text x="30.0" y="232.0" font-size="13" font-weight="bold" fill="#7e22ce" text-anchor="start">•</text><text x="42.0" y="232.0" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">hélas, heureusement</text><rect x="206" y="157" width="174" height="98" rx="12" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/><text x="216.0" y="178.0" font-size="14" font-weight="bold" fill="#0369a1" text-anchor="start">Verbes d'opinion</text><text x="216.0" y="197.0" font-size="13" font-weight="bold" fill="#0369a1" text-anchor="start">•</text><text x="228.0" y="197.0" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">je pense, je crois</text><text x="216.0" y="216.0" font-size="13" font-weight="bold" fill="#0369a1" text-anchor="start">•</text><text x="228.0" y="216.0" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">il semble, je doute</text><rect x="20" y="267" width="174" height="98" rx="12" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/><text x="30.0" y="288.0" font-size="14" font-weight="bold" fill="#b45309" text-anchor="start">Conditionnel</text><text x="30.0" y="307.0" font-size="13" font-weight="bold" fill="#b45309" text-anchor="start">•</text><text x="42.0" y="307.0" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">« il serait malade »</text><text x="30.0" y="326.0" font-size="13" font-weight="bold" fill="#b45309" text-anchor="start">•</text><text x="42.0" y="326.0" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">prudence, rumeur</text><rect x="206" y="267" width="174" height="98" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/><text x="216.0" y="288.0" font-size="14" font-weight="bold" fill="#15803d" text-anchor="start">Vocabulaire</text><text x="216.0" y="307.0" font-size="13" font-weight="bold" fill="#15803d" text-anchor="start">•</text><text x="228.0" y="307.0" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">mélioratif : animé</text><text x="216.0" y="326.0" font-size="13" font-weight="bold" fill="#15803d" text-anchor="start">•</text><text x="228.0" y="326.0" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">péjoratif : bruyant,</text><text x="228.0" y="342.0" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">-âtre</text><rect x="20" y="377" width="174" height="82" rx="12" fill="#ffe4e6" stroke="#be123c" stroke-width="1.5"/><text x="30.0" y="398.0" font-size="14" font-weight="bold" fill="#be123c" text-anchor="start">Ponctuation</text><text x="30.0" y="417.0" font-size="13" font-weight="bold" fill="#be123c" text-anchor="start">•</text><text x="42.0" y="417.0" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">! … « »</text><text x="30.0" y="436.0" font-size="13" font-weight="bold" fill="#be123c" text-anchor="start">•</text><text x="42.0" y="436.0" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">émotion, ironie</text><rect x="206" y="377" width="174" height="82" rx="12" fill="#e0e7ff" stroke="#4338ca" stroke-width="1.5"/><text x="216.0" y="398.0" font-size="14" font-weight="bold" fill="#4338ca" text-anchor="start">Tournures</text><text x="216.0" y="417.0" font-size="13" font-weight="bold" fill="#4338ca" text-anchor="start">•</text><text x="228.0" y="417.0" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">il est certain que</text><text x="216.0" y="436.0" font-size="13" font-weight="bold" fill="#4338ca" text-anchor="start">•</text><text x="228.0" y="436.0" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">il est possible que</text><text x="386" y="484" font-size="10" fill="#8a7a66" text-anchor="end">Nexus · Français 2nde</text></svg>