<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 463" width="400" height="463" role="img" aria-labelledby="titre" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif"><title id="titre">Du discours direct au discours indirect</title><rect x="1" y="1" width="398" height="461" rx="18" ry="18" fill="#fffdf8" stroke="#e7dcc8" stroke-width="2"/><text x="200.0" y="34.0" font-size="18" font-weight="bold" fill="#7e22ce" text-anchor="middle">Du discours direct au discours</text><text x="200.0" y="57.0" font-size="18" font-weight="bold" fill="#7e22ce" text-anchor="middle">indirect</text><text x="200.0" y="82.0" font-size="13" font-weight="normal" fill="#5b4b3a" text-anchor="middle" font-style="italic">Pronoms, temps et repères changent</text><rect x="20" y="108.9" width="360" height="47.0" fill="#7e22ce"/><line x1="200.0" y1="108.9" x2="200.0" y2="155.9" stroke="#e2d4bf" stroke-width="1"/><text x="28.0" y="127.9" font-size="13.5" font-weight="bold" fill="#ffffff" text-anchor="start">Direct</text><text x="208.0" y="127.9" font-size="13.5" font-weight="bold" fill="#ffffff" text-anchor="start">Indirect (verbe au</text><text x="208.0" y="144.4" font-size="13.5" font-weight="bold" fill="#ffffff" text-anchor="start">passé)</text><rect x="20" y="155.9" width="360" height="47.0" fill="#f6efe3"/><line x1="200.0" y1="155.9" x2="200.0" y2="202.9" stroke="#e2d4bf" stroke-width="1"/><text x="28.0" y="174.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">« je pars » (présent)</text><text x="208.0" y="174.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">qu'il partait</text><text x="208.0" y="191.4" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">(imparfait)</text><rect x="20" y="202.9" width="360" height="47.0" fill="#fffaf0"/><line x1="200.0" y1="202.9" x2="200.0" y2="249.9" stroke="#e2d4bf" stroke-width="1"/><text x="28.0" y="221.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">« j'ai fini » (passé</text><text x="28.0" y="238.4" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">composé)</text><text x="208.0" y="221.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">qu'il avait fini</text><text x="208.0" y="238.4" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">(plus-que-parfait)</text><rect x="20" y="249.9" width="360" height="47.0" fill="#f6efe3"/><line x1="200.0" y1="249.9" x2="200.0" y2="296.9" stroke="#e2d4bf" stroke-width="1"/><text x="28.0" y="268.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">« je viendrai » (futur)</text><text x="208.0" y="268.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">qu'il viendrait</text><text x="208.0" y="285.4" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">(conditionnel)</text><rect x="20" y="296.9" width="360" height="47.0" fill="#fffaf0"/><line x1="200.0" y1="296.9" x2="200.0" y2="343.9" stroke="#e2d4bf" stroke-width="1"/><text x="28.0" y="315.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">« Viens ! » (impératif)</text><text x="208.0" y="315.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">de venir (de +</text><text x="208.0" y="332.4" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">infinitif)</text><rect x="20" y="343.9" width="360" height="30.5" fill="#f6efe3"/><line x1="200.0" y1="343.9" x2="200.0" y2="374.4" stroke="#e2d4bf" stroke-width="1"/><text x="28.0" y="362.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">« Viens-tu ? »</text><text x="208.0" y="362.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">si je venais</text><rect x="20" y="374.4" width="360" height="30.5" fill="#fffaf0"/><line x1="200.0" y1="374.4" x2="200.0" y2="404.9" stroke="#e2d4bf" stroke-width="1"/><text x="28.0" y="393.4" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">ici / aujourd'hui</text><text x="208.0" y="393.4" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">là / ce jour-là</text><rect x="20" y="404.9" width="360" height="30.5" fill="#f6efe3"/><line x1="200.0" y1="404.9" x2="200.0" y2="435.4" stroke="#e2d4bf" stroke-width="1"/><text x="28.0" y="423.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">hier / demain</text><text x="208.0" y="423.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">la veille / le lendemain</text><rect x="20" y="108.9" width="360" height="326.5" rx="6" fill="none" stroke="#c9b8a3" stroke-width="1.5"/><text x="386" y="454" font-size="10" fill="#8a7a66" text-anchor="end">Nexus · Français 2nde</text></svg>