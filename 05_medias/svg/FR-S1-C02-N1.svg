<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 494" width="400" height="494" role="img" aria-labelledby="titre" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif"><title id="titre">Les figures d'analogie</title><rect x="1" y="1" width="398" height="492" rx="18" ry="18" fill="#fffdf8" stroke="#e7dcc8" stroke-width="2"/><text x="200.0" y="34.0" font-size="18" font-weight="bold" fill="#7e22ce" text-anchor="middle">Les figures d'analogie</text><text x="200.0" y="59.0" font-size="13" font-weight="normal" fill="#5b4b3a" text-anchor="middle" font-style="italic">Comparé + comparant = image</text><rect x="20" y="85.9" width="360" height="30.5" fill="#7e22ce"/><line x1="142.4" y1="85.9" x2="142.4" y2="116.4" stroke="#e2d4bf" stroke-width="1"/><line x1="243.20000000000002" y1="85.9" x2="243.20000000000002" y2="116.4" stroke="#e2d4bf" stroke-width="1"/><text x="28.0" y="104.9" font-size="13.5" font-weight="bold" fill="#ffffff" text-anchor="start">Figure</text><text x="150.4" y="104.9" font-size="13.5" font-weight="bold" fill="#ffffff" text-anchor="start">Principe</text><text x="251.2" y="104.9" font-size="13.5" font-weight="bold" fill="#ffffff" text-anchor="start">Exemple</text><rect x="20" y="116.4" width="360" height="80.0" fill="#f6efe3"/><line x1="142.4" y1="116.4" x2="142.4" y2="196.4" stroke="#e2d4bf" stroke-width="1"/><line x1="243.20000000000002" y1="116.4" x2="243.20000000000002" y2="196.4" stroke="#e2d4bf" stroke-width="1"/><text x="28.0" y="135.4" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">Comparaison</text><text x="150.4" y="135.4" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">outil :</text><text x="150.4" y="151.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">comme, tel,</text><text x="150.4" y="168.4" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">semblable à</text><text x="251.2" y="135.4" font-size="13" font-weight="normal" fill="#2b2118" t