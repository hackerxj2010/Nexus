<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 478" width="400" height="478" role="img" aria-labelledby="titre" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif"><title id="titre">Les figures d'analogie</title><rect x="1" y="1" width="398" height="476" rx="18" ry="18" fill="#fffdf8" stroke="#e7dcc8" stroke-width="2"/><text x="200.0" y="34.0" font-size="18" font-weight="bold" fill="#7e22ce" text-anchor="middle">Les figures d'analogie</text><text x="200.0" y="59.0" font-size="13" font-weight="normal" fill="#5b4b3a" text-anchor="middle" font-style="italic">Comparé + comparant = image</text><rect x="20" y="85.9" width="360" height="30.5" fill="#7e22ce"/><line x1="131.6" y1="85.9" x2="131.6" y2="116.4" stroke="#e2d4bf" stroke-width="1"/><line x1="239.6" y1="85.9" x2="239.6" y2="116.4" stroke="#e2d4bf" stroke-width="1"/><text x="28.0" y="104.9" font-size="13.5" font-weight="bold" fill="#ffffff" text-anchor="start">Figure</text><text x="139.6" y="104.9" font-size="13.5" font-weight="bold" fill="#ffffff" text-anchor="start">Principe</text><text x="247.6" y="104.9" font-size="13.5" font-weight="bold" fill="#ffffff" text-anchor="start">Exemple</text><rect x="20" y="116.4" width="360" height="63.5" fill="#f6efe3"/><line x1="131.6" y1="116.4" x2="131.6" y2="179.9" stroke="#e2d4bf" stroke-width="1"/><line x1="239.6" y1="116.4" x2="239.6" y2="179.9" stroke="#e2d4bf" stroke-width="1"/><text x="28.0" y="135.4" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">Comparaison</text><text x="139.6" y="135.4" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">outil :</text><text x="139.6" y="151.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">comme, tel,</text><text x="139.6" y="168.4" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">semblable à</text><text x="247.6" y="135.4" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">« Le Poète est</text><text x="247.6" y="151.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">semblable au</text><text x="247.6" y="168.4" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">prince des nuées »</text><rect x="20" y="179.9" width="360" height="47.0" fill="#fffaf0"/><line x1="131.6" y1="179.9" x2="131.6" y2="226.9" stroke="#e2d4bf" stroke-width="1"/><line x1="239.6" y1="179.9" x2="239.6" y2="226.9" stroke="#e2d4bf" stroke-width="1"/><text x="28.0" y="198.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">Métaphore</text><text x="139.6" y="198.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">image sans</text><text x="139.6" y="215.4" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">outil</text><text x="247.6" y="198.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">« La Nature est un</text><text x="247.6" y="215.4" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">temple »</text><rect x="20" y="226.9" width="360" height="80.0" fill="#f6efe3"/><line x1="131.6" y1="226.9" x2="131.6" y2="306.9" stroke="#e2d4bf" stroke-width="1"/><line x1="239.6" y1="226.9" x2="239.6" y2="306.9" stroke="#e2d4bf" stroke-width="1"/><text x="28.0" y="245.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">Métaphore</text><text x="28.0" y="262.4" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">filée</text><text x="139.6" y="245.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">image</text><text x="139.6" y="262.4" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">prolongée</text><text x="247.6" y="245.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">soleil-forgeron</text><text x="247.6" y="262.4" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">qui frappe</text><text x="247.6" y="278.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">l’enclume des</text><text x="247.6" y="295.4" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">toits</text><rect x="20" y="306.9" width="360" height="80.0" fill="#fffaf0"/><line x1="131.6" y1="306.9" x2="131.6" y2="386.9" stroke="#e2d4bf" stroke-width="1"/><line x1="239.6" y1="306.9" x2="239.6" y2="386.9" stroke="#e2d4bf" stroke-width="1"/><text x="28.0" y="325.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">Personnification</text><text x="139.6" y="325.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">traits</text><text x="139.6" y="342.4" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">humains</text><text x="139.6" y="358.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">donnés à une</text><text x="139.6" y="375.4" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">chose</text><text x="247.6" y="325.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">« Le vent hurle »</text><rect x="20" y="386.9" width="360" height="63.5" fill="#f6efe3"/><line x1="131.6" y1="386.9" x2="131.6" y2="450.4" stroke="#e2d4bf" stroke-width="1"/><line x1="239.6" y1="386.9" x2="239.6" y2="450.4" stroke="#e2d4bf" stroke-width="1"/><text x="28.0" y="405.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">Allégorie</text><text x="139.6" y="405.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">idée</text><text x="139.6" y="422.4" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">abstraite</text><text x="139.6" y="438.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">incarnée</text><text x="247.6" y="405.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">la Mort en</text><text x="247.6" y="422.4" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">faucheuse</text><rect 