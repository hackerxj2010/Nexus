2b2118" text-anchor="start">qui frappe</text><text x="251.2" y="295.4" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">l’enclume des</text><text x="251.2" y="311.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">toits</text><rect x="20" y="323.4" width="360" height="80.0" fill="#fffaf0"/><line x1="142.4" y1="323.4" x2="142.4" y2="403.4" stroke="#e2d4bf" stroke-width="1"/><line x1="243.20000000000002" y1="323.4" x2="243.20000000000002" y2="403.4" stroke="#e2d4bf" stroke-width="1"/><text x="28.0" y="342.4" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">Personnification</text><text x="150.4" y="342.4" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">traits</text><text x="150.4" y="358.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">humains</text><text x="150.4" y="375.4" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">donnés à une</text><text x="150.4" y="391.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">chose</text><text x="251.2" y="342.4" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">« Le vent hurle »</text><rect x="20" y="403.4" width="360" height="63.5" fill="#f6efe3"/><line x1="142.4" y1="403.4" x2="142.4" y2="466.9" stroke="#e2d4bf" stroke-width="1"/><line x1="243.20000000000002" y1="403.4" x2="243.20000000000002" y2="466.9" stroke="#e2d4bf" stroke-width="1"/><text x="28.0" y="422.4" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">Allégorie</text><text x="150.4" y="422.4" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">idée</text><text x="150.4" y="438.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">abstraite</text><text x="150.4" y="455.4" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">incarnée</text><text x="251.2" y="422.4" font-size="13" font-weight="normal" fill="#2b2118"