<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 474" width="400" height="474" role="img" aria-labelledby="titre" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif"><title id="titre">Insister ou atténuer ?</title><rect x="1" y="1" width="398" height="472" rx="18" ry="18" fill="#fffdf8" stroke="#e7dcc8" stroke-width="2"/><text x="200.0" y="34.0" font-size="18" font-weight="bold" fill="#7e22ce" text-anchor="middle">Insister ou atténuer ?</text><rect x="60" y="67" width="280" height="37" rx="18.5" fill="#7e22ce"/><text x="200.0" y="87.0" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">Dire plus… ou dire moins</text><path d="M200.0,104 C200.0,121.0 107.0,121.0 107.0,138" fill="none" stroke="#c9b8a3" stroke-width="2"/><path d="M200.0,104 C200.0,121.0 293.0,121.0 293.0,138" fill="none" stroke="#c9b8a3" stroke-width="2"/><rect x="20" y="138" width="174" height="82" rx="12" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1.5"/><text x="30.0" y="159.0" font-size="14" font-weight="bold" fill="#7e22ce" text-anchor="start">Hyperbole</text><text x="30.0" y="178.0" font-size="13" font-weight="bold" fill="#7e22ce" text-anchor="start">•</text><text x="42.0" y="178.0" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">exagération</text><text x="30.0" y="197.0" font-size="13" font-weight="bold" fill="#7e22ce" text-anchor="start">•</text><text x="42.0" y="197.0" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">« je meurs de faim »</text><rect x="206" y="138" width="174" height="82" rx="12" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/><text x="216.0" y="159.0" font-size="14" font-weight="bold" fill="#0369a1" text-anchor="start">Gradation</text><text x="216.0" y="178.0" font-size="13" font-weight="bold" fill="#0369a1" text-anchor="start">•</text><text x="228.0" y="178.0" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">intensité croissante</text><text x="216.0" y="197.0" font-size="13" font-weight="bold" fill="#0369a1" text-anchor="start">•</text><text x="228.0" y="197.0" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">« Va, cours, vole »</text><rect x="20" y="232" width="174" height="82" rx="12" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/><text x="30.0" y="253.0" font-size="14" font-weight="bold" fill="#b45309" text-anchor="start">Accumulation</text><text x="30.0" y="272.0" font-size="13" font-weight="bold" fill="#b45309" text-anchor="start">•</text><text x="42.0" y="272.0" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">suite de mots</text><text x="30.0" y="291.0" font-size="13" font-weight="bold" fill="#b45309" text-anchor="start">•</text><text x="42.0" y="291.0" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">effet de masse</text><rect x="206" y="232" width="174" height="82" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/><text x="216.0" y="253.0" font-size="14" font-weight="bold" fill="#15803d" text-anchor="start">Anaphore</text><text x="216.0" y="272.0" font-size="13" font-weight="bold" fill="#15803d" text-anchor="start">•</text><text x="228.0" y="272.0" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">même début de vers</text><text x="216.0" y="291.0" font-size="13" font-weight="bold" fill="#15803d" text-anchor="start">•</text><text x="228.0" y="291.0" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">martèlement</text><rect x="20" y="326" width="174" height="114" rx="12" fill="#ffe4e6" stroke="#be123c" stroke-width="1.5"/><text x="30.0" y="347.0" font-size="14" font-weight="bold" fill="#be123c" text-anchor="start">Litote</text><text x="30.0" y="366.0" font-size="13" font-weight="bold" fill="#be123c" text-anchor="start">•</text><text x="42.0" y="366.0" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">dire moins pour dire</text><text x="42.0" y="382.0" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">plus</text><text x="30.0" y="401.0" font-size="13" font-weight="bold" fill="#be123c" text-anchor="start">•</text><text x="42.0" y="401.0" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">« Je ne te hais</text><text x="42.0" y="417.0" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">point »</text><rect x="206" y="326" width="174" height="114" rx="12" fill="#e0e7ff" stroke="#4338ca" stroke-width="1.5"/><text x="216.0" y="347.0" font-size="14" font-weight="bold" fill="#4338ca" text-anchor="start">Euphémisme</text><text x="216.0" y="366.0" font-size="13" font-weight="bold" fill="#4338ca" text-anchor="start">•</text><text x="228.0" y="366.0" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">adoucir</text><text x="216.0" y="385.0" font-size="13" font-weight="bold" fill="#4338ca" text-anchor="start">•</text><text x="228.0" y="385.0" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">« il nous a</text><text x="228.0" y="401.0" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">quittés »</text><text x="386" y="465" font-size="10" fill="#8a7a66" text-anchor="end">Nexus · Français 2nde</text></svg>