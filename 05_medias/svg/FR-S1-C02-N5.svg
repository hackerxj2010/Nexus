<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 458" width="400" height="458" role="img" aria-labelledby="titre" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif"><title id="titre">Analyser une figure de style</title><rect x="1" y="1" width="398" height="456" rx="18" ry="18" fill="#fffdf8" stroke="#e7dcc8" stroke-width="2"/><text x="200.0" y="34.0" font-size="18" font-weight="bold" fill="#7e22ce" text-anchor="middle">Analyser une figure de style</text><text x="200.0" y="59.0" font-size="13" font-weight="normal" fill="#5b4b3a" text-anchor="middle" font-style="italic">Méthode R-N-M-I</text><rect x="20" y="85.9" width="360" height="57" rx="12" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1.5"/><circle cx="45" cy="114.4" r="15" fill="#7e22ce"/><text x="45.0" y="119.9" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text><text x="70.0" y="107.9" font-size="14.5" font-weight="bold" fill="#7e22ce" text-anchor="start">Repérer</text><text x="70.0" y="127.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">Cite le passage exact entre guillemets.</text><line x1="200.0" y1="144.9" x2="200.0" y2="160.9" stroke="#5b4b3a" stroke-width="2"/><polygon points="200.0,160.9 196.0,154.0 204.0,154.0" fill="#5b4b3a"/><rect x="20" y="164.9" width="360" height="74" rx="12" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/><circle cx="45" cy="201.9" r="15" fill="#0369a1"/><text x="45.0" y="207.4" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text><text x="70.0" y="186.9" font-size="14.5" font-weight="bold" fill="#0369a1" text-anchor="start">Nommer</text><text x="70.0" y="206.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">Donne le nom précis : « métaphore filée »,</text><text x="70.0" y="223.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">pas « image ».</text><line x1="200.0" y1="240.9" x2="200.0" y2="256.9" stroke="#5b4b3a" stroke-width="2"/><polygon points="200.0,256.9 196.0,250.0 204.0,250.0" fill="#5b4b3a"/><rect x="20" y="260.9" width="360" height="74" rx="12" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/><circle cx="45" cy="297.9" r="15" fill="#b45309"/><text x="45.0" y="303.4" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text><text x="70.0" y="282.9" font-size="14.5" font-weight="bold" fill="#b45309" text-anchor="start">Montrer le mécanisme</text><text x="70.0" y="302.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">Comparé/comparant, contraires, sons</text><text x="70.0" y="319.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">répétés, progression…</text><line x1="200.0" y1="336.9" x2="200.0" y2="352.9" stroke="#5b4b3a" stroke-width="2"/><polygon points="200.0,352.9 196.0,346.0 204.0,346.0" fill="#5b4b3a"/><rect x="20" y="356.9" width="360" height="74" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/><circle cx="45" cy="393.9" r="15" fill="#15803d"/><text x="45.0" y="399.4" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text><text x="70.0" y="378.9" font-size="14.5" font-weight="bold" fill="#15803d" text-anchor="start">Interpréter</text><text x="70.0" y="398.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">Quel effet sur le lecteur ? Quel sens pour</text><text x="70.0" y="415.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">le texte ?</text><text x="386" y="449" font-size="10" fill="#8a7a66" text-anchor="end">Nexus · Français 2nde</text></svg>