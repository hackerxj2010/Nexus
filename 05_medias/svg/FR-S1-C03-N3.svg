<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 407" width="400" height="407" role="img" aria-labelledby="titre" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif"><title id="titre">Les connecteurs logiques</title><rect x="1" y="1" width="398" height="405" rx="18" ry="18" fill="#fffdf8" stroke="#e7dcc8" stroke-width="2"/><text x="200.0" y="34.0" font-size="18" font-weight="bold" fill="#7e22ce" text-anchor="middle">Les connecteurs logiques</text><text x="200.0" y="59.0" font-size="13" font-weight="normal" fill="#5b4b3a" text-anchor="middle" font-style="italic">Les panneaux de signalisation du raisonnement</text><rect x="20" y="85.9" width="360" height="30.5" fill="#7e22ce"/><line x1="128.0" y1="85.9" x2="128.0" y2="116.4" stroke="#e2d4bf" stroke-width="1"/><text x="28.0" y="104.9" font-size="13.5" font-weight="bold" fill="#ffffff" text-anchor="start">Rapport</text><text x="136.0" y="104.9" font-size="13.5" font-weight="bold" fill="#ffffff" text-anchor="start">Connecteurs</text><rect x="20" y="116.4" width="360" height="47.0" fill="#f6efe3"/><line x1="128.0" y1="116.4" x2="128.0" y2="163.4" stroke="#e2d4bf" stroke-width="1"/><text x="28.0" y="135.4" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">Addition</text><text x="136.0" y="135.4" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">de plus, en outre, d'abord,</text><text x="136.0" y="151.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">ensuite, enfin</text><rect x="20" y="163.4" width="360" height="30.5" fill="#fffaf0"/><line x1="128.0" y1="163.4" x2="128.0" y2="193.9" stroke="#e2d4bf" stroke-width="1"/><text x="28.0" y="182.4" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">Cause</text><text x="136.0" y="182.4" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">car, en effet, parce que, puisque</text><rect x="20" y="193.9" width="360" height="47.0" fill="#f6efe3"/><line x1="128.0" y1="193.9" x2="128.0" y2="240.9" stroke="#e2d4bf" stroke-width="1"/><text x="28.0" y="212.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">Conséquence</text><text x="136.0" y="212.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">donc, ainsi, c'est pourquoi, par</text><text x="136.0" y="229.4" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">conséquent</text><rect x="20" y="240.9" width="360" height="47.0" fill="#fffaf0"/><line x1="128.0" y1="240.9" x2="128.0" y2="287.9" stroke="#e2d4bf" stroke-width="1"/><text x="28.0" y="259.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">Opposition</text><text x="136.0" y="259.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">mais, pourtant, cependant, en</text><text x="136.0" y="276.4" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">revanche</text><rect x="20" y="287.9" width="360" height="30.5" fill="#f6efe3"/><line x1="128.0" y1="287.9" x2="128.0" y2="318.4" stroke="#e2d4bf" stroke-width="1"/><text x="28.0" y="306.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">Concession</text><text x="136.0" y="306.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">certes… mais, bien que, même si</text><rect x="20" y="318.4" width="360" height="30.5" fill="#fffaf0"/><line x1="128.0" y1="318.4" x2="128.0" y2="348.9" stroke="#e2d4bf" stroke-width="1"/><text x="28.0" y="337.4" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">Illustration</text><text x="136.0" y="337.4" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">par exemple, notamment, ainsi</text><rect x="20" y="348.9" width="360" height="30.5" fill="#f6efe3"/><line x1="128.0" y1="348.9" x2="128.0" y2="379.4" stroke="#e2d4bf" stroke-width="1"/><text x="28.0" y="367.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">Conclusion</text><text x="136.0" y="367.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">en somme, bref, en définitive</text><rect x="20" y="85.9" width="360" height="293.5" rx="6" fill="none" stroke="#c9b8a3" stroke-width="1.5"/><text x="386" y="398" font-size="10" fill="#8a7a66" text-anchor="end">Nexus · Français 2nde</text></svg>