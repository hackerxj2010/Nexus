n points="200.0,493.9 196.0,487.0 204.0,487.0" fill="#5b4b3a"/><rect x="20" y="497.9" width="360" height="57" rx="12" fill="#e0e7ff" stroke="#4338ca" stroke-width="1.5"/><circle cx="45" cy="526.4" r="15" fill="#4338ca"/><text x="45.0" y="531.9" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">6</text><text x="70.0" y="519.9" font-size="14.5" font-weight="bold" fill="#4338ca" text-anchor="start">Compter</text><text x="70.0" y="539.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">Nombre de mots du texte, puis ÷ 4.</text><text x="386" y="573" font-size="10" fill="#8a7a66" text-anchor="end">Nexus · Français 2nde</text></svg>