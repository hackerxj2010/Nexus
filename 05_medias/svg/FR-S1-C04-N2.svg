<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 582" width="400" height="582" role="img" aria-labelledby="titre" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif"><title id="titre">La lecture préparatoire</title><rect x="1" y="1" width="398" height="580" rx="18" ry="18" fill="#fffdf8" stroke="#e7dcc8" stroke-width="2"/><text x="200.0" y="34.0" font-size="18" font-weight="bold" fill="#7e22ce" text-anchor="middle">La lecture préparatoire</text><text x="200.0" y="59.0" font-size="13" font-weight="normal" fill="#5b4b3a" text-anchor="middle" font-style="italic">Au brouillon, avant toute rédaction</text><rect x="20" y="85.9" width="360" height="57" rx="12" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1.5"/><circle cx="45" cy="114.4" r="15" fill="#7e22ce"/><text x="45.0" y="119.9" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text><text x="70.0" y="107.9" font-size="14.5" font-weight="bold" fill="#7e22ce" text-anchor="start">Lire</text><text x="70.0" y="127.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">Une lecture complète, sans écrire.</text><line x1="200.0" y1="144.9" x2="200.0" y2="160.9" stroke="#5b4b3a" stroke-width="2"/><polygon points="200.0,160.9 196.0,154.0 204.0,154.0" fill="#5b4b3a"/><rect x="20" y="164.9" width="360" height="74" rx="12" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/><circle cx="45" cy="201.9" r="15" fill="#0369a1"/><text x="45.0" y="207.4" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text><text x="70.0" y="186.9" font-size="14.5" font-weight="bold" fill="#0369a1" text-anchor="start">Annoter</text><text x="70.0" y="206.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">Entoure les connecteurs, souligne les</text><text x="70.0" y="223.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">idées, crochets sur les exemples.</text><line x1="200.0" y1="240.9" x2="200.0" y2="256.9" stroke="#5b4b3a" str