<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 475" width="400" height="475" role="img" aria-labelledby="titre" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif"><title id="titre">Condenser : les techniques</title><rect x="1" y="1" width="398" height="473" rx="18" ry="18" fill="#fffdf8" stroke="#e7dcc8" stroke-width="2"/><text x="200.0" y="34.0" font-size="18" font-weight="bold" fill="#7e22ce" text-anchor="middle">Condenser : les techniques</text><text x="200.0" y="59.0" font-size="13" font-weight="normal" fill="#5b4b3a" text-anchor="middle" font-style="italic">Moins de mots, même idée</text><rect x="20" y="85.9" width="360" height="30.5" fill="#7e22ce"/><line x1="120.80000000000001" y1="85.9" x2="120.80000000000001" y2="116.4" stroke="#e2d4bf" stroke-width="1"/><line x1="261.20000000000005" y1="85.9" x2="261.20000000000005" y2="116.4" stroke="#e2d4bf" stroke-width="1"/><text x="28.0" y="104.9" font-size="13.5" font-weight="bold" fill="#ffffff" text-anchor="start">Technique</text><text x="128.8" y="104.9" font-size="13.5" font-weight="bold" fill="#ffffff" text-anchor="start">Avant</text><text x="269.2" y="104.9" font-size="13.5" font-weight="bold" fill="#ffffff" text-anchor="start">Après</text><rect x="20" y="116.4" width="360" height="47.0" fill="#f6efe3"/><line x1="120.80000000000001" y1="116.4" x2="120.80000000000001" y2="163.4" stroke="#e2d4bf" stroke-width="1"/><line x1="261.20000000000005" y1="116.4" x2="261.20000000000005" y2="163.4" stroke="#e2d4bf" stroke-width="1"/><text x="28.0" y="135.4" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">Supprimer</text><text x="128.8" y="135.4" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">exemples,</text><text x="128.8" y="151.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">répétitions</text><text x="269.2" y="135.4" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">—</text><rect x="20" y="163.4" width="360" height="47.0" fill="#fffaf0"/><line x1="120.80000000000001" y1="163.4" x2="120.80000000000001" y2="210.4" stroke="#e2d4bf" stroke-width="1"/><line x1="261.20000000000005" y1="163.4" x2="261.20000000000005" y2="210.4" stroke="#e2d4bf" stroke-width="1"/><text x="28.0" y="182.4" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">Généraliser</text><text x="128.8" y="182.4" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">« Lomé, Cotonou ou</text><text x="128.8" y="198.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">plus loin »</text><text x="269.2" y="182.4" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">la ville</text><rect x="20" y="210.4" width="360" height="63.5" fill="#f6efe3"/><line x1="120.80000000000001" y1="210.4" x2="120.80000000000001" y2="273.9" stroke="#e2d4bf" stroke-width="1"/><line x1="261.20000000000005" y1="210.4" x2="261.20000000000005" y2="273.9" stroke="#e2d4bf" stroke-width="1"/><text x="28.0" y="229.4" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">Nominaliser</text><text x="128.8" y="229.4" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">« les jeunes</text><text x="128.8" y="245.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">quittent les</text><text x="128.8" y="262.4" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">villages »</text><text x="269.2" y="229.4" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">l'exode des</text><text x="269.2" y="245.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">jeunes</text><rect x="20" y="273.9" width="360" height="47.0" fill="#fffaf0"/><line x1="120.80000000000001" y1="273.9" x2="120.80000000000001" y2="320.9" stroke="#e2d4bf" stroke-width="1"/><line x1="261.20000000000005" y1="273.9" x2="261.20000000000005" y2="320.9" stroke="#e2d4bf" stroke-width="1"/><text x="28.0" y="292.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">Adjectiver</text><text x="128.8" y="292.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">« un travail qui</text><text x="128.8" y="309.4" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">fatigue »</text><text x="269.2" y="292.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">un travail</text><text x="269.2" y="309.4" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">pénible</text><rect x="20" y="320.9" width="360" height="63.5" fill="#f6efe3"/><line x1="120.80000000000001" y1="320.9" x2="120.80000000000001" y2="384.4" stroke="#e2d4bf" stroke-width="1"/><line x1="261.20000000000005" y1="320.9" x2="261.20000000000005" y2="384.4" stroke="#e2d4bf" stroke-width="1"/><text x="28.0" y="339.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">Question →</text><text x="28.0" y="356.4" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">affirmation</text><text x="128.8" y="339.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">« Qui pourrait</text><text x="128.8" y="356.4" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">leur</text><text x="128.8" y="372.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">reprocher… ? »</text><text x="269.2" y="339.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">leur rêve est</text><text x="269.2" y="356.4" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">légitime</text><rect x="20" y="384.4" width="360" height="63.5" fill="#fffaf0"/><line x1="120.80000000000001" y1="384.4" x2="120.80000000000001" y2="447.9" stroke="#e2d4bf" stroke-width="1"/><line x1="261.20000000000005" y1="384.4" x2="261.20000000000005" y2="447.9" stroke="#e2d4bf" stroke-width="1"/><text x="28.0" y="403.4" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">Fusionner</text><text x="128.8" y="403.4" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">« Il pleut. Les</text><text x="128.8" y="419.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">routes sont</text><text x="128.8" y="436.4" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">coupées. »</text><text x="269.2" y="403.4" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">La pluie coupe</text><text x="269.2" y="419.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">les routes.</text><rect x="20" y="85.9" width="360" height="362.0" rx="6" fill="none" stroke="#c9b8a3" stroke-width="1.5"/><text x="386" y="466" font-size="10" fill="#8a7a66" text-anchor="end">Nexus · Français 2nde</text></svg>