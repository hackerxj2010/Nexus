<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 458" width="400" height="458" role="img" aria-labelledby="titre" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif"><title id="titre">Expliquer un mot en contexte</title><rect x="1" y="1" width="398" height="456" rx="18" ry="18" fill="#fffdf8" stroke="#e7dcc8" stroke-width="2"/><text x="200.0" y="34.0" font-size="18" font-weight="bold" fill="#7e22ce" text-anchor="middle">Expliquer un mot en contexte</text><text x="200.0" y="59.0" font-size="13" font-weight="normal" fill="#5b4b3a" text-anchor="middle" font-style="italic">Une phrase complète, jamais un mot seul</text><rect x="20" y="85.9" width="360" height="74" rx="12" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1.5"/><circle cx="45" cy="122.9" r="15" fill="#7e22ce"/><text x="45.0" y="128.4" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text><text x="70.0" y="107.9" font-size="14.5" font-weight="bold" fill="#7e22ce" text-anchor="start">Citer</text><text x="70.0" y="127.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">Le mot entre guillemets + sa place dans le</text><text x="70.0" y="144.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">texte.</text><line x1="200.0" y1="161.9" x2="200.0" y2="177.9" stroke="#5b4b3a" stroke-width="2"/><polygon points="200.0,177.9 196.0,171.0 204.0,171.0" fill="#5b4b3a"/><rect x="20" y="181.9" width="360" height="74" rx="12" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/><circle cx="45" cy="218.9" r="15" fill="#0369a1"/><text x="45.0" y="224.4" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text><text x="70.0" y="203.9" font-size="14.5" font-weight="bold" fill="#0369a1" text-anchor="start">Analyser</text><text x="70.0" y="223.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">Nature (nom, verbe, adjectif) et formation</text><text x="70.0" y="240.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">(préfixe, suffixe).</text><line x1="200.0" y1="257.9" x2="200.0" y2="273.9" stroke="#5b4b3a" stroke-width="2"/><polygon points="200.0,273.9 196.0,267.0 204.0,267.0" fill="#5b4b3a"/><rect x="20" y="277.9" width="360" height="74" rx="12" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/><circle cx="45" cy="314.9" r="15" fill="#b45309"/><text x="45.0" y="320.4" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text><text x="70.0" y="299.9" font-size="14.5" font-weight="bold" fill="#b45309" text-anchor="start">Définir</text><text x="70.0" y="319.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">Le sens DANS le texte, par un équivalent de</text><text x="70.0" y="336.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">même nature.</text><line x1="200.0" y1="353.9" x2="200.0" y2="369.9" stroke="#5b4b3a" stroke-width="2"/><polygon points="200.0,369.9 196.0,363.0 204.0,363.0" fill="#5b4b3a"/><rect x="20" y="373.9" width="360" height="57" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/><circle cx="45" cy="402.4" r="15" fill="#15803d"/><text x="45.0" y="407.9" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text><text x="70.0" y="395.9" font-size="14.5" font-weight="bold" fill="#15803d" text-anchor="start">Relier</text><text x="70.0" y="415.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">« Dans le texte, l'auteur veut dire que… »</text><text x="386" y="449" font-size="10" fill="#8a7a66" text-anchor="end">Nexus · Français 2nde</text></svg>