<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 475" width="400" height="475" role="img" aria-labelledby="titre" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif"><title id="titre">Le paragraphe argumentatif</title><rect x="1" y="1" width="398" height="473" rx="18" ry="18" fill="#fffdf8" stroke="#e7dcc8" stroke-width="2"/><text x="200.0" y="34.0" font-size="18" font-weight="bold" fill="#7e22ce" text-anchor="middle">Le paragraphe argumentatif</text><text x="200.0" y="59.0" font-size="13" font-weight="normal" fill="#5b4b3a" text-anchor="middle" font-style="italic">I-A-E-C, puis une transition entre les parties</text><rect x="20" y="85.9" width="360" height="74" rx="12" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1.5"/><circle cx="45" cy="122.9" r="15" fill="#7e22ce"/><text x="45.0" y="128.4" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text><text x="70.0" y="107.9" font-size="14.5" font-weight="bold" fill="#7e22ce" text-anchor="start">Idée</text><text x="70.0" y="127.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">D’abord, l’agriculture garantit la sécurité</text><text x="70.0" y="144.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">alimentaire.</text><line x1="200.0" y1="161.9" x2="200.0" y2="177.9" stroke="#5b4b3a" stroke-width="2"/><polygon points="200.0,177.9 196.0,171.0 204.0,171.0" fill="#5b4b3a"/><rect x="20" y="181.9" width="360" height="74" rx="12" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/><circle cx="45" cy="218.9" r="15" fill="#0369a1"/><text x="45.0" y="224.4" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text><text x="70.0" y="203.9" font-size="14.5" font-weight="bold" fill="#0369a1" text-anchor="start">Argument</text><text x="70.0" y="223.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">En effet, une population qui dépend des</text><text x="70.0" y="240.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">importations subit les hausses de prix.</text><line x1="200.0" y1="257.9" x2="200.0" y2="273.9" stroke="#5b4b3a" stroke-width="2"/><polygon points="200.0,273.9 196.0,267.0 204.0,267.0" fill="#5b4b3a"/><rect x="20" y="277.9" width="360" height="74" rx="12" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/><circle cx="45" cy="314.9" r="15" fill="#b45309"/><text x="45.0" y="320.4" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text><text x="70.0" y="299.9" font-size="14.5" font-weight="bold" fill="#b45309" text-anchor="start">Exemple</text><text x="70.0" y="319.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">Ainsi, quand le riz importé augmente, les</text><text x="70.0" y="336.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">familles pauvres sont touchées.</text><line x1="200.0" y1="353.9" x2="200.0" y2="369.9" stroke="#5b4b3a" stroke-width="2"/><polygon points="200.0,369.9 196.0,363.0 204.0,363.0" fill="#5b4b3a"/><rect x="20" y="373.9" width="360" height="74" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/><circle cx="45" cy="410.9" r="15" fill="#15803d"/><text x="45.0" y="416.4" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text><text x="70.0" y="395.9" font-size="14.5" font-weight="bold" fill="#15803d" text-anchor="start">Conclusion partielle</text><text x="70.0" y="415.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">Produire sa nourriture est donc une</text><text x="70.0" y="432.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">condition de l’indépendance.</text><text x="386" y="466" font-size="10" fill="#8a7a66" text-anchor="end">Nexus · Français 2nde</text></svg>