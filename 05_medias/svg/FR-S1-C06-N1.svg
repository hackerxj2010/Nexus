<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 285" width="400" height="285" role="img" aria-labelledby="titre" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif"><title id="titre">Les trois focalisations</title><rect x="1" y="1" width="398" height="283" rx="18" ry="18" fill="#fffdf8" stroke="#e7dcc8" stroke-width="2"/><text x="200.0" y="34.0" font-size="18" font-weight="bold" fill="#7e22ce" text-anchor="middle">Les trois focalisations</text><text x="200.0" y="59.0" font-size="13" font-weight="normal" fill="#5b4b3a" text-anchor="middle" font-style="italic">Par les yeux de qui voit-on l’histoire ?</text><rect x="20" y="85.9" width="360" height="30.5" fill="#7e22ce"/><line x1="113.60000000000001" y1="85.9" x2="113.60000000000001" y2="116.4" stroke="#e2d4bf" stroke-width="1"/><line x1="264.8" y1="85.9" x2="264.8" y2="116.4" stroke="#e2d4bf" stroke-width="1"/><text x="28.0" y="104.9" font-size="13.5" font-weight="bold" fill="#ffffff" text-anchor="start">Focalisation</text><text x="121.6" y="104.9" font-size="13.5" font-weight="bold" fill="#ffffff" text-anchor="start">Le narrateur…</text><text x="272.8" y="104.9" font-size="13.5" font-weight="bold" fill="#ffffff" text-anchor="start">Effet</text><rect x="20" y="116.4" width="360" height="47.0" fill="#f6efe3"/><line x1="113.60000000000001" y1="116.4" x2="113.60000000000001" y2="163.4" stroke="#e2d4bf" stroke-width="1"/><line x1="264.8" y1="116.4" x2="264.8" y2="163.4" stroke="#e2d4bf" stroke-width="1"/><text x="28.0" y="135.4" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">Zéro</text><text x="121.6" y="135.4" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">sait tout, pensées</text><text x="121.6" y="151.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">de tous</text><text x="272.8" y="135.4" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">vue d'ensemble</text><rect x="20" y="163.4" width="360" height="47.0" fill="#fffaf0"/><line x1="113.60000000000001" y1="163.4" x2="113.60000000000001" y2="210.4" stroke="#e2d4bf" stroke-width="1"/><line x1="264.8" y1="163.4" x2="264.8" y2="210.4" stroke="#e2d4bf" stroke-width="1"/><text x="28.0" y="182.4" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">Interne</text><text x="121.6" y="182.4" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">voit par les yeux</text><text x="121.6" y="198.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">d'un personnage</text><text x="272.8" y="182.4" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">on partage ses</text><text x="272.8" y="198.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">émotions</text><rect x="20" y="210.4" width="360" height="47.0" fill="#f6efe3"/><line x1="113.60000000000001" y1="210.4" x2="113.60000000000001" y2="257.4" stroke="#e2d4bf" stroke-width="1"/><line x1="264.8" y1="210.4" x2="264.8" y2="257.4" stroke="#e2d4bf" stroke-width="1"/><text x="28.0" y="229.4" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">Externe</text><text x="121.6" y="229.4" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">voit de dehors,</text><text x="121.6" y="245.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">comme une caméra</text><text x="272.8" y="229.4" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">mystère,</text><text x="272.8" y="245.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">suspense</text><rect x="20" y="85.9" width="360" height="171.49999999999997" rx="6" fill="none" stroke="#c9b8a3" stroke-width="1.5"/><text x="386" y="276" font-size="10" fill="#8a7a66" text-anchor="end">Nexus · Français 2nde</text></svg>