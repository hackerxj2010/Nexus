<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 456" width="400" height="456" role="img" aria-labelledby="titre" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif"><title id="titre">Les subordonnées circonstancielles</title><rect x="1" y="1" width="398" height="454" rx="18" ry="18" fill="#fffdf8" stroke="#e7dcc8" stroke-width="2"/><text x="200.0" y="34.0" font-size="18" font-weight="bold" fill="#7e22ce" text-anchor="middle">Les subordonnées circonstancielles</text><text x="200.0" y="59.0" font-size="13" font-weight="normal" fill="#5b4b3a" text-anchor="middle" font-style="italic">« Les si n’aiment pas les -rais »</text><rect x="20" y="85.9" width="360" height="30.5" fill="#7e22ce"/><line x1="120.80000000000001" y1="85.9" x2="120.80000000000001" y2="116.4" stroke="#e2d4bf" stroke-width="1"/><line x1="282.8" y1="85.9" x2="282.8" y2="116.4" stroke="#e2d4bf" stroke-width="1"/><text x="28.0" y="104.9" font-size="13.5" font-weight="bold" fill="#ffffff" text-anchor="start">Rapport</text><text x="128.8" y="104.9" font-size="13.5" font-weight="bold" fill="#ffffff" text-anchor="start">Conjonctions</text><text x="290.8" y="104.9" font-size="13.5" font-weight="bold" fill="#ffffff" text-anchor="start">Mode</text><rect x="20" y="116.4" width="360" height="80.0" fill="#f6efe3"/><line x1="120.80000000000001" y1="116.4" x2="120.80000000000001" y2="196.4" stroke="#e2d4bf" stroke-width="1"/><line x1="282.8" y1="116.4" x2="282.8" y2="196.4" stroke="#e2d4bf" stroke-width="1"/><text x="28.0" y="135.4" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">Temps</text><text x="128.8" y="135.4" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">quand, lorsque, dès</text><text x="128.8" y="151.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">que ; avant que</text><text x="290.8" y="135.4" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">indicatif ;</text><text x="290.8" y="151.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">subjonctif</text><text x="290.8" y="168.4" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">après avant</text><text x="290.8" y="184.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">que</text><rect x="20" y="196.4" width="360" height="47.0" fill="#fffaf0"/><line x1="120.80000000000001" y1="196.4" x2="120.80000000000001" y2="243.4" stroke="#e2d4bf" stroke-width="1"/><line x1="282.8" y1="196.4" x2="282.8" y2="243.4" stroke="#e2d4bf" stroke-width="1"/><text x="28.0" y="215.4" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">Cause</text><text x="128.8" y="215.4" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">parce que, puisque,</text><text x="128.8" y="231.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">comme</text><text x="290.8" y="215.4" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">indicatif</text><rect x="20" y="243.4" width="360" height="47.0" fill="#f6efe3"/><line x1="120.80000000000001" y1="243.4" x2="120.80000000000001" y2="290.4" stroke="#e2d4bf" stroke-width="1"/><line x1="282.8" y1="243.4" x2="282.8" y2="290.4" stroke="#e2d4bf" stroke-width="1"/><text x="28.0" y="262.4" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">Conséquence</text><text x="128.8" y="262.4" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">si bien que, de sorte</text><text x="128.8" y="278.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">que</text><text x="290.8" y="262.4" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">indicatif</text><rect x="20" y="290.4" width="360" height="30.5" fill="#fffaf0"/><line x1="120.80000000000001" y1="290.4" x2="120.80000000000001" y2="320.9" stroke="#e2d4bf" stroke-width="1"/><line x1="282.8" y1="290.4" x2="282.8" y2="320.9" stroke="#e2d4bf" stroke-width="1"/><text x="28.0" y="309.4" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">But</text><text x="128.8" y="309.4" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">pour que, afin que</text><text x="290.8" y="309.4" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">subjonctif</text><rect x="20" y="320.9" width="360" height="30.5" fill="#f6efe3"/><line x1="120.80000000000001" y1="320.9" x2="120.80000000000001" y2="351.4" stroke="#e2d4bf" stroke-width="1"/><line x1="282.8" y1="320.9" x2="282.8" y2="351.4" stroke="#e2d4bf" stroke-width="1"/><text x="28.0" y="339.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">Concession</text><text x="128.8" y="339.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">bien que, quoique</text><text x="290.8" y="339.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">subjonctif</text><rect x="20" y="351.4" width="360" height="47.0" fill="#fffaf0"/><line x1="120.80000000000001" y1="351.4" x2="120.80000000000001" y2="398.4" stroke="#e2d4bf" stroke-width="1"/><line x1="282.8" y1="351.4" x2="282.8" y2="398.4" stroke="#e2d4bf" stroke-width="1"/><text x="28.0" y="370.4" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">Condition</text><text x="128.8" y="370.4" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">si (+ présent ou</text><text x="128.8" y="386.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">imparfait)</text><text x="290.8" y="370.4" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">indicatif</text><rect x="20" y="398.4" width="360" height="30.5" fill="#f6efe3"/><line x1="120.80000000000001" y1="398.4" x2="120.80000000000001" y2="428.9" stroke="#e2d4bf" stroke-width="1"/><line x1="282.8" y1="398.4" x2="282.8" y2="428.9" stroke="#e2d4bf" stroke-width="1"/><text x="28.0" y="417.4" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">Comparaison</text><text x="128.8" y="417.4" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">comme, ainsi que</text><text x="290.8" y="417.4" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">indicatif</text><rect x="20" y="85.9" width="360" height="343.0" rx="6" fill="none" stroke="#c9b8a3" stroke-width="1.5"/><text x="386" y="447" font-size="10" fill="#8a7a66" text-anchor="end">Nexus · Français 2nde</text></svg>