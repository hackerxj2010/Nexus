<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 490" width="400" height="490" role="img" aria-labelledby="titre" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif"><title id="titre">Les valeurs des temps</title><rect x="1" y="1" width="398" height="488" rx="18" ry="18" fill="#fffdf8" stroke="#e7dcc8" stroke-width="2"/><text x="200.0" y="34.0" font-size="18" font-weight="bold" fill="#7e22ce" text-anchor="middle">Les valeurs des temps</text><rect x="60" y="67" width="280" height="37" rx="18.5" fill="#7e22ce"/><text x="200.0" y="87.0" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">Un temps, plusieurs valeurs</text><path d="M200.0,104 C200.0,121.0 107.0,121.0 107.0,138" fill="none" stroke="#c9b8a3" stroke-width="2"/><path d="M200.0,104 C200.0,121.0 293.0,121.0 293.0,138" fill="none" stroke="#c9b8a3" stroke-width="2"/><rect x="20" y="138" width="174" height="98" rx="12" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1.5"/><text x="30.0" y="159.0" font-size="14" font-weight="bold" fill="#7e22ce" text-anchor="start">Présent</text><text x="30.0" y="178.0" font-size="13" font-weight="bold" fill="#7e22ce" text-anchor="start">•</text><text x="42.0" y="178.0" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">énonciation, vérité</text><text x="42.0" y="194.0" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">générale</text><text x="30.0" y="213.0" font-size="13" font-weight="bold" fill="#7e22ce" text-anchor="start">•</text><text x="42.0" y="213.0" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">habitude, narration</text><rect x="206" y="138" width="174" height="98" rx="12" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/><text x="216.0" y="159.0" font-size="14" font-weight="bold" fill="#0369a1" text-anchor="start">Imparfait</text><text x="216.0" y="178.0" font-size="13" font-weight="bold" fill="#0369a1" text-anchor="start">•</text><text x="228.0" y="178.0" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">description,</text><text x="228.0" y="194.0" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">habitude</text><text x="216.0" y="213.0" font-size="13" font-weight="bold" fill="#0369a1" text-anchor="start">•</text><text x="228.0" y="213.0" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">hypothèse après si</text><rect x="20" y="248" width="174" height="98" rx="12" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/><text x="30.0" y="269.0" font-size="14" font-weight="bold" fill="#b45309" text-anchor="start">Passé simple</text><text x="30.0" y="288.0" font-size="13" font-weight="bold" fill="#b45309" text-anchor="start">•</text><text x="42.0" y="288.0" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">action ponctuelle</text><text x="30.0" y="307.0" font-size="13" font-weight="bold" fill="#b45309" text-anchor="start">•</text><text x="42.0" y="307.0" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">premier plan</text><rect x="206" y="248" width="174" height="98" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/><text x="216.0" y="269.0" font-size="14" font-weight="bold" fill="#15803d" text-anchor="start">Futur</text><text x="216.0" y="288.0" font-size="13" font-weight="bold" fill="#15803d" text-anchor="start">•</text><text x="228.0" y="288.0" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">avenir, ordre</text><text x="228.0" y="304.0" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">atténué</text><text x="216.0" y="323.0" font-size="13" font-weight="bold" fill="#15803d" text-anchor="start">•</text><text x="228.0" y="323.0" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">promesse</text><rect x="20" y="358" width="174" height="98" rx="12" fill="#ffe4e6" stroke="#be123c" stroke-width="1.5"/><text x="30.0" y="379.0" font-size="14" font-weight="bold" fill="#be123c" text-anchor="start">Conditionnel</text><text x="30.0" y="398.0" font-size="13" font-weight="bold" fill="#be123c" text-anchor="start">•</text><text x="42.0" y="398.0" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">hypothèse, politesse</text><text x="30.0" y="417.0" font-size="13" font-weight="bold" fill="#be123c" text-anchor="start">•</text><text x="42.0" y="417.0" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">info non vérifiée,</text><text x="42.0" y="433.0" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">futur du passé</text><rect x="206" y="358" width="174" height="98" rx="12" fill="#e0e7ff" stroke="#4338ca" stroke-width="1.5"/><text x="216.0" y="379.0" font-size="14" font-weight="bold" fill="#4338ca" text-anchor="start">Subjonctif</text><text x="216.0" y="398.0" font-size="13" font-weight="bold" fill="#4338ca" text-anchor="start">•</text><text x="228.0" y="398.0" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">volonté, doute</text><text x="216.0" y="417.0" font-size="13" font-weight="bold" fill="#4338ca" text-anchor="start">•</text><text x="228.0" y="417.0" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">après bien que, pour</text><text x="228.0" y="433.0" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">que</text><text x="386" y="481" font-size="10" fill="#8a7a66" text-anchor="end">Nexus · Français 2nde</text></svg>