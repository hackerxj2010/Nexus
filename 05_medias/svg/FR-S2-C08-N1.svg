<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 554" width="400" height="554" role="img" aria-labelledby="titre" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif"><title id="titre">Compter les syllabes d’un vers</title><rect x="1" y="1" width="398" height="552" rx="18" ry="18" fill="#fffdf8" stroke="#e7dcc8" stroke-width="2"/><text x="200.0" y="34.0" font-size="18" font-weight="bold" fill="#7e22ce" text-anchor="middle">Compter les syllabes d’un vers</text><text x="200.0" y="59.0" font-size="13" font-weight="normal" fill="#5b4b3a" text-anchor="middle" font-style="italic">« Demain, dès l’aube, à l’heure où blanchit la</text><text x="200.0" y="75.9" font-size="13" font-weight="normal" fill="#5b4b3a" text-anchor="middle" font-style="italic">campagne » = 12</text><rect x="20" y="102.80000000000001" width="360" height="57" rx="12" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1.5"/><circle cx="45" cy="131.3" r="15" fill="#7e22ce"/><text x="45.0" y="136.8" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text><text x="70.0" y="124.8" font-size="14.5" font-weight="bold" fill="#7e22ce" text-anchor="start">Repérer les e muets</text><text x="70.0" y="144.8" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">Souligne-les tous au crayon.</text><line x1="200.0" y1="161.8" x2="200.0" y2="177.8" stroke="#5b4b3a" stroke-width="2"/><polygon points="200.0,177.8 196.0,170.9 204.0,170.9" fill="#5b4b3a"/><rect x="20" y="181.8" width="360" height="74" rx="12" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/><circle cx="45" cy="218.8" r="15" fill="#0369a1"/><text x="45.0" y="224.3" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text><text x="70.0" y="203.8" font-size="14.5" font-weight="bold" fill="#0369a1" text-anchor="start">Devant consonne</text><text x="70.0" y="223.8" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">Le e se prononce : il compte (« pleu-re</text><text x="70.0" y="240.8" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">dans »).</text><line x1="200.0" y1="257.8" x2="200.0" y2="273.8" stroke="#5b4b3a" stroke-width="2"/><polygon points="200.0,273.8 196.0,266.9 204.0,266.9" fill="#5b4b3a"/><rect x="20" y="277.8" width="360" height="74" rx="12" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/><circle cx="45" cy="314.8" r="15" fill="#b45309"/><text x="45.0" y="320.3" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text><text x="70.0" y="299.8" font-size="14.5" font-weight="bold" fill="#b45309" text-anchor="start">Devant voyelle</text><text x="70.0" y="319.8" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">Le e s’élide : il ne compte pas</text><text x="70.0" y="336.8" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">(« Com-m’il »).</text><line x1="200.0" y1="353.8" x2="200.0" y2="369.8" stroke="#5b4b3a" stroke-width="2"/><polygon points="200.0,369.8 196.0,362.9 204.0,362.9" fill="#5b4b3a"/><rect x="20" y="373.8" width="360" height="57" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/><circle cx="45" cy="402.3" r="15" fill="#15803d"/><text x="45.0" y="407.8" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text><text x="70.0" y="395.8" font-size="14.5" font-weight="bold" fill="#15803d" text-anchor="start">En fin de vers</text><text x="70.0" y="415.8" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">Le e ne compte jamais (« vil-l(e) »).</text><line x1="200.0" y1="432.8" x2="200.0" y2="448.8" stroke="#5b4b3a" stroke-width="2"/><polygon points="200.0,448.8 196.0,441.9 204.0,441.9" fill="#5b4b3a"/><rect x="20" y="452.8" width="360" height="74" rx="12" fill="#ffe4e6" stroke="#be123c" stroke-width="1.5"/><circle cx="45" cy="489.8" r="15" fill="#be123c"/><text x="45.0" y="495.3" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text><text x="70.0" y="474.8" font-size="14.5" font-weight="bold" fill="#be123c" text-anchor="start">Nommer et interpréter</text><text x="70.0" y="494.8" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">12 = alexandrin, 10 = décasyllabe, 8 =</text><text x="70.0" y="511.8" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">octosyllabe ; quel effet ?</text><text x="386" y="545" font-size="10" fill="#8a7a66" text-anchor="end">Nexus · Français 2nde</text></svg>