<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" width="400" height="440" role="img" aria-labelledby="titre" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif"><title id="titre">Rimes, strophes, formes</title><rect x="1" y="1" width="398" height="438" rx="18" ry="18" fill="#fffdf8" stroke="#e7dcc8" stroke-width="2"/><text x="200.0" y="34.0" font-size="18" font-weight="bold" fill="#7e22ce" text-anchor="middle">Rimes, strophes, formes</text><text x="200.0" y="59.0" font-size="13" font-weight="normal" fill="#5b4b3a" text-anchor="middle" font-style="italic">La forme au service du sens</text><rect x="20" y="85.9" width="360" height="30.5" fill="#7e22ce"/><line x1="142.4" y1="85.9" x2="142.4" y2="116.4" stroke="#e2d4bf" stroke-width="1"/><text x="28.0" y="104.9" font-size="13.5" font-weight="bold" fill="#ffffff" text-anchor="start">Notion</text><text x="150.4" y="104.9" font-size="13.5" font-weight="bold" fill="#ffffff" text-anchor="start">À retenir</text><rect x="20" y="116.4" width="360" height="30.5" fill="#f6efe3"/><line x1="142.4" y1="116.4" x2="142.4" y2="146.9" stroke="#e2d4bf" stroke-width="1"/><text x="28.0" y="135.4" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">Rimes suivies</text><text x="150.4" y="135.4" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">AABB</text><rect x="20" y="146.9" width="360" height="30.5" fill="#fffaf0"/><line x1="142.4" y1="146.9" x2="142.4" y2="177.4" stroke="#e2d4bf" stroke-width="1"/><text x="28.0" y="165.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">Rimes croisées</text><text x="150.4" y="165.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">ABAB</text><rect x="20" y="177.4" width="360" height="47.0" fill="#f6efe3"/><line x1="142.4" y1="177.4" x2="142.4" y2="224.4" stroke="#e2d4bf" stroke-width="1"/><text x="28.0" y="196.4" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">Rimes</text><text x="28.0" y="212.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">embrassées</text><text x="150.4" y="196.4" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">ABBA</text><rect x="20" y="224.4" width="360" height="47.0" fill="#fffaf0"/><line x1="142.4" y1="224.4" x2="142.4" y2="271.4" stroke="#e2d4bf" stroke-width="1"/><text x="28.0" y="243.4" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">Richesse</text><text x="150.4" y="243.4" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">pauvre (1 son), suffisante (2),</text><text x="150.4" y="259.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">riche (3 ou plus)</text><rect x="20" y="271.4" width="360" height="47.0" fill="#f6efe3"/><line x1="142.4" y1="271.4" x2="142.4" y2="318.4" stroke="#e2d4bf" stroke-width="1"/><text x="28.0" y="290.4" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">Strophes</text><text x="150.4" y="290.4" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">distique 2, tercet 3, quatrain</text><text x="150.4" y="306.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">4, quintil 5, sizain 6</text><rect x="20" y="318.4" width="360" height="47.0" fill="#fffaf0"/><line x1="142.4" y1="318.4" x2="142.4" y2="365.4" stroke="#e2d4bf" stroke-width="1"/><text x="28.0" y="337.4" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">Sonnet</text><text x="150.4" y="337.4" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">14 vers : 2 quatrains + 2</text><text x="150.4" y="353.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">tercets</text><rect x="20" y="365.4" width="360" height="47.0" fill="#f6efe3"/><line x1="142.4" y1="365.4" x2="142.4" y2="412.4" stroke="#e2d4bf" stroke-width="1"/><text x="28.0" y="384.4" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">Vers libre /</text><text x="28.0" y="400.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">prose</text><text x="150.4" y="384.4" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">rythme et images, sans rime</text><text x="150.4" y="400.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">régulière</text><rect x="20" y="85.9" width="360" height="326.5" rx="6" fill="none" stroke="#c9b8a3" stroke-width="1.5"/><text x="386" y="431" font-size="10" fill="#8a7a66" text-anchor="end">Nexus · Français 2nde</text></svg>