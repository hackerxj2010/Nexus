<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 379" width="400" height="379" role="img" aria-labelledby="titre" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif"><title id="titre">Les registres poétiques</title><rect x="1" y="1" width="398" height="377" rx="18" ry="18" fill="#fffdf8" stroke="#e7dcc8" stroke-width="2"/><text x="200.0" y="34.0" font-size="18" font-weight="bold" fill="#7e22ce" text-anchor="middle">Les registres poétiques</text><text x="200.0" y="59.0" font-size="13" font-weight="normal" fill="#5b4b3a" text-anchor="middle" font-style="italic">Quelle émotion le poème veut-il produire ?</text><rect x="20" y="85.9" width="360" height="30.5" fill="#7e22ce"/><line x1="113.60000000000001" y1="85.9" x2="113.60000000000001" y2="116.4" stroke="#e2d4bf" stroke-width="1"/><line x1="236.0" y1="85.9" x2="236.0" y2="116.4" stroke="#e2d4bf" stroke-width="1"/><text x="28.0" y="104.9" font-size="13.5" font-weight="bold" fill="#ffffff" text-anchor="start">Registre</text><text x="121.6" y="104.9" font-size="13.5" font-weight="bold" fill="#ffffff" text-anchor="start">Effet</text><text x="244.0" y="104.9" font-size="13.5" font-weight="bold" fill="#ffffff" text-anchor="start">Exemple</text><rect x="20" y="116.4" width="360" height="47.0" fill="#f6efe3"/><line x1="113.60000000000001" y1="116.4" x2="113.60000000000001" y2="163.4" stroke="#e2d4bf" stroke-width="1"/><line x1="236.0" y1="116.4" x2="236.0" y2="163.4" stroke="#e2d4bf" stroke-width="1"/><text x="28.0" y="135.4" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">Lyrique</text><text x="121.6" y="135.4" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">sentiments du</text><text x="121.6" y="151.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">« je »</text><text x="244.0" y="135.4" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">Lamartine, « Le</text><text x="244.0" y="151.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">Lac »</text><rect x="20" y="163.4" width="360" height="47.0" fill="#fffaf0"/><line x1="113.60000000000001" y1="163.4" x2="113.60000000000001" y2="210.4" stroke="#e2d4bf" stroke-width="1"/><line x1="236.0" y1="163.4" x2="236.0" y2="210.4" stroke="#e2d4bf" stroke-width="1"/><text x="28.0" y="182.4" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">Élégiaque</text><text x="121.6" y="182.4" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">plainte, deuil</text><text x="244.0" y="182.4" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">Hugo, « Demain,</text><text x="244.0" y="198.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">dès l’aube… »</text><rect x="20" y="210.4" width="360" height="47.0" fill="#f6efe3"/><line x1="113.60000000000001" y1="210.4" x2="113.60000000000001" y2="257.4" stroke="#e2d4bf" stroke-width="1"/><line x1="236.0" y1="210.4" x2="236.0" y2="257.4" stroke="#e2d4bf" stroke-width="1"/><text x="28.0" y="229.4" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">Épique</text><text x="121.6" y="229.4" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">exploits,</text><text x="121.6" y="245.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">grandeur</text><text x="244.0" y="229.4" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">épopée de</text><text x="244.0" y="245.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">Soundjata</text><rect x="20" y="257.4" width="360" height="47.0" fill="#fffaf0"/><line x1="113.60000000000001" y1="257.4" x2="113.60000000000001" y2="304.4" stroke="#e2d4bf" stroke-width="1"/><line x1="236.0" y1="257.4" x2="236.0" y2="304.4" stroke="#e2d4bf" stroke-width="1"/><text x="28.0" y="276.4" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">Satirique</text><text x="121.6" y="276.4" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">critique,</text><text x="121.6" y="292.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">moquerie</text><text x="244.0" y="276.4" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">Hugo, Les</text><text x="244.0" y="292.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">Châtiments</text><rect x="20" y="304.4" width="360" height="47.0" fill="#f6efe3"/><line x1="113.60000000000001" y1="304.4" x2="113.60000000000001" y2="351.4" stroke="#e2d4bf" stroke-width="1"/><line x1="236.0" y1="304.4" x2="236.0" y2="351.4" stroke="#e2d4bf" stroke-width="1"/><text x="28.0" y="323.4" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">Engagé</text><text x="121.6" y="323.4" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">défendre une</text><text x="121.6" y="339.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">cause</text><text x="244.0" y="323.4" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">poésie de la</text><text x="244.0" y="339.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">Négritude</text><rect x="20" y="85.9" width="360" height="265.5" rx="6" fill="none" stroke="#c9b8a3" stroke-width="1.5"/><text x="386" y="370" font-size="10" fill="#8a7a66" text-anchor="end">Nexus · Français 2nde</text></svg>