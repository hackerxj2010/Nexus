<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 441" width="400" height="441" role="img" aria-labelledby="titre" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif"><title id="titre">La structure d’une pièce</title><rect x="1" y="1" width="398" height="439" rx="18" ry="18" fill="#fffdf8" stroke="#e7dcc8" stroke-width="2"/><text x="200.0" y="34.0" font-size="18" font-weight="bold" fill="#7e22ce" text-anchor="middle">La structure d’une pièce</text><text x="200.0" y="59.0" font-size="13" font-weight="normal" fill="#5b4b3a" text-anchor="middle" font-style="italic">Règles classiques : un lieu, un jour, une action</text><rect x="20" y="85.9" width="360" height="74" rx="12" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1.5"/><circle cx="45" cy="122.9" r="15" fill="#7e22ce"/><text x="45.0" y="128.4" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text><text x="70.0" y="107.9" font-size="14.5" font-weight="bold" fill="#7e22ce" text-anchor="start">Exposition</text><text x="70.0" y="127.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">personnages, lieu, situation, conflit</text><text x="70.0" y="144.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">(souvent acte I)</text><line x1="200.0" y1="161.9" x2="200.0" y2="177.9" stroke="#5b4b3a" stroke-width="2"/><polygon points="200.0,177.9 196.0,171.0 204.0,171.0" fill="#5b4b3a"/><rect x="20" y="181.9" width="360" height="57" rx="12" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/><circle cx="45" cy="210.4" r="15" fill="#0369a1"/><text x="45.0" y="215.9" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text><text x="70.0" y="203.9" font-size="14.5" font-weight="bold" fill="#0369a1" text-anchor="start">Nœud</text><text x="70.0" y="223.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">le conflit se met en place, obstacles</text><line x1="200.0" y1="240.9" x2="200.0" y2="256.9" stroke="#5b4b3a" stroke-width="2"/><polygon points="200.0,256.9 196.0,250.0 204.0,250.0" fill="#5b4b3a"/><rect x="20" y="260.9" width="360" height="57" rx="12" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/><circle cx="45" cy="289.4" r="15" fill="#b45309"/><text x="45.0" y="294.9" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text><text x="70.0" y="282.9" font-size="14.5" font-weight="bold" fill="#b45309" text-anchor="start">Péripéties</text><text x="70.0" y="302.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">rebondissements, quiproquos, retournements</text><line x1="200.0" y1="319.9" x2="200.0" y2="335.9" stroke="#5b4b3a" stroke-width="2"/><polygon points="200.0,335.9 196.0,329.0 204.0,329.0" fill="#5b4b3a"/><rect x="20" y="339.9" width="360" height="74" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/><circle cx="45" cy="376.9" r="15" fill="#15803d"/><text x="45.0" y="382.4" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text><text x="70.0" y="361.9" font-size="14.5" font-weight="bold" fill="#15803d" text-anchor="start">Dénouement</text><text x="70.0" y="381.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">résolution : mariage (comédie) ou mort</text><text x="70.0" y="398.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">(tragédie)</text><text x="386" y="432" font-size="10" fill="#8a7a66" text-anchor="end">Nexus · Français 2nde</text></svg>