<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" width="400" height="520" role="img" aria-labelledby="titre" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif"><title id="titre">Analyser une scène de théâtre</title><rect x="1" y="1" width="398" height="518" rx="18" ry="18" fill="#fffdf8" stroke="#e7dcc8" stroke-width="2"/><text x="200.0" y="34.0" font-size="18" font-weight="bold" fill="#7e22ce" text-anchor="middle">Analyser une scène de théâtre</text><text x="200.0" y="59.0" font-size="13" font-weight="normal" fill="#5b4b3a" text-anchor="middle" font-style="italic">Penser au texte ET au spectacle</text><rect x="20" y="85.9" width="360" height="57" rx="12" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1.5"/><circle cx="45" cy="114.4" r="15" fill="#7e22ce"/><text x="45.0" y="119.9" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text><text x="70.0" y="107.9" font-size="14.5" font-weight="bold" fill="#7e22ce" text-anchor="start">Situation</text><text x="70.0" y="127.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">place dans la pièce, personnages, lieu</text><line x1="200.0" y1="144.9" x2="200.0" y2="160.9" stroke="#5b4b3a" stroke-width="2"/><polygon points="200.0,160.9 196.0,154.0 204.0,154.0" fill="#5b4b3a"/><rect x="20" y="164.9" width="360" height="57" rx="12" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/><circle cx="45" cy="193.4" r="15" fill="#0369a1"/><text x="45.0" y="198.9" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text><text x="70.0" y="186.9" font-size="14.5" font-weight="bold" fill="#0369a1" text-anchor="start">Enjeu</text><text x="70.0" y="206.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">amour, argent, pouvoir, honneur ?</text><line x1="200.0" y1="223.9" x2="200.0" y2="239.9" stroke="#5b4b3a" stroke-width="2"/><polygon points="200.0,239.9 196.0,233.0 204.0,233.0" fill="#5b4b3a"/><rect x="20" y="243.9" width="360" height="57" rx="12" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/><circle cx="45" cy="272.4" r="15" fill="#b45309"/><text x="45.0" y="277.9" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text><text x="70.0" y="265.9" font-size="14.5" font-weight="bold" fill="#b45309" text-anchor="start">Rapports de force</text><text x="70.0" y="285.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">qui domine la parole ? cela change-t-il ?</text><line x1="200.0" y1="302.9" x2="200.0" y2="318.9" stroke="#5b4b3a" stroke-width="2"/><polygon points="200.0,318.9 196.0,312.0 204.0,312.0" fill="#5b4b3a"/><rect x="20" y="322.9" width="360" height="74" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/><circle cx="45" cy="359.9" r="15" fill="#15803d"/><text x="45.0" y="365.4" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text><text x="70.0" y="344.9" font-size="14.5" font-weight="bold" fill="#15803d" text-anchor="start">Formes et registre</text><text x="70.0" y="364.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">tirade, stichomythie, aparté ; comique,</text><text x="70.0" y="381.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">tragique</text><line x1="200.0" y1="398.9" x2="200.0" y2="414.9" stroke="#5b4b3a" stroke-width="2"/><polygon points="200.0,414.9 196.0,408.0 204.0,408.0" fill="#5b4b3a"/><rect x="20" y="418.9" width="360" height="74" rx="12" fill="#ffe4e6" stroke="#be123c" stroke-width="1.5"/><circle cx="45" cy="455.9" r="15" fill="#be123c"/><text x="45.0" y="461.4" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text><text x="70.0" y="440.9" font-size="14.5" font-weight="bold" fill="#be123c" text-anchor="start">Mise en scène et visée</text><text x="70.0" y="460.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">didascalies, ce que voit le public, ce qui</text><text x="70.0" y="477.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">est dénoncé</text><text x="386" y="511" font-size="10" fill="#8a7a66" text-anchor="end">Nexus · Français 2nde</text></svg>