<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 365" width="400" height="365" role="img" aria-labelledby="titre" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif"><title id="titre">Le tableau des observations</title><rect x="1" y="1" width="398" height="363" rx="18" ry="18" fill="#fffdf8" stroke="#e7dcc8" stroke-width="2"/><text x="200.0" y="34.0" font-size="18" font-weight="bold" fill="#7e22ce" text-anchor="middle">Le tableau des observations</text><text x="200.0" y="59.0" font-size="13" font-weight="normal" fill="#5b4b3a" text-anchor="middle" font-style="italic">Citer → Nommer → Interpréter (Rimbaud, « Le</text><text x="200.0" y="75.9" font-size="13" font-weight="normal" fill="#5b4b3a" text-anchor="middle" font-style="italic">Dormeur du val »)</text><rect x="20" y="102.80000000000001" width="360" height="30.5" fill="#7e22ce"/><line x1="135.2" y1="102.80000000000001" x2="135.2" y2="133.3" stroke="#e2d4bf" stroke-width="1"/><line x1="268.4" y1="102.80000000000001" x2="268.4" y2="133.3" stroke="#e2d4bf" stroke-width="1"/><text x="28.0" y="121.8" font-size="13.5" font-weight="bold" fill="#ffffff" text-anchor="start">Citation</text><text x="143.2" y="121.8" font-size="13.5" font-weight="bold" fill="#ffffff" text-anchor="start">Procédé</text><text x="276.4" y="121.8" font-size="13.5" font-weight="bold" fill="#ffffff" text-anchor="start">Effet</text><rect x="20" y="133.3" width="360" height="47.0" fill="#f6efe3"/><line x1="135.2" y1="133.3" x2="135.2" y2="180.3" stroke="#e2d4bf" stroke-width="1"/><line x1="268.4" y1="133.3" x2="268.4" y2="180.3" stroke="#e2d4bf" stroke-width="1"/><text x="28.0" y="152.3" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">« où chante</text><text x="28.0" y="168.8" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">une rivière »</text><text x="143.2" y="152.3" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">personnification</text><text x="276.4" y="152.3" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">nature vivante</text><text x="276.4" y="168.8" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">et joyeuse</text><rect x="20" y="180.3" width="360" height="63.5" fill="#fffaf0"/><line x1="135.2" y1="180.3" x2="135.2" y2="243.8" stroke="#e2d4bf" stroke-width="1"/><line x1="268.4" y1="180.3" x2="268.4" y2="243.8" stroke="#e2d4bf" stroke-width="1"/><text x="28.0" y="199.3" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">« Dort »</text><text x="28.0" y="215.8" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">(répété)</text><text x="143.2" y="199.3" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">répétition, rejet</text><text x="276.4" y="199.3" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">on croit au</text><text x="276.4" y="215.8" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">sommeil, puis</text><text x="276.4" y="232.3" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">on s’inquiète</text><rect x="20" y="243.8" width="360" height="47.0" fill="#f6efe3"/><line x1="135.2" y1="243.8" x2="135.2" y2="290.8" stroke="#e2d4bf" stroke-width="1"/><line x1="268.4" y1="243.8" x2="268.4" y2="290.8" stroke="#e2d4bf" stroke-width="1"/><text x="28.0" y="262.8" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">« il a froid »</text><text x="143.2" y="262.8" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">antithèse avec</text><text x="143.2" y="279.3" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">« chaudement »</text><text x="276.4" y="262.8" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">indice discret</text><text x="276.4" y="279.3" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">de la mort</text><rect x="20" y="290.8" width="360" height="47.0" fill="#fffaf0"/><line x1="135.2" y1="290.8" x2="135.2" y2="337.8" stroke="#e2d4bf" stroke-width="1"/><line x1="268.4" y1="290.8" x2="268.4" y2="337.8" stroke="#e2d4bf" stroke-width="1"/><text x="28.0" y="309.8" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">« deux trous</text><text x="28.0" y="326.3" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">rouges »</text><text x="143.2" y="309.8" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">chute, euphémisme</text><text x="276.4" y="309.8" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">choc final :</text><text x="276.4" y="326.3" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">la guerre tue</text><rect x="20" y="102.80000000000001" width="360" height="235.0" rx="6" fill="none" stroke="#c9b8a3" stroke-width="1.5"/><text x="386" y="356" font-size="10" fill="#8a7a66" text-anchor="end">Nexus · Français 2nde</text></svg>