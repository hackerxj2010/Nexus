<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 656" width="400" height="656" role="img" aria-labelledby="titre" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif"><title id="titre">Plan type du commentaire composé</title><rect x="1" y="1" width="398" height="654" rx="18" ry="18" fill="#fffdf8" stroke="#e7dcc8" stroke-width="2"/><text x="200.0" y="34.0" font-size="18" font-weight="bold" fill="#7e22ce" text-anchor="middle">Plan type du commentaire composé</text><text x="200.0" y="59.0" font-size="13" font-weight="normal" fill="#5b4b3a" text-anchor="middle" font-style="italic">Chaque axe traverse tout le texte</text><rect x="20" y="85.9" width="360" height="71.0" rx="11" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1.5"/><text x="32.0" y="106.9" font-size="14.5" font-weight="bold" fill="#7e22ce" text-anchor="start">Introduction</text><text x="32.0" y="125.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">situer le texte, poser le projet de lecture,</text><text x="32.0" y="142.4" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">annoncer les axes</text><rect x="20" y="164.9" width="360" height="54.5" rx="11" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/><text x="32.0" y="185.9" font-size="14.5" font-weight="bold" fill="#0369a1" text-anchor="start">Axe I</text><text x="32.0" y="204.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">ce que le texte montre</text><line x1="32" y1="221.4" x2="32" y2="254.65" stroke="#0369a1" stroke-width="2"/><line x1="32" y1="254.65" x2="46" y2="254.65" stroke="#0369a1" stroke-width="2"/><rect x="46" y="227.4" width="334" height="54.5" rx="11" fill="#ffffff" stroke="#0369a1" stroke-width="1.5" stroke-dasharray="4 3"/><text x="58.0" y="248.4" font-size="13.5" font-weight="bold" fill="#0369a1" text-anchor="start">Sous-partie 1</text><text x="58.0" y="267.4" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">une idée + 2 ou 3 citations analysées</text><line x1="32" y1="283.9" x2="32" y2="317.15" stroke="#0369a1" stroke-width="2"/><line x1="32" y1="317.15" x2="46" y2="317.15" stroke="#0369a1" stroke-width="2"/><rect x="46" y="289.9" width="334" height="54.5" rx="11" fill="#ffffff" stroke="#0369a1" stroke-width="1.5" stroke-dasharray="4 3"/><text x="58.0" y="310.9" font-size="13.5" font-weight="bold" fill="#0369a1" text-anchor="start">Sous-partie 2</text><text x="58.0" y="329.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">une idée + 2 ou 3 citations analysées</text><line x1="50.0" y1="356.4" x2="350.0" y2="356.4" stroke="#c9b8a3" stroke-width="1.5" stroke-dasharray="5 4"/><text x="200.0" y="369.4" font-size="13" font-weight="normal" fill="#5b4b3a" text-anchor="middle" font-style="italic">Transition : bilan de I, annonce de II</text><rect x="20" y="382.4" width="360" height="54.5" rx="11" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/><text x="32.0" y="403.4" font-size="14.5" font-weight="bold" fill="#b45309" text-anchor="start">Axe II</text><text x="32.0" y="422.4" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">ce que le texte veut dire ou faire</text><line x1="32" y1="438.9" x2="32" y2="472.15" stroke="#b45309" stroke-width="2"/><line x1="32" y1="472.15" x2="46" y2="472.15" stroke="#b45309" stroke-width="2"/><rect x="46" y="444.9" width="334" height="54.5" rx="11" fill="#ffffff" stroke="#b45309" stroke-width="1.5" stroke-dasharray="4 3"/><text x="58.0" y="465.9" font-size="13.5" font-weight="bold" fill="#b45309" text-anchor="start">Sous-partie 1</text><text x="58.0" y="484.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">une idée + 2 ou 3 citations analysées</text><line x1="32" y1="501.4" x2="32" y2="534.65" stroke="#b45309" stroke-width="2"/><line x1="32" y1="534.65" x2="46" y2="534.65" stroke="#b45309" stroke-width="2"/><rect x="46" y="507.4" width="334" height="54.5" rx="11" fill="#ffffff" stroke="#b45309" stroke-width="1.5" stroke-dasharray="4 3"/><text x="58.0" y="528.4" font-size="13.5" font-weight="bold" fill="#b45309" text-anchor="start">Sous-partie 2</text><text x="58.0" y="547.4" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">une idée + 2 ou 3 citations analysées</text><rect x="20" y="569.9" width="360" height="54.5" rx="11" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1.5"/><text x="32.0" y="590.9" font-size="14.5" font-weight="bold" fill="#7e22ce" text-anchor="start">Conclusion</text><text x="32.0" y="609.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">bilan, réponse au projet de lecture, ouverture</text><text x="386" y="647" font-size="10" fill="#8a7a66" text-anchor="end">Nexus · Français 2nde</text></svg>