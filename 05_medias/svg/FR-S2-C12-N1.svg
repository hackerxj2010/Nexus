<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" width="400" height="520" role="img" aria-labelledby="titre" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif"><title id="titre">Analyser un sujet de dissertation</title><rect x="1" y="1" width="398" height="518" rx="18" ry="18" fill="#fffdf8" stroke="#e7dcc8" stroke-width="2"/><text x="200.0" y="34.0" font-size="18" font-weight="bold" fill="#7e22ce" text-anchor="middle">Analyser un sujet de dissertation</text><text x="200.0" y="59.0" font-size="13" font-weight="normal" fill="#5b4b3a" text-anchor="middle" font-style="italic">Au brouillon, 10 à 15 minutes</text><rect x="20" y="85.9" width="360" height="74" rx="12" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1.5"/><circle cx="45" cy="122.9" r="15" fill="#7e22ce"/><text x="45.0" y="128.4" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text><text x="70.0" y="107.9" font-size="14.5" font-weight="bold" fill="#7e22ce" text-anchor="start">Souligner</text><text x="70.0" y="127.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">les mots-clés et les petits mots : ne… que,</text><text x="70.0" y="144.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">doit, toujours</text><line x1="200.0" y1="161.9" x2="200.0" y2="177.9" stroke="#5b4b3a" stroke-width="2"/><polygon points="200.0,177.9 196.0,171.0 204.0,171.0" fill="#5b4b3a"/><rect x="20" y="181.9" width="360" height="57" rx="12" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/><circle cx="45" cy="210.4" r="15" fill="#0369a1"/><text x="45.0" y="215.9" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text><text x="70.0" y="203.9" font-size="14.5" font-weight="bold" fill="#0369a1" text-anchor="start">Définir</text><text x="70.0" y="223.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">chaque mot-clé dans le domaine littéraire</text><line x1="200.0" y1="240.9" x2="200.0" y2="256.9" stroke="#5b4b3a" stroke-width="2"/><polygon points="200.0,256.9 196.0,250.0 204.0,250.0" fill="#5b4b3a"/><rect x="20" y="260.9" width="360" height="57" rx="12" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/><circle cx="45" cy="289.4" r="15" fill="#b45309"/><text x="45.0" y="294.9" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text><text x="70.0" y="282.9" font-size="14.5" font-weight="bold" fill="#b45309" text-anchor="start">Reformuler</text><text x="70.0" y="302.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">la thèse de la citation en une phrase</text><line x1="200.0" y1="319.9" x2="200.0" y2="335.9" stroke="#5b4b3a" stroke-width="2"/><polygon points="200.0,335.9 196.0,329.0 204.0,329.0" fill="#5b4b3a"/><rect x="20" y="339.9" width="360" height="74" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/><circle cx="45" cy="376.9" r="15" fill="#15803d"/><text x="45.0" y="382.4" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text><text x="70.0" y="361.9" font-size="14.5" font-weight="bold" fill="#15803d" text-anchor="start">Lire la consigne</text><text x="70.0" y="381.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">commentez, discutez, expliquez et</text><text x="70.0" y="398.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">illustrez…</text><line x1="200.0" y1="415.9" x2="200.0" y2="431.9" stroke="#5b4b3a" stroke-width="2"/><polygon points="200.0,431.9 196.0,425.0 204.0,425.0" fill="#5b4b3a"/><rect x="20" y="435.9" width="360" height="57" rx="12" fill="#ffe4e6" stroke="#be123c" stroke-width="1.5"/><circle cx="45" cy="464.4" r="15" fill="#be123c"/><text x="45.0" y="469.9" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text><text x="70.0" y="457.9" font-size="14.5" font-weight="bold" fill="#be123c" text-anchor="start">Problématiser</text><text x="70.0" y="477.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">une question qui admet deux réponses</text><text x="386" y="511" font-size="10" fill="#8a7a66" text-anchor="end">Nexus · Français 2nde</text></svg>