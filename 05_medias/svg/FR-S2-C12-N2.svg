<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 751" width="400" height="751" role="img" aria-labelledby="titre" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif"><title id="titre">Plan dialectique : un exemple</title><rect x="1" y="1" width="398" height="749" rx="18" ry="18" fill="#fffdf8" stroke="#e7dcc8" stroke-width="2"/><text x="200.0" y="34.0" font-size="18" font-weight="bold" fill="#7e22ce" text-anchor="middle">Plan dialectique : un exemple</text><text x="200.0" y="59.0" font-size="13" font-weight="normal" fill="#5b4b3a" text-anchor="middle" font-style="italic">Sujet : « Une morale nue apporte de l’ennui » (La</text><text x="200.0" y="75.9" font-size="13" font-weight="normal" fill="#5b4b3a" text-anchor="middle" font-style="italic">Fontaine)</text><rect x="20" y="102.80000000000001" width="360" height="71.0" rx="11" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1.5"/><text x="32.0" y="123.8" font-size="14.5" font-weight="bold" fill="#7e22ce" text-anchor="start">Introduction</text><text x="32.0" y="142.8" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">Le récit est-il le meilleur moyen de transmettre</text><text x="32.0" y="159.3" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">une leçon ?</text><rect x="20" y="181.8" width="360" height="38" rx="11" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/><text x="32.0" y="202.8" font-size="14.5" font-weight="bold" fill="#0369a1" text-anchor="start">I. Le conte rend la leçon agréable</text><line x1="32" y1="221.8" x2="32" y2="263.3" stroke="#0369a1" stroke-width="2"/><line x1="32" y1="263.3" x2="46" y2="263.3" stroke="#0369a1" stroke-width="2"/><rect x="46" y="227.8" width="334" height="71.0" rx="11" fill="#ffffff" stroke="#0369a1" stroke-width="1.5" stroke-dasharray="4 3"/><text x="58.0" y="248.8" font-size="13.5" font-weight="bold" fill="#0369a1" text-anchor="start">I.1</text><text x="58.0" y="267.8" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">l’histoire chasse l’ennui (« Le Loup et</text><text x="58.0" y="284.3" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">l’Agneau »)</text><line x1="32" y1="300.8" x2="32" y2="342.3" stroke="#0369a1" stroke-width="2"/><line x1="32" y1="342.3" x2="46" y2="342.3" stroke="#0369a1" stroke-width="2"/><rect x="46" y="306.8" width="334" height="71.0" rx="11" fill="#ffffff" stroke="#0369a1" stroke-width="1.5" stroke-dasharray="4 3"/><text x="58.0" y="327.8" font-size="13.5" font-weight="bold" fill="#0369a1" text-anchor="start">I.2</text><text x="58.0" y="346.8" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">on découvre soi-même la leçon (contes</text><text x="58.0" y="363.3" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">africains)</text><line x1="50.0" y1="389.8" x2="350.0" y2="389.8" stroke="#c9b8a3" stroke-width="1.5" stroke-dasharray="5 4"/><text x="200.0" y="402.8" font-size="13" font-weight="normal" fill="#5b4b3a" text-anchor="middle" font-style="italic">Transition : mais le plaisir peut cacher la</text><text x="200.0" y="418.8" font-size="13" font-weight="normal" fill="#5b4b3a" text-anchor="middle" font-style="italic">leçon</text><rect x="20" y="431.8" width="360" height="38" rx="11" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/><text x="32.0" y="452.8" font-size="14.5" font-weight="bold" fill="#b45309" text-anchor="start">II. Le récit ne suffit pas toujours</text><line x1="32" y1="471.8" x2="32" y2="505.05" stroke="#b45309" stroke-width="2"/><line x1="32" y1="505.05" x2="46" y2="505.05" stroke="#b45309" stroke-width="2"/><rect x="46" y="477.8" width="334" height="54.5" rx="11" fill="#ffffff" stroke="#b45309" stroke-width="1.5" stroke-dasharray="4 3"/><text x="58.0" y="498.8" font-size="13.5" font-weight="bold" fill="#b45309" text-anchor="start">II.1</text><text x="58.0" y="517.8" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">on retient l’histoire, on oublie la morale</text><line x1="32" y1="534.3" x2="32" y2="567.55" stroke="#b45309" stroke-width="2"/><line x1="32" y1="567.55" x2="46" y2="567.55" stroke="#b45309" stroke-width="2"/><rect x="46" y="540.3" width="334" height="54.5" rx="11" fill="#ffffff" stroke="#b45309" stroke-width="1.5" stroke-dasharray="4 3"/><text x="58.0" y="561.3" font-size="13.5" font-weight="bold" fill="#b45309" text-anchor="start">II.2</text><text x="58.0" y="580.3" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">la leçon directe frappe aussi (proverbes)</text><rect x="20" y="602.8" width="360" height="54.5" rx="11" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/><text x="32.0" y="623.8" font-size="14.5" font-weight="bold" fill="#15803d" text-anchor="start">III. Instruire et plaire</text><text x="32.0" y="642.8" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">dépassement facultatif en seconde</text><rect x="20" y="665.3" width="360" height="54.5" rx="11" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1.5"/><text x="32.0" y="686.3" font-size="14.5" font-weight="bold" fill="#7e22ce" text-anchor="start">Conclusion</text><text x="32.0" y="705.3" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">bilan, réponse nuancée, ouverture</text><text x="386" y="742" font-size="10" fill="#8a7a66" text-anchor="end">Nexus · Français 2nde</text></svg>