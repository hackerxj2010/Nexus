<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 540" width="400" height="540" role="img" aria-labelledby="titre" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif"><title id="titre">Les grandes questions littéraires</title><rect x="1" y="1" width="398" height="538" rx="18" ry="18" fill="#fffdf8" stroke="#e7dcc8" stroke-width="2"/><text x="200.0" y="34.0" font-size="18" font-weight="bold" fill="#7e22ce" text-anchor="middle">Les grandes questions littéraires</text><text x="200.0" y="59.0" font-size="13" font-weight="normal" fill="#5b4b3a" text-anchor="middle" font-style="italic">Plaire, instruire, émouvoir, témoigner, dénoncer</text><rect x="60" y="85.9" width="280" height="37" rx="18.5" fill="#7e22ce"/><text x="200.0" y="105.9" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">À quoi sert la littérature ?</text><path d="M200.0,122.9 C200.0,139.9 107.0,139.9 107.0,156.9" fill="none" stroke="#c9b8a3" stroke-width="2"/><path d="M200.0,122.9 C200.0,139.9 293.0,139.9 293.0,156.9" fill="none" stroke="#c9b8a3" stroke-width="2"/><rect x="20" y="156.9" width="174" height="98.0" rx="12" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1.5"/><text x="30.0" y="177.9" font-size="14" font-weight="bold" fill="#7e22ce" text-anchor="start">Poésie</text><text x="30.0" y="196.9" font-size="13" font-weight="bold" fill="#7e22ce" text-anchor="start">•</text><text x="42.0" y="196.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">chant de l’âme ?</text><text x="30.0" y="215.9" font-size="13" font-weight="bold" fill="#7e22ce" text-anchor="start">•</text><text x="42.0" y="215.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">arme du combat ?</text><rect x="206" y="156.9" width="174" height="98.0" rx="12" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/><text x="216.0" y="177.9" font-size="14" font-weight="bold" fill="#0369a1" text-anchor="start">Roman</text><text x="216.0" y="196.9" font-size="13" font-weight="bold" fill="#0369a1" text-anchor="start">•</text><text x="228.0" y="196.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">miroir du réel ?</text><text x="216.0" y="215.9" font-size="13" font-weight="bold" fill="#0369a1" text-anchor="start">•</text><text x="228.0" y="215.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">œuvre</text><text x="228.0" y="231.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">d’imagination ?</text><rect x="20" y="266.9" width="174" height="114.0" rx="12" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/><text x="30.0" y="287.9" font-size="14" font-weight="bold" fill="#b45309" text-anchor="start">Théâtre</text><text x="30.0" y="306.9" font-size="13" font-weight="bold" fill="#b45309" text-anchor="start">•</text><text x="42.0" y="306.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">divertir ?</text><text x="30.0" y="325.9" font-size="13" font-weight="bold" fill="#b45309" text-anchor="start">•</text><text x="42.0" y="325.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">corriger les mœurs ?</text><rect x="206" y="266.9" width="174" height="114.0" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/><text x="216.0" y="287.9" font-size="14" font-weight="bold" fill="#15803d" text-anchor="start">Engagement</text><text x="216.0" y="306.9" font-size="13" font-weight="bold" fill="#15803d" text-anchor="start">•</text><text x="228.0" y="306.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">éveiller les</text><text x="228.0" y="322.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">consciences</text><text x="216.0" y="341.9" font-size="13" font-weight="bold" fill="#15803d" text-anchor="start">•</text><text x="228.0" y="341.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">ou l’art pour</text><text x="228.0" y="357.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">l’art ?</text><rect x="20" y="392.9" width="174" height="114.0" rx="12" fill="#ffe4e6" stroke="#be123c" stroke-width="1.5"/><text x="30.0" y="413.9" font-size="14" font-weight="bold" fill="#be123c" text-anchor="start">Lecture</text><text x="30.0" y="432.9" font-size="13" font-weight="bold" fill="#be123c" text-anchor="start">•</text><text x="42.0" y="432.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">dialoguer avec les</text><text x="42.0" y="448.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">auteurs</text><text x="30.0" y="467.9" font-size="13" font-weight="bold" fill="#be123c" text-anchor="start">•</text><text x="42.0" y="467.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">vivre d’autres vies</text><rect x="206" y="392.9" width="174" height="114.0" rx="12" fill="#e0e7ff" stroke="#4338ca" stroke-width="1.5"/><text x="216.0" y="413.9" font-size="14" font-weight="bold" fill="#4338ca" text-anchor="start">Tradition orale</text><text x="216.0" y="432.9" font-size="13" font-weight="bold" fill="#4338ca" text-anchor="start">•</text><text x="228.0" y="432.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">contes, épopées,</text><text x="228.0" y="448.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">proverbes</text><text x="216.0" y="467.9" font-size="13" font-weight="bold" fill="#4338ca" text-anchor="start">•</text><text x="228.0" y="467.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">le griot, mémoire du</text><text x="228.0" y="483.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">peuple</text><text x="386" y="531" font-size="10" fill="#8a7a66" text-anchor="end">Nexus · Français 2nde</text></svg>