<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 332" width="400" height="332" role="img" aria-labelledby="titre" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif"><title id="titre">Étudier une œuvre : un exemple</title><rect x="1" y="1" width="398" height="330" rx="18" ry="18" fill="#fffdf8" stroke="#e7dcc8" stroke-width="2"/><text x="200.0" y="34.0" font-size="18" font-weight="bold" fill="#7e22ce" text-anchor="middle">Étudier une œuvre : un exemple</text><text x="200.0" y="59.0" font-size="13" font-weight="normal" fill="#5b4b3a" text-anchor="middle" font-style="italic">Structure, Personnages, Thèmes, Contexte</text><rect x="20" y="85.9" width="360" height="30.5" fill="#7e22ce"/><line x1="128.0" y1="85.9" x2="128.0" y2="116.4" stroke="#e2d4bf" stroke-width="1"/><text x="28.0" y="104.9" font-size="13.5" font-weight="bold" fill="#ffffff" text-anchor="start">Entrée</text><text x="136.0" y="104.9" font-size="13.5" font-weight="bold" fill="#ffffff" text-anchor="start">Camara Laye, L’Enfant noir (1953)</text><rect x="20" y="116.4" width="360" height="47.0" fill="#f6efe3"/><line x1="128.0" y1="116.4" x2="128.0" y2="163.4" stroke="#e2d4bf" stroke-width="1"/><text x="28.0" y="135.4" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">Structure</text><text x="136.0" y="135.4" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">Kouroussa et Tindican → l’école et</text><text x="136.0" y="151.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">Conakry → le départ pour la France</text><rect x="20" y="163.4" width="360" height="47.0" fill="#fffaf0"/><line x1="128.0" y1="163.4" x2="128.0" y2="210.4" stroke="#e2d4bf" stroke-width="1"/><text x="28.0" y="182.4" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">Personnages</text><text x="136.0" y="182.4" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">le narrateur, le père forgeron, la</text><text x="136.0" y="198.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">mère, la famille</text><rect x="20" y="210.4" width="360" height="47.0" fill="#f6efe3"/><line x1="128.0" y1="210.4" x2="128.0" y2="257.4" stroke="#e2d4bf" stroke-width="1"/><text x="28.0" y="229.4" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">Thèmes</text><text x="136.0" y="229.4" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">enfance, tradition et sacré, la</text><text x="136.0" y="245.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">mère, l’école, l’exil</text><rect x="20" y="257.4" width="360" height="47.0" fill="#fffaf0"/><line x1="128.0" y1="257.4" x2="128.0" y2="304.4" stroke="#e2d4bf" stroke-width="1"/><text x="28.0" y="276.4" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">Contexte</text><text x="136.0" y="276.4" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">1953, période coloniale, livre</text><text x="136.0" y="292.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">écrit à Paris</text><rect x="20" y="85.9" width="360" height="218.49999999999997" rx="6" fill="none" stroke="#c9b8a3" stroke-width="1.5"/><text x="386" y="323" font-size="10" fill="#8a7a66" text-anchor="end">Nexus · Français 2nde</text></svg>