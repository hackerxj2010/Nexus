<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 453" width="400" height="453" role="img" aria-labelledby="titre" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif"><title id="titre">Le plan de route des 4 heures</title><rect x="1" y="1" width="398" height="451" rx="18" ry="18" fill="#fffdf8" stroke="#e7dcc8" stroke-width="2"/><text x="200.0" y="34.0" font-size="18" font-weight="bold" fill="#7e22ce" text-anchor="middle">Le plan de route des 4 heures</text><text x="200.0" y="59.0" font-size="13" font-weight="normal" fill="#5b4b3a" text-anchor="middle" font-style="italic">10 + 50 + 60 + 90 + 20 + 10 = 240 minutes</text><line x1="108" y1="89.9" x2="108" y2="423.9" stroke="#c9b8a3" stroke-width="3"/><rect x="120" y="89.9" width="266" height="49.0" rx="9" fill="#f3e8ff"/><circle cx="108" cy="99.9" r="7" fill="#7e22ce" stroke="#fffdf8" stroke-width="2"/><text x="92.0" y="104.9" font-size="13.5" font-weight="bold" fill="#7e22ce" text-anchor="end">0 h 00</text><text x="130.0" y="104.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">Lire tout le sujet, choisir le sujet</text><text x="130.0" y="121.4" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">B (10 min)</text><rect x="120" y="146.9" width="266" height="32.5" rx="9" fill="#e0f2fe"/><circle cx="108" cy="156.9" r="7" fill="#0369a1" stroke="#fffdf8" stroke-width="2"/><text x="92.0" y="161.9" font-size="13.5" font-weight="bold" fill="#0369a1" text-anchor="end">0 h 10</text><text x="130.0" y="161.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">Partie A : les questions (50 min)</text><rect x="120" y="187.4" width="266" height="65.5" rx="9" fill="#fef3c7"/><circle cx="108" cy="197.4" r="7" fill="#b45309" stroke="#fffdf8" stroke-width="2"/><text x="92.0" y="202.4" font-size="13.5" font-weight="bold" fill="#b45309" text-anchor="end">1 h 00</text><text x="130.0" y="202.4" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">Partie B au brouillon : analyse,</text><text x="130.0" y="218.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">plan détaillé, introduction,</text><text x="130.0" y="235.4" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">conclusion (60 min)</text><rect x="120" y="260.9" width="266" height="49.0" rx="9" fill="#dcfce7"/><circle cx="108" cy="270.9" r="7" fill="#15803d" stroke="#fffdf8" stroke-width="2"/><text x="92.0" y="275.9" font-size="13.5" font-weight="bold" fill="#15803d" text-anchor="end">2 h 00</text><text x="130.0" y="275.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">Rédaction au propre de la partie B</text><text x="130.0" y="292.4" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">(90 min)</text><rect x="120" y="317.9" width="266" height="49.0" rx="9" fill="#ffe4e6"/><circle cx="108" cy="327.9" r="7" fill="#be123c" stroke="#fffdf8" stroke-width="2"/><text x="92.0" y="332.9" font-size="13.5" font-weight="bold" fill="#be123c" text-anchor="end">3 h 30</text><text x="130.0" y="332.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">Relecture ciblée : sens, accords,</text><text x="130.0" y="349.4" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">homophones (20 min)</text><rect x="120" y="374.9" width="266" height="49.0" rx="9" fill="#e0e7ff"/><circle cx="108" cy="384.9" r="7" fill="#4338ca" stroke="#fffdf8" stroke-width="2"/><text x="92.0" y="389.9" font-size="13.5" font-weight="bold" fill="#4338ca" text-anchor="end">3 h 50</text><text x="130.0" y="389.9" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">Sécurité : présentation, numéros,</text><text x="130.0" y="406.4" font-size="13" font-weight="normal" fill="#2b2118" text-anchor="start">nom (10 min)</text><text x="386" y="444" font-size="10" fill="#8a7a66" text-anchor="end">Nexus · Français 2nde</text></svg>