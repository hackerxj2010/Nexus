<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 270" font-family="sans-serif"><title>Le côté d'un carré d'aire 2 est la racine carrée de 2</title><rect x="0" y="0" width="400" height="270" rx="16" fill="#fffdf8"/><rect x="60.0" y="50.0" width="160.0" height="160.0" rx="0" fill="#dbeafe" stroke="#1f2937" stroke-width="2"/><line x1="60.0" y1="210.0" x2="220.0" y2="50.0" stroke="#dc2626" stroke-width="3" stroke-linecap="round"/><text x="140.0" y="232.0" fill="#1f2937" font-size="15" text-anchor="middle">côté 1</text><text x="40.0" y="135.0" fill="#1f2937" font-size="15" text-anchor="middle">1</text><text x="118.0" y="118.0" fill="#dc2626" font-size="18" text-anchor="middle" font-weight="bold">√2</text><text x="140.0" y="36.0" fill="#1f2937" font-size="13" text-anchor="middle">carré de côté 1</text><text x="310.0" y="70.0" fill="#2563eb" font-size="15" text-anchor="middle" font-weight="bold">Règles utiles</text><text x="310.0" y="100.0" fill="#1f2937" font-size="15" text-anchor="middle">aᵐ × aⁿ = aᵐ⁺ⁿ</text><text x="310.0" y="126.0" fill="#1f2937" font-size="15" text-anchor="middle">aᵐ ÷ aⁿ = aᵐ⁻ⁿ</text><text x="310.0" y="152.0" fill="#1f2937" font-size="15" text-anchor="middle">(aᵐ)ⁿ = aᵐⁿ</text><text x="310.0" y="178.0" fill="#1f2937" font-size="15" text-anchor="middle">√a × √b = √(ab)</text><text x="310.0" y="204.0" fill="#1f2937" font-size="15" text-anchor="middle">(√a)² = a</text><text x="200.0" y="258.0" fill="#1f2937" font-size="13" text-anchor="middle">Pythagore : d² = 1² + 1² = 2, donc d = √2</text></svg>
