<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 290" font-family="sans-serif"><title>Aire d'un carré de côté a + b : (a + b)² = a² + 2ab + b²</title><rect x="0" y="0" width="400" height="290" rx="16" fill="#fffdf8"/><rect x="60.0" y="40.0" width="140.0" height="140.0" rx="0" fill="#bfdbfe" stroke="#1f2937" stroke-width="2"/><rect x="200.0" y="40.0" width="80.0" height="140.0" rx="0" fill="#fde68a" stroke="#1f2937" stroke-width="2"/><rect x="60.0" y="180.0" width="140.0" height="80.0" rx="0" fill="#fde68a" stroke="#1f2937" stroke-width="2"/><rect x="200.0" y="180.0" width="80.0" height="80.0" rx="0" fill="#bbf7d0" stroke="#1f2937" stroke-width="2"/><text x="130.0" y="116.0" fill="#1f2937" font-size="20" text-anchor="middle" font-weight="bold">a²</text><text x="240.0" y="116.0" fill="#1f2937" font-size="18" text-anchor="middle" font-weight="bold">ab</text><text x="130.0" y="226.0" fill="#1f2937" font-size="18" text-anchor="middle" font-weight="bold">ab</text><text x="240.0" y="226.0" fill="#1f2937" font-size="18" text-anchor="middle" font-weight="bold">b²</text><text x="130.0" y="32.0" fill="#2563eb" font-size="16" text-anchor="middle" font-style="italic">a</text><text x="240.0" y="32.0" fill="#059669" font-size="16" text-anchor="middle" font-style="italic">b</text><text x="48.0" y="110.0" fill="#2563eb" font-size="16" text-anchor="middle" font-style="italic">a</text><text x="48.0" y="220.0" fill="#059669" font-size="16" text-anchor="middle" font-style="italic">b</text><text x="330.0" y="110.0" fill="#dc2626" font-size="17" text-anchor="middle" font-weight="bold">(a + b)²</text><text x="330.0" y="135.0" fill="#1f2937" font-size="17" text-anchor="middle">=</text><text x="330.0" y="160.0" fill="#dc2626" font-size="17" text-anchor="middle" font-weight="bold">a² + 2ab + b²</text><text x="200.0" y="280.0" fill="#1f2937" font-size="13" text-anchor="middle">Les deux rectangles jaunes donnent le « 2ab ».</text></svg>
