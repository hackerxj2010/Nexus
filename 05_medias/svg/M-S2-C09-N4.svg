<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" font-family="sans-serif"><title>Méthode du pivot de Gauss sur un système de trois équations</title><defs><marker id="ad97706" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker></defs><rect x="0" y="0" width="400" height="400" rx="16" fill="#fffdf8"/><rect x="70.0" y="14.0" width="260.0" height="82.0" rx="10" stroke="#2563eb" fill="#ffffff" stroke-width="2"/><text x="200.0" y="40.0" fill="#1f2937" font-size="15" text-anchor="middle">x + y + z = 6</text><text x="200.0" y="62.0" fill="#1f2937" font-size="15" text-anchor="middle">2x − y + z = 3</text><text x="200.0" y="84.0" fill="#1f2937" font-size="15" text-anchor="middle">x + 2y − z = 2</text><line x1="200.0" y1="100.0" x2="200.0" y2="126.0" stroke="#d97706" stroke-width="2" marker-end="url(#ad97706)" stroke-linecap="round"/><text x="210.0" y="112.0" fill="#d97706" font-size="13" text-anchor="start" font-weight="bold">L₂ ← L₂ − 2L₁</text><text x="210.0" y="127.0" fill="#d97706" font-size="13" text-anchor="start" font-weight="bold">L₃ ← L₃ − L₁</text><rect x="70.0" y="132.0" width="260.0" height="82.0" rx="10" stroke="#7c3aed" fill="#ffffff" stroke-width="2"/><text x="200.0" y="158.0" fill="#1f2937" font-size="15" text-anchor="middle">x + y + z = 6</text><text x="200.0" y="180.0" fill="#1f2937" font-size="15" text-anchor="middle">−3y − z = −9</text><text x="200.0" y="202.0" fill="#1f2937" font-size="15" text-anchor="middle">y − 2z = −4</text><line x1="200.0" y1="218.0" x2="200.0" y2="244.0" stroke="#d97706" stroke-width="2" marker-end="url(#ad97706)" stroke-linecap="round"/><text x="210.0" y="236.0" fill="#d97706" font-size="13" text-anchor="start" font-weight="bold">L₃ ← 3L₃ + L₂</text><rect x="70.0" y="250.0" width="260.0" height="82.0" rx="10" stroke="#059669" fill="#ffffff" stroke-width="2"/><text x="200.0" y="276.0" fill="#1f2937" font-size="15" text-anchor="middle">x + y + z = 6</text><text x="200.0" y="298.0" fill="#1f2937" font-size="15" text-anchor="middle">−3y − z = −9</text><text x="200.0" y="320.0" fill="#1f2937" font-size="15" text-anchor="middle">−7z = −21</text><text x="200.0" y="358.0" fill="#dc2626" font-size="15" text-anchor="middle" font-weight="bold">Remontée : z = 3, puis y = 2, puis x = 1</text></svg>