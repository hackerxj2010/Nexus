<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 370" font-family="sans-serif"><title>Solutions de cos x = 1/2 et de sin x = 1/2 lues sur le cercle trigonométrique</title><defs><marker id="a1f2937" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect x="0" y="0" width="400" height="370" rx="16" fill="#fffdf8"/><line x1="51.0" y1="195.0" x2="349.0" y2="195.0" stroke="#1f2937" stroke-width="1.4" marker-end="url(#a1f2937)" stroke-linecap="round"/><line x1="200.0" y1="344.0" x2="200.0" y2="46.0" stroke="#1f2937" stroke-width="1.4" marker-end="url(#a1f2937)" stroke-linecap="round"/><circle cx="200.0" cy="195.0" r="125.0" stroke="#1f2937" fill="none" stroke-width="2"/><text x="192.0" y="211.0" fill="#6b7280" font-size="13" text-anchor="end">O</text><line x1="262.5" y1="50.0" x2="262.5" y2="340.0" stroke="#2563eb" stroke-width="2.2" stroke-linecap="round"/><line x1="55.0" y1="132.5" x2="345.0" y2="132.5" stroke="#059669" stroke-width="2.2" stroke-linecap="round"/><text x="268.5" y="338.0" fill="#2563eb" font-size="13" text-anchor="start" font-weight="bold">x = 1/2</text><text x="57.0" y="152.5" fill="#059669" font-size="13" text-anchor="start" font-weight="bold">y = 1/2</text><circle cx="262.5" cy="86.7" r="6" fill="#2563eb"/><text x="274.5" y="80.7" fill="#fffdf8" stroke="#fffdf8" stroke-width="4" stroke-linejoin="round" font-size="15" text-anchor="start" font-weight="bold">π/3</text><text x="274.5" y="80.7" fill="#2563eb" font-size="15" text-anchor="start" font-weight="bold">π/3</text><circle cx="262.5" cy="303.3" r="6" fill="#2563eb"/><text x="274.5" y="319.3" fill="#fffdf8" stroke="#fffdf8" stroke-width="4" stroke-linejoin="round" font-size="15" text-anchor="start" font-weight="bold">−π/3</text><text x="274.5" y="319.3" fill="#2563eb" font-size="15" text-anchor="start" font-weight="bold">−π/3</text><circle cx="308.3" cy="132.5" r="6" fill="#059669"/><text x="320.3" y="126.5" fill="#fffdf8" stroke="#fffdf8" stroke-width="4" stroke-linejoin="round" font-size="15" text-anchor="start" font-weight="bold">π/6</text><text x="320.3" y="126.5" fill="#059669" font-size="15" text-anchor="start" font-weight="bold">π/6</text><circle cx="91.7" cy="132.5" r="6" fill="#059669"/><text x="79.7" y="126.5" fill="#fffdf8" stroke="#fffdf8" stroke-width="4" stroke-linejoin="round" font-size="15" text-anchor="end" font-weight="bold">5π/6</text><text x="79.7" y="126.5" fill="#059669" font-size="15" text-anchor="end" font-weight="bold">5π/6</text><text x="200.0" y="26.0" fill="#2563eb" font-size="15" text-anchor="middle" font-weight="bold">cos x = 1/2  ⇔  x = ±π/3 + 2kπ</text><text x="200.0" y="355.0" fill="#059669" font-size="14" text-anchor="middle" font-weight="bold">sin x = 1/2  ⇔  x = π/6 + 2kπ ou 5π/6 + 2kπ</text></svg>