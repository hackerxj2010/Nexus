<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 330" font-family="sans-serif"><title>Triangle ABC avec AB = 5, AC = 8, angle A = 60°, BC = 7 et médiane [AI]</title><rect x="0" y="0" width="400" height="330" rx="16" fill="#fffdf8"/><polygon points="40.0,290.0 190.0,290.0 160.0,82.2" stroke="#1f2937" fill="none" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><line x1="40.0" y1="290.0" x2="175.0" y2="186.1" stroke="#7c3aed" stroke-width="2" stroke-dasharray="7 5" stroke-linecap="round"/><path d="M70.0,289.4 A30.0,30.0 0 0 0 55.5,264.3" stroke="#dc2626" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="82.0" y="278.0" fill="#dc2626" font-size="14" text-anchor="start" font-weight="bold">60°</text><circle cx="40.0" cy="290.0" r="4" fill="#1f2937"/><text x="32.0" y="306.0" fill="#1f2937" font-size="16" text-anchor="end" font-weight="bold">A</text><circle cx="190.0" cy="290.0" r="4" fill="#1f2937"/><text x="198.0" y="306.0" fill="#1f2937" font-size="16" text-anchor="start" font-weight="bold">B</text><circle cx="160.0" cy="82.2" r="4" fill="#1f2937"/><text x="160.0" y="72.2" fill="#1f2937" font-size="16" text-anchor="middle" font-weight="bold">C</text><circle cx="175.0" cy="186.1" r="4" fill="#1f2937"/><text x="185.0" y="190.1" fill="#1f2937" font-size="16" text-anchor="start" font-weight="bold">I</text><text x="115.0" y="310.0" fill="#2563eb" font-size="15" text-anchor="middle" font-weight="bold">5</text><text x="88.0" y="186.1" fill="#2563eb" font-size="15" text-anchor="end" font-weight="bold">8</text><text x="189.0" y="208.1" fill="#059669" font-size="15" text-anchor="start" font-weight="bold">7</text><rect x="204.0" y="30.0" width="188.0" height="124.0" rx="10" stroke="#e5e7eb" fill="#ffffff" stroke-width="1.4"/><text x="212.0" y="52.0" fill="#059669" font-size="13" text-anchor="start" font-weight="bold">Al-Kashi :</text><text x="212.0" y="72.0" fill="#1f2937" font-size="13" text-anchor="start">BC² = 25 + 64 − 40 = 49</text><text x="212.0" y="92.0" fill="#1f2937" font-size="13" text-anchor="start">donc BC = 7</text><text x="212.0" y="118.0" fill="#7c3aed" font-size="13" text-anchor="start" font-weight="bold">Médiane [AI] :</text><text x="212.0" y="138.0" fill="#7c3aed" font-size="13" text-anchor="start">AB² + AC² = 2AI² + ½BC²</text></svg>