<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 230" width="400" height="230" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
<title>Enregistrement d'un mouvement rectiligne accéléré et vitesse instantanée</title>
<rect x="0" y="0" width="400" height="230" rx="18" fill="#fffdf8"/>
<text x="200.0" y="28.0" font-size="14" text-anchor="middle" fill="#1f2937" font-weight="normal">Écarts croissants, τ constant : mouvement accéléré</text>
<line x1="18.0" y1="105.0" x2="385.0" y2="105.0" stroke="#6b7280" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 4"/>
<circle cx="28.0" cy="105.0" r="5.0" stroke="#1f2937" stroke-width="1" fill="#1f2937"/>
<text x="28.0" y="129.0" font-size="14" text-anchor="middle" fill="#1f2937" font-weight="normal">M₀</text>
<circle cx="50.0" cy="105.0" r="5.0" stroke="#1f2937" stroke-width="1" fill="#1f2937"/>
<text x="50.0" y="129.0" font-size="14" text-anchor="middle" fill="#1f2937" font-weight="normal">M₁</text>
<circle cx="78.0" cy="105.0" r="5.0" stroke="#1f2937" stroke-width="1" fill="#1f2937"/>
<text x="78.0" y="129.0" font-size="14" text-anchor="middle" fill="#1f2937" font-weight="normal">M₂</text>
<circle cx="112.0" cy="105.0" r="5.0" stroke="#1f2937" stroke-width="1" fill="#1f2937"/>
<text x="112.0" y="129.0" font-size="14" text-anchor="middle" fill="#1f2937" font-weight="normal">M₃</text>
<circle cx="153.0" cy="105.0" r="5.0" stroke="#1f2937" stroke-width="1" fill="#1f2937"/>
<text x="153.0" y="129.0" font-size="14" text-anchor="middle" fill="#1f2937" font-weight="normal">M₄</text>
<circle cx="201.0" cy="105.0" r="5.0" stroke="#1f2937" stroke-width="1" fill="#1f2937"/>
<text x="201.0" y="129.0" font-size="14" text-anchor="middle" fill="#1f2937" font-weight="normal">M₅</text>
<circle cx="256.0" cy="105.0" r="5.0" stroke="#1f2937" stroke-width="1" fill="#1f2937"/>
<text x="256.0" y="129.0" font-size="14" text-anchor="middle" fill="#1f2937" font-weight="normal">M₆</text>
<line x1="78.0" y1="85.0" x2="153.0" y2="85.0" stroke="#15803d" stroke-width="2" stroke-linecap="round"/>
<line x1="78.0" y1="79.0" x2="78.0" y2="91.0" stroke="#15803d" stroke-width="2" stroke-linecap="round"/>
<line x1="153.0" y1="79.0" x2="153.0" y2="91.0" stroke="#15803d" stroke-width="2" stroke-linecap="round"/>
<text x="167.0" y="61.0" font-size="13" text-anchor="start" fill="#15803d" font-weight="normal">M₂M₄ parcouru en 2τ</text>
<line x1="165.0" y1="57.0" x2="130.0" y2="83.0" stroke="#15803d" stroke-width="1" stroke-linecap="round"/>
<line x1="112.0" y1="139.0" x2="112.0" y2="155.0" stroke="#c0262d" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 3"/>
<line x1="112.0" y1="155.0" x2="196.0" y2="155.0" stroke="#c0262d" stroke-width="3" stroke-linecap="butt"/>
<polygon points="207.0,155.0 196.0,160.5 196.0,149.5" stroke="#c0262d" stroke-width="1" fill="#c0262d" stroke-linejoin="round"/>
<text x="217.0" y="160.0" font-size="14" text-anchor="start" fill="#c0262d" font-weight="normal">vecteur v₃</text>
<text x="217.0" y="178.0" font-size="12" text-anchor="start" fill="#c0262d" font-weight="normal">(sens du mouvement)</text>
<text x="200.0" y="212.0" font-size="18" text-anchor="middle" fill="#1f2937" font-weight="bold">v₃ ≈ M₂M₄ / (2τ)</text>
</svg>
