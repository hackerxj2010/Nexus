<circle cx="130.0" cy="80.0" r="4.0" stroke="#1f2937" stroke-width="1" fill="#1f2937"/>
<text x="124.0" y="72.0" font-size="14" text-anchor="end" fill="#1f2937" font-weight="bold">A</text>
<line x1="130.0" y1="80.0" x2="370.0" y2="80.0" stroke="#6b7280" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 4"/>
<text x="372.0" y="72.0" font-size="12" text-anchor="end" fill="#6b7280" font-weight="normal">droite d'action</text>
<line x1="130.0" y1="80.0" x2="239.0" y2="80.0" stroke="#c0262d" stroke-width="3.5" stroke-linecap="butt"/>
