<line x1="325.0" y1="111.0" x2="317.0" y2="119.0" stroke="#6b7280" stroke-width="1" stroke-linecap="round"/>
<line x1="355.0" y1="111.0" x2="347.0" y2="119.0" stroke="#6b7280" stroke-width="1" stroke-linecap="round"/>
