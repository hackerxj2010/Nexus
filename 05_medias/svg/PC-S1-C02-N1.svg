<text x="222.0" y="278.0" font-size="13" text-anchor="start" fill="#c2410c" font-weight="normal">livre / table</text>
<text x="200.0" y="296.0" font-size="12" text-anchor="middle" fill="#6b7280" font-weight="normal">même intensité, sens opposés</text>
