<polygon points="91.7,171.2 83.3,180.1 79.5,169.8" stroke="#c0262d" stroke-width="1" fill="#c0262d" stroke-linejoin="round"/>
<circle cx="203.0" cy="241.8" r="6.0" stroke="#1f2937" stroke-width="1" fill="#1f2937"/>
