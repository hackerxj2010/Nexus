<polygon points="181.0,203.7 191.3,210.5 181.7,216.0" stroke="#c0262d" stroke-width="1" fill="#c0262d" stroke-linejoin="round"/>
<text x="150.0" y="268.0" font-size="14" text-anchor="middle" fill="#c0262d" font-weight="bold">P toujours vers le centre</text>
<line x1="300.0" y1="50.0" x2="360.0" y2="50.0" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/>
<line x1="330.0" y1="50.0" x2="330.0" y2="150.0" stroke="#1f2937" stroke-width="1.5" stroke-linecap="round"/>
<polygon points="321.0,150.0 339.0,150.0 330.0,172.0" stroke="#1f2937" stroke-width="2" fill="#6b7280" stroke-linejoin="round"/>
<text x="330.0" y="196.0" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="normal">fil à plomb :</text>
<text x="330.0" y="213.0" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="normal">la verticale</text>
<text x="330.0" y="240.0" font-size="16" text-anchor="middle" fill="#1f2937" font-weight="bold">P = m × g</text>
<text x="330.0" y="30.0" font-size="12" text-anchor="middle" fill="#6b7280" font-weight="normal">g Lomé ≈ 9,78 N/kg</text>
