<circle cx="150.0" cy="44.0" r="6.0" stroke="#1f2937" stroke-width="1" fill="#1f2937"/>
<line x1="150.0" y1="44.0" x2="150.0" y2="77.0" stroke="#c0262d" stroke-width="3" stroke-linecap="butt"/>
<polygon points="150.0,88.0 144.5,77.0 155.5,77.0" stroke="#c0262d" stroke-width="1" fill="#c0262d" stroke-linejoin="round"/>
<text x="150.0" y="32.0" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="normal">pôle Nord</text>
<circle cx="255.4" cy="138.9" r="6.0" stroke="#1f2937" stroke-width="1" fill="#1f2937"/>
<line x1="255.4" y1="138.9" x2="222.6" y2="142.4" stroke="#c0262d" stroke-width="3" stroke-linecap="butt"/>
<polygon points="211.7,143.5 222.0,136.9 223.2,147.8" stroke="#c0262d" stroke-width="1" fill="#c0262d" stroke-linejoin="round"/>
<text x="265.4" y="126.9" font-size="13" text-anchor="start" fill="#1f2937" font-weight="normal">Lomé</text>
<circle cx="50.4" cy="186.3" r="6.0" stroke="#1f2937" stroke-width="1" fill="#1f2937"/>
