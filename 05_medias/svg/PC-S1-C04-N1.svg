<text x="200.0" y="30.0" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="bold">M = F × d   avec   d = OA × sin β</text>
<text x="200.0" y="250.0" font-size="13" text-anchor="middle" fill="#1d4ed8" font-weight="normal">d : distance de l'axe à la DROITE D'ACTION</text>
