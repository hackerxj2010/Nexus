<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 230" width="400" height="230" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
<title>Levier : théorème des moments</title>
<rect x="0" y="0" width="400" height="230" rx="18" fill="#fffdf8"/>
<polygon points="130.0,130.0 112.0,160.0 148.0,160.0" stroke="#1f2937" stroke-width="2" fill="#d1d5db" stroke-linejoin="round"/>
<line x1="30.0" y1="160.0" x2="380.0" y2="160.0" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
<rect x="30.0" y="122.0" width="345.0" height="8.0" rx="3" stroke="#1f2937" stroke-width="2" fill="#9ca3af"/>
<rect x="32.0" y="80.0" width="40.0" height="42.0" rx="4" stroke="#1f2937" stroke-width="2" fill="#f3e8d6"/>
<line x1="60.0" y1="122.0" x2="60.0" y2="179.0" stroke="#c0262d" stroke-width="3.5" stroke-linecap="butt"/>
<polygon points="60.0,190.0 54.5,179.0 65.5,179.0" stroke="#c0262d" stroke-width="1" fill="#c0262d" stroke-linejoin="round"/>
<text x="50.0" y="188.0" font-size="16" text-anchor="end" fill="#c0262d" font-weight="bold">P</text>
<line x1="340.0" y1="99.3" x2="340.0" y2="111.0" stroke="#15803d" stroke-width="3.5" stroke-linecap="butt"/>
<polygon points="340.0,122.0 334.5,111.0 345.5,111.0" stroke="#15803d" stroke-width="1" fill="#15803d" stroke-linejoin="round"/>
<text x="348.0" y="110.0" font-size="16" text-anchor="start" fill="#15803d" font-weight="bold">F</text>
<line x1="60.0" y1="180.0" x2="130.0" y2="180.0" stroke="#c2410c" stroke-width="1.5" stroke-linecap="round"/>
<line x1="60.0" y1="175.0" x2="60.0" y2="185.0" stroke="#c2410c" stroke-width="1.5" stroke-linecap="round"/>
<line x1="130.0" y1="175.0" x2="130.0" y2="185.0" stroke="#c2410c" stroke-width="1.5" stroke-linecap="round"/>
<text x="101.0" y="198.0" font-size="15" text-anchor="middle" fill="#c2410c" font-weight="normal">d₁</text>
<line x1="130.0" y1="180.0" x2="340.0" y2="180.0" stroke="#1d4ed8" stroke-width="1.5" stroke-linecap="round"/>
<line x1="340.0" y1="175.0" x2="340.0" y2="185.0" stroke="#1d4ed8" stroke-width="1.5" stroke-linecap="round"/>
<text x="235.0" y="198.0" font-size="15" text-anchor="middle" fill="#1d4ed8" font-weight="normal">d₂</text>
<text x="130.0" y="110.0" font-size="12" text-anchor="middle" fill="#6b7280" font-weight="normal">axe</text>
<text x="200.0" y="30.0" font-size="16" text-anchor="middle" fill="#1f2937" font-weight="bold">Équilibre : F × d₂ = P × d₁</text>
<text x="200.0" y="52.0" font-size="13" text-anchor="middle" fill="#6b7280" font-weight="normal">grand bras de levier → petite force</text>
