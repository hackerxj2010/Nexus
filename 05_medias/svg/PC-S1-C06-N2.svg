<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 270" width="400" height="270" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
<title>Notation symbolique du noyau et isotopes</title>
<rect x="0" y="0" width="400" height="270" rx="18" fill="#fffdf8"/>
<text x="185.0" y="125.0" font-size="64" text-anchor="middle" fill="#1f2937" font-weight="bold">Na</text>
<text x="138.0" y="74.0" font-size="28" text-anchor="end" fill="#c0262d" font-weight="bold">23</text>
<text x="138.0" y="125.0" font-size="28" text-anchor="end" fill="#1d4ed8" font-weight="bold">11</text>
<line x1="70.0" y1="44.0" x2="100.0" y2="58.0" stroke="#c0262d" stroke-width="1.5" stroke-linecap="round"/>
<text x="20.0" y="35.0" font-size="13" text-anchor="start" fill="#c0262d" font-weight="normal">A = nombre de nucléons</text>
<line x1="70.0" y1="152.0" x2="100.0" y2="132.0" stroke="#1d4ed8" stroke-width="1.5" stroke-linecap="round"/>
<text x="20.0" y="165.0" font-size="13" text-anchor="start" fill="#1d4ed8" font-weight="normal">Z = nombre de protons</text>
<text x="388.0" y="75.0" font-size="15" text-anchor="end" fill="#1f2937" font-weight="bold">N = A − Z</text>
<text x="388.0" y="97.0" font-size="14" text-anchor="end" fill="#1f2937" font-weight="normal">= 23 − 11 = 12</text>
<text x="388.0" y="117.0" font-size="13" text-anchor="end" fill="#6b7280" font-weight="normal">neutrons</text>
<line x1="20.0" y1="190.0" x2="380.0" y2="190.0" stroke="#6b7280" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 4"/>
<text x="200.0" y="212.0" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="bold">Isotopes de l'hydrogène (même Z = 1)</text>
<circle cx="45.0" cy="242.0" r="7.0" stroke="#1f2937" stroke-width="1" fill="#c0262d"/>
<text x="97.0" y="238.0" font-size="14" text-anchor="start" fill="#1f2937" font-weight="bold">¹₁H</text>
<text x="97.0" y="256.0" font-size="11" text-anchor="start" fill="#6b7280" font-weight="normal">hydrogène</text>
<circle cx="170.0" cy="242.0" r="7.0" stroke="#1f2937" stroke-width="1" fill="#c0262d"/>
<circle cx="184.0" cy="242.0" r="7.0" stroke="#1f2937" stroke-width="1" fill="#9ca3af"/>
<text x="222.0" y="238.0" font-size="14" text-anchor="start" fill="#1f2937" font-weight="bold">²₁H</text>
<text x="222.0" y="256.0" font-size="11" text-anchor="start" fill="#6b7280" font-weight="normal">deutérium</text>
<circle cx="295.0" cy="242.0" r="7.0" stroke="#1f2937" stroke-width="1" fill="#c0262d"/>
<circle cx="309.0" cy="242.0" r="7.0" stroke="#1f2937" stroke-width="1" fill="#9ca3af"/>
<circle cx="322.0" cy="242.0" r="7.0" stroke="#1f2937" stroke-width="1" fill="#9ca3af"/>
<text x="347.0" y="238.0" font-size="14" text-anchor="start" fill="#1f2937" font-weight="bold">³₁H</text>
<text x="347.0" y="256.0" font-size="11" text-anchor="start" fill="#6b7280" font-weight="normal">tritium</text>
</svg>
