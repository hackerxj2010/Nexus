<text x="220.0" y="178.0" font-size="14" text-anchor="end" fill="#1f2937" font-weight="bold">B</text>
<polyline points="230.0,95.0 310.0,95.0 310.0,165.0 230.0,165.0" stroke="#1f2937" stroke-width="2" fill="none" stroke-linejoin="round"/>
<circle cx="310.0" cy="130.0" r="14.0" stroke="#1f2937" stroke-width="2" fill="#fffdf8"/>
<text x="310.0" y="135.5" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="bold">V</text>
<text x="322.0" y="108.0" font-size="12" text-anchor="start" fill="#6b7280" font-weight="normal">borne V</text>
<text x="322.0" y="162.0" font-size="12" text-anchor="start" fill="#6b7280" font-weight="normal">COM</text>
<line x1="208.0" y1="158.0" x2="208.0" y2="111.0" stroke="#15803d" stroke-width="2.2" stroke-linecap="butt"/>
<polygon points="208.0,102.0 212.5,111.0 203.5,111.0" stroke="#15803d" stroke-width="1" fill="#15803d" stroke-linejoin="round"/>
<text x="200.0" y="135.0" font-size="14" text-anchor="end" fill="#15803d" font-weight="bold">U<tspan dy="4" font-size="10">AB</tspan><tspan dy="-4">​</tspan></text>
<rect x="20.0" y="222.0" width="360.0" height="38.0" rx="8" stroke="#15803d" stroke-width="1.5" fill="#fffdf8"/>
<text x="200.0" y="238.0" font-size="13" text-anchor="middle" fill="#15803d" font-weight="bold">U<tspan dy="4" font-size="9">AB</tspan><tspan dy="-4">​</tspan> = V<tspan dy="4" font-size="9">A</tspan><tspan dy="-4">​</tspan> − V<tspan dy="4" font-size="9">B</tspan><tspan dy="-4">​</tspan> : la flèche pointe vers A</text>
<text x="200.0" y="254.0" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="normal">borne V reliée à A, borne COM reliée à B</text>
