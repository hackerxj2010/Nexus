<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 270" width="400" height="270" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
<title>Mesure de la tension U_AB aux bornes d'une lampe avec un voltmètre branché en dérivation</title>
<rect x="0" y="0" width="400" height="270" rx="18" fill="#fffdf8"/>
<polyline points="40.0,60.0 230.0,60.0 230.0,200.0 40.0,200.0 40.0,60.0" stroke="#1f2937" stroke-width="2" fill="none" stroke-linejoin="round"/>
<rect x="22.0" y="125.0" width="36.0" height="10.0" rx="0" stroke="#fffdf8" stroke-width="0" fill="#fffdf8"/>
<line x1="24.0" y1="125.0" x2="56.0" y2="125.0" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
<line x1="32.0" y1="135.0" x2="48.0" y2="135.0" stroke="#1f2937" stroke-width="5" stroke-linecap="butt"/>
<text x="18.0" y="123.0" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="bold">+</text>
<text x="18.0" y="147.0" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="bold">−</text>
<rect x="114.0" y="57.0" width="32.0" height="6.0" rx="0" stroke="#fffdf8" stroke-width="0" fill="#fffdf8"/>
<circle cx="114.0" cy="60.0" r="3.0" stroke="#1f2937" stroke-width="1" fill="#1f2937"/>
<circle cx="146.0" cy="60.0" r="3.0" stroke="#1f2937" stroke-width="1" fill="#1f2937"/>
<line x1="114.0" y1="60.0" x2="146.0" y2="60.0" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
<circle cx="230.0" cy="130.0" r="13.0" stroke="#1f2937" stroke-width="2" fill="#fffdf8"/>
<line x1="220.8" y1="120.8" x2="239.2" y2="139.2" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
<line x1="220.8" y1="139.2" x2="239.2" y2="120.8" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
<circle cx="230.0" cy="95.0" r="4.0" stroke="#1f2937" stroke-width="1" fill="#1f2937"/>
<circle cx="230.0" cy="165.0" r="4.0" stroke="#1f2937" stroke-width="1" fill="#1f2937"/>
