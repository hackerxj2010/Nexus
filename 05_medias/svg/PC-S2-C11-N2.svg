<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 270" width="400" height="270" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
<title>Associations de conducteurs ohmiques en série et en dérivation, avec R1 = 100 ohms et R2 = 150 ohms</title>
<rect x="0" y="0" width="400" height="270" rx="18" fill="#fffdf8"/>
<text x="200.0" y="28.0" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="bold">En série</text>
<polyline points="40.0,70.0 360.0,70.0" stroke="#1f2937" stroke-width="2" fill="none" stroke-linejoin="round"/>
<circle cx="40.0" cy="70.0" r="4.0" stroke="#1f2937" stroke-width="1" fill="#1f2937"/>
<circle cx="360.0" cy="70.0" r="4.0" stroke="#1f2937" stroke-width="1" fill="#1f2937"/>
<rect x="118.0" y="62.0" width="44.0" height="16.0" rx="0" stroke="#1f2937" stroke-width="2" fill="#fffdf8"/>
<text x="140.0" y="52.0" font-size="14" text-anchor="middle" fill="#1f2937" font-weight="normal">R₁ = 100 Ω</text>
<rect x="238.0" y="62.0" width="44.0" height="16.0" rx="0" stroke="#1f2937" stroke-width="2" fill="#fffdf8"/>
<text x="260.0" y="52.0" font-size="14" text-anchor="middle" fill="#1f2937" font-weight="normal">R₂ = 150 Ω</text>
<text x="200.0" y="108.0" font-size="14" text-anchor="middle" fill="#1d4ed8" font-weight="bold">R = R₁ + R₂ = 250 Ω</text>
<line x1="20.0" y1="125.0" x2="380.0" y2="125.0" stroke="#e5e7eb" stroke-width="1.5" stroke-linecap="round"/>
<text x="200.0" y="150.0" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="bold">En dérivation</text>
<polyline points="40.0,205.0 120.0,205.0" stroke="#1f2937" stroke-width="2" fill="none" stroke-linejoin="round"/>
<polyline points="280.0,205.0 360.0,205.0" stroke="#1f2937" stroke-width="2" fill="none" stroke-linejoin="round"/>
<polyline points="120.0,175.0 120.0,235.0" stroke="#1f2937" stroke-width="2" fill="none" stroke-linejoin="round"/>
<polyline points="280.0,175.0 280.0,235.0" stroke="#1f2937" stroke-width="2" fill="none" stroke-linejoin="round"/>
<polyline points="120.0,175.0 280.0,175.0" stroke="#1f2937" stroke-width="2" fill="none" stroke-linejoin="round"/>
<polyline points="120.0,235.0 280.0,235.0" stroke="#1f2937" stroke-width="2" fill="none" stroke-linejoin="round"/>
<circle cx="120.0" cy="205.0" r="4.0" stroke="#1f2937" stroke-width="1" fill="#1f2937"/>
<circle cx="280.0" cy="205.0" r="4.0" stroke="#1f2937" stroke-width="1" fill="#1f2937"/>
<circle cx="40.0" cy="205.0" r="4.0" stroke="#1f2937" stroke-width="1" fill="#1f2937"/>
<circle cx="360.0" cy="205.0" r="4.0" stroke="#1f2937" stroke-width="1" fill="#1f2937"/>
<rect x="178.0" y="167.0" width="44.0" height="16.0" rx="0" stroke="#1f2937" stroke-width="2" fill="#fffdf8"/>
<rect x="178.0" y="227.0" width="44.0" height="16.0" rx="0" stroke="#1f2937" stroke-width="2" fill="#fffdf8"/>
<text x="232.0" y="165.0" font-size="13" text-anchor="start" fill="#1f2937" font-weight="normal">R₁</text>
<text x="232.0" y="225.0" font-size="13" text-anchor="start" fill="#1f2937" font-weight="normal">R₂</text>
<text x="200.0" y="262.0" font-size="13" text-anchor="middle" fill="#1d4ed8" font-weight="bold">1/R = 1/R₁ + 1/R₂ → R = R₁R₂/(R₁+R₂) = 60 Ω</text>
</svg>
