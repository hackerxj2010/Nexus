<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="400" height="280" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
<title>Réfraction de l'air vers l'eau : i1 = 50°, i2 = 35,2° (n eau = 1,33) ; le rayon réfracté se rapproche de la normale</title>
<rect x="0" y="0" width="400" height="280" rx="18" fill="#fffdf8"/>
<rect x="12.0" y="140.0" width="376.0" height="128.0" rx="0" stroke="#dbeafe" stroke-width="0" fill="#dbeafe"/>
<line x1="12.0" y1="140.0" x2="388.0" y2="140.0" stroke="#1d4ed8" stroke-width="2" stroke-linecap="round"/>
<line x1="200.0" y1="22.0" x2="200.0" y2="262.0" stroke="#6b7280" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="5 4"/>
<text x="206.0" y="30.0" font-size="11" text-anchor="start" fill="#6b7280" font-weight="normal">normale</text>
<text x="30.0" y="40.0" font-size="13" text-anchor="start" fill="#1f2937" font-weight="normal">air  (n₁ = 1,00)</text>
<text x="30.0" y="258.0" font-size="13" text-anchor="start" fill="#1d4ed8" font-weight="normal">eau  (n₂ = 1,33)</text>
<line x1="104.2" y1="59.7" x2="200.0" y2="140.0" stroke="#c0262d" stroke-width="2.4" stroke-linecap="round"/>
<polygon points="155.6,102.7 145.5,100.7 151.9,93.1" stroke="#c0262d" stroke-width="1" fill="#c0262d" stroke-linejoin="round"/>
<line x1="200.0" y1="140.0" x2="272.0" y2="242.2" stroke="#c0262d" stroke-width="2.4" stroke-linecap="round"/>
<polygon points="238.6,194.8 229.4,190.3 237.5,184.6" stroke="#c0262d" stroke-width="1" fill="#c0262d" stroke-linejoin="round"/>
<line x1="200.0" y1="140.0" x2="265.1" y2="85.4" stroke="#f2a3a6" stroke-width="1.5" stroke-linecap="round"/>
<polygon points="236.0,109.8 232.3,119.4 225.9,111.8" stroke="#f2a3a6" stroke-width="1" fill="#f2a3a6" stroke-linejoin="round"/>
<text x="269.1" y="83.4" font-size="11" text-anchor="start" fill="#b4545a" font-weight="normal">réfléchi (faible)</text>
<path d="M 200.0 92.0 A 48.0 48.0 0 0 0 163.2 109.1" stroke="#1f2937" stroke-width="1.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M 227.6 179.2 A 48.0 48.0 0 0 1 200.0 188.0" stroke="#1f2937" stroke-width="1.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<text x="150.0" y="122.0" font-size="13" text-anchor="end" fill="#1f2937" font-weight="bold">i₁ = 50°</text>
<text x="222.0" y="214.0" font-size="13" text-anchor="start" fill="#1f2937" font-weight="bold">i₂ = 35,2°</text>
<text x="300.0" y="250.0" font-size="13" text-anchor="middle" fill="#1d4ed8" font-weight="bold">n₁ sin i₁ = n₂ sin i₂</text>
</svg>
