<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="400" height="260" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
<title>Calcul de masses molaires moléculaires : M(H2O) = 18,0 g/mol et M(CO2) = 44,0 g/mol</title>
<rect x="0" y="0" width="400" height="260" rx="18" fill="#fffdf8"/>
<text x="200.0" y="28.0" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="bold">Masse molaire moléculaire</text>
<circle cx="90.0" cy="85.0" r="22.0" stroke="#1f2937" stroke-width="1.5" fill="#f87171"/>
<text x="90.0" y="89.5" font-size="19" text-anchor="middle" fill="#1f2937" font-weight="bold">O</text>
<circle cx="60.0" cy="112.0" r="13.0" stroke="#1f2937" stroke-width="1.5" fill="#ffffff"/>
<text x="60.0" y="116.5" font-size="11" text-anchor="middle" fill="#1f2937" font-weight="bold">H</text>
<circle cx="120.0" cy="112.0" r="13.0" stroke="#1f2937" stroke-width="1.5" fill="#ffffff"/>
<text x="120.0" y="116.5" font-size="11" text-anchor="middle" fill="#1f2937" font-weight="bold">H</text>
<text x="90.0" y="150.0" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="bold">H₂O</text>
<text x="260.0" y="75.0" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="normal">M(H₂O) = 2 M(H) + M(O)</text>
<text x="260.0" y="97.0" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="normal">= 2 × 1,0 + 16,0</text>
<text x="260.0" y="120.0" font-size="15" text-anchor="middle" fill="#1d4ed8" font-weight="bold">= 18,0 g/mol</text>
<line x1="20.0" y1="165.0" x2="380.0" y2="165.0" stroke="#e5e7eb" stroke-width="1.5" stroke-linecap="round"/>
<circle cx="50.0" cy="210.0" r="18.0" stroke="#1f2937" stroke-width="1.5" fill="#f87171"/>
<text x="50.0" y="214.5" font-size="16" text-anchor="middle" fill="#1f2937" font-weight="bold">O</text>
<circle cx="88.0" cy="210.0" r="20.0" stroke="#1f2937" stroke-width="1.5" fill="#4b5563"/>
<text x="88.0" y="214.5" font-size="18" text-anchor="middle" fill="#ffffff" font-weight="bold">C</text>
<circle cx="126.0" cy="210.0" r="18.0" stroke="#1f2937" stroke-width="1.5" fill="#f87171"/>
<text x="126.0" y="214.5" font-size="16" text-anchor="middle" fill="#1f2937" font-weight="bold">O</text>
<text x="88.0" y="248.0" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="bold">CO₂</text>
<text x="260.0" y="192.0" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="normal">M(CO₂) = M(C) + 2 M(O)</text>
<text x="260.0" y="214.0" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="normal">= 12,0 + 2 × 16,0</text>
<text x="260.0" y="237.0" font-size="15" text-anchor="middle" fill="#1d4ed8" font-weight="bold">= 44,0 g/mol</text>
</svg>
