<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 270" width="400" height="270" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
<title>Loi d'Avogadro-Ampère : à 20 °C et sous 1 atm, une mole de dihydrogène, de dioxygène ou de dioxyde de carbone occupe 24,0 L</title>
<rect x="0" y="0" width="400" height="270" rx="18" fill="#fffdf8"/>
<text x="200.0" y="26.0" font-size="14" text-anchor="middle" fill="#1f2937" font-weight="bold">À 20 °C et 1,013 × 10⁵ Pa</text>
<path d="M 70 150 C 8 140 15 50 70 48 C 125 50 132 140 70 150 Z" stroke="#1f2937" stroke-width="2" fill="#dbeafe" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M 64 150 L 70 160 L 76 150" stroke="#1f2937" stroke-width="2" fill="#dbeafe" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="70.0" y1="160.0" x2="70.0" y2="178.0" stroke="#6b7280" stroke-width="1.2" stroke-linecap="round"/>
<text x="70.0" y="95.0" font-size="18" text-anchor="middle" fill="#1f2937" font-weight="bold">H₂</text>
<text x="70.0" y="120.0" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="normal">1 mol</text>
<text x="70.0" y="198.0" font-size="13" text-anchor="middle" fill="#1d4ed8" font-weight="bold">V = 24,0 L</text>
<text x="70.0" y="216.0" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="normal">m = 2,0 g</text>
<path d="M 200 150 C 138 140 145 50 200 48 C 255 50 262 140 200 150 Z" stroke="#1f2937" stroke-width="2" fill="#fee2e2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M 194 150 L 200 160 L 206 150" stroke="#1f2937" stroke-width="2" fill="#fee2e2" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="200.0" y1="160.0" x2="200.0" y2="178.0" stroke="#6b7280" stroke-width="1.2" stroke-linecap="round"/>
<text x="200.0" y="95.0" font-size="18" text-anchor="middle" fill="#1f2937" font-weight="bold">O₂</text>
<text x="200.0" y="120.0" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="normal">1 mol</text>
<text x="200.0" y="198.0" font-size="13" text-anchor="middle" fill="#1d4ed8" font-weight="bold">V = 24,0 L</text>
<text x="200.0" y="216.0" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="normal">m = 32,0 g</text>
<path d="M 330 150 C 268 140 275 50 330 48 C 385 50 392 140 330 150 Z" stroke="#1f2937" stroke-width="2" fill="#e5e7eb" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M 324 150 L 330 160 L 336 150" stroke="#1f2937" stroke-width="2" fill="#e5e7eb" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="330.0" y1="160.0" x2="330.0" y2="178.0" stroke="#6b7280" stroke-width="1.2" stroke-linecap="round"/>
<text x="330.0" y="95.0" font-size="18" text-anchor="middle" fill="#1f2937" font-weight="bold">CO₂</text>
<text x="330.0" y="120.0" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="normal">1 mol</text>
<text x="330.0" y="198.0" font-size="13" text-anchor="middle" fill="#1d4ed8" font-weight="bold">V = 24,0 L</text>
<text x="330.0" y="216.0" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="normal">m = 44,0 g</text>
<text x="200.0" y="244.0" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="normal">même volume, même nombre de molécules (6,02 × 10²³)</text>
<text x="200.0" y="262.0" font-size="12" text-anchor="middle" fill="#6b7280" font-weight="normal">mais des masses différentes</text>
</svg>
