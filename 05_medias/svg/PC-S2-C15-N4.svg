<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="400" height="280" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
<title>Combustion du butane : complète (flamme bleue, dioxyde de carbone et eau) ou incomplète (flamme jaune, monoxyde de carbone et suie)</title>
<rect x="0" y="0" width="400" height="280" rx="18" fill="#fffdf8"/>
<text x="100.0" y="28.0" font-size="14" text-anchor="middle" fill="#1f2937" font-weight="bold">Combustion complète</text>
<rect x="88.0" y="150.0" width="24.0" height="60.0" rx="0" stroke="#1f2937" stroke-width="2" fill="#d1d5db"/>
<rect x="60.0" y="208.0" width="80.0" height="12.0" rx="3" stroke="#1f2937" stroke-width="2" fill="#9ca3af"/>
<path d="M 100 60 Q 126 110 114 140 Q 100 152 86 140 Q 74 110 100 60 Z" stroke="#2563eb" stroke-width="2" fill="#bfdbfe" stroke-linejoin="round" stroke-linecap="round"/>
<text x="100.0" y="240.0" font-size="12" text-anchor="middle" fill="#6b7280" font-weight="normal">air abondant</text>
<text x="100.0" y="258.0" font-size="13" text-anchor="middle" fill="#1d4ed8" font-weight="bold">CO₂ + H₂O</text>
<text x="100.0" y="274.0" font-size="11" text-anchor="middle" fill="#6b7280" font-weight="normal">flamme bleue</text>
<text x="300.0" y="28.0" font-size="14" text-anchor="middle" fill="#1f2937" font-weight="bold">Combustion incomplète</text>
<rect x="288.0" y="150.0" width="24.0" height="60.0" rx="0" stroke="#1f2937" stroke-width="2" fill="#d1d5db"/>
<rect x="260.0" y="208.0" width="80.0" height="12.0" rx="3" stroke="#1f2937" stroke-width="2" fill="#9ca3af"/>
<path d="M 300 60 Q 326 110 314 140 Q 300 152 286 140 Q 274 110 300 60 Z" stroke="#d97706" stroke-width="2" fill="#fde68a" stroke-linejoin="round" stroke-linecap="round"/>
<text x="300.0" y="240.0" font-size="12" text-anchor="middle" fill="#6b7280" font-weight="normal">manque d'air</text>
<text x="300.0" y="258.0" font-size="13" text-anchor="middle" fill="#c0262d" font-weight="bold">CO + C (suie) + H₂O</text>
<text x="300.0" y="274.0" font-size="11" text-anchor="middle" fill="#6b7280" font-weight="normal">flamme jaune, fumée</text>
<circle cx="318.0" cy="70.0" r="4.0" stroke="#6b7280" stroke-width="0" fill="#9ca3af"/>
<circle cx="327.0" cy="63.0" r="5.0" stroke="#6b7280" stroke-width="0" fill="#9ca3af"/>
<circle cx="336.0" cy="56.0" r="6.0" stroke="#6b7280" stroke-width="0" fill="#9ca3af"/>
<circle cx="345.0" cy="49.0" r="7.0" stroke="#6b7280" stroke-width="0" fill="#9ca3af"/>
<line x1="200.0" y1="40.0" x2="200.0" y2="270.0" stroke="#e5e7eb" stroke-width="1.5" stroke-linecap="round"/>
</svg>
