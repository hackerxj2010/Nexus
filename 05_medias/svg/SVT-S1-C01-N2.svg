<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800" role="img" aria-labelledby="titre desc" font-family="Arial, Helvetica, sans-serif">
<title id="titre">Cellules eucaryotes</title>
<desc id="desc">Schémas d'une cellule animale (membrane plasmique, cytoplasme, noyau, nucléole, mitochondries, réticulum endoplasmique, ribosomes, appareil de Golgi, lysosome, centrosome) et d'une cellule végétale chlorophyllienne (paroi, membrane, grande vacuole, chloroplastes, noyau, mitochondrie, cytoplasme).</desc>
