<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 590" width="600" height="590" role="img" aria-labelledby="titre desc" font-family="Arial, Helvetica, sans-serif">
<title id="titre">Procaryote et eucaryote</title>
<desc id="desc">Comparaison d'une bactérie (paroi, ADN libre, ribosomes, flagelle, 1 à 5 µm) et d'une cellule eucaryote animale (noyau, organites, 10 à 100 µm), puis des deux cellules dessinées à la même échelle (2 µm contre 20 µm).</desc>
<defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="flr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker><marker id="flv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="flb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker></defs>
<rect x="0" y="0" width="600" height="590" rx="22" ry="22" fill="#fffdf8"/>
<text x="300.0" y="36" font-size="22" text-anchor="middle" font-weight="bold" fill="#1f2937">Procaryote et eucaryote</text>
<text x="150" y="75" font-size="18" text-anchor="middle" font-weight="bold" fill="#1f2937">Procaryote (bactérie)</text>
<rect x="70" y="140" width="130" height="62" rx="31" fill="#fde68a" stroke="#92400e" stroke-width="5"/>
<rect x="77" y="147" width="116" height="48" rx="24" fill="#fef9c3" stroke="#b45309" stroke-width="1.5"/>
<path d="M105 170 q10 -14 22 0 q10 14 22 0 q8 -12 16 0" fill="none" stroke="#7c3aed" stroke-width="3"/>
<circle cx="90" cy="160" r="2.6" fill="#0f172a"/>
<circle cx="97" cy="168" r="2.6" fill="#0f172a"/>
<circle cx="175" cy="160" r="2.6" fill="#0f172a"/>
<circle cx="182" cy="168" r="2.6" fill="#0f172a"/>
<circle cx="135" cy="186" r="2.6" fill="#0f172a"/>
<path d="M200 171 q15 -16 30 0 t30 0" fill="none" stroke="#92400e" stroke-width="2.5"/>
<line x1="110" y1="140" x2="95" y2="105" stroke="#374151" stroke-width="1.6"/><circle cx="110" cy="140" r="2.6" fill="#374151"/><text x="95" y="99" font-size="16" text-anchor="middle" font-weight="normal" fill="#1f2937">paroi</text>
<line x1="182" y1="168" x2="195" y2="105" stroke="#374151" stroke-width="1.6"/><circle cx="182" cy="168" r="2.6" fill="#374151"/><text x="195" y="99" font-size="16" text-anchor="middle" font-weight="normal" fill="#1f2937">ribosomes</text>
<line x1="135" y1="172" x2="135" y2="240" stroke="#374151" stroke-width="1.6"/><circle cx="135" cy="172" r="2.6" fill="#374151"/><text x="135" y="260" font-size="16" text-anchor="middle" font-weight="normal" fill="#1f2937">ADN libre (nucléoïde)</text>
<line x1="250" y1="171" x2="262" y2="215" stroke="#374151" stroke-width="1.6"/><circle cx="250" cy="171" r="2.6" fill="#374151"/><text x="262" y="235" font-size="16" text-anchor="middle" font-weight="normal" fill="#1f2937">flagelle</text>
<text x="150" y="300" font-size="16" text-anchor="middle" font-weight="normal" fill="#1f2937">1 à 5 µm</text>
<text x="150" y="320" font-size="16" text-anchor="middle" font-weight="normal" fill="#1f2937">pas de noyau</text>
<text x="150" y="340" font-size="16" text-anchor="middle" font-weight="normal" fill="#1f2937">pas d'organites à membrane</text>
<text x="450" y="75" font-size="18" text-anchor="middle" font-weight="bold" fill="#1f2937">Eucaryote (animale)</text>
<ellipse cx="450" cy="185" rx="110" ry="95" fill="#fef3c7" stroke="#b45309" stroke-width="3"/>
<circle cx="450" cy="185" r="34" fill="#ddd6fe" stroke="#6d28d9" stroke-width="3"/>
<ellipse cx="390" cy="140" rx="19" ry="10" fill="#fecaca" stroke="#b91c1c" stroke-width="2"/>
<ellipse cx="505" cy="240" rx="19" ry="10" fill="#fecaca" stroke="#b91c1c" stroke-width="2"/>
<line x1="390" y1="140" x2="380" y2="100" stroke="#374151" stroke-width="1.6"/><circle cx="390" cy="140" r="2.6" fill="#374151"/><text x="380" y="94" font-size="16" text-anchor="middle" font-weight="normal" fill="#1f2937">organites</text>
<line x1="450" y1="205" x2="450" y2="285" stroke="#374151" stroke-width="1.6"/><circle cx="450" cy="205" r="2.6" fill="#374151"/><text x="450" y="305" font-size="16" text-anchor="middle" font-weight="normal" fill="#1f2937">noyau (enveloppe + ADN)</text>
<text x="450" y="330" font-size="16" text-anchor="middle" font-weight="normal" fill="#1f2937">10 à 100 µm</text>
<text x="450" y="350" font-size="16" text-anchor="middle" font-weight="normal" fill="#1f2937">noyau + organites</text>
<line x1="30" y1="380" x2="570" y2="380" stroke="#d1d5db" stroke-width="1.5"/>
<text x="300" y="410" font-size="18" text-anchor="middle" font-weight="bold" fill="#1f2937">Les deux cellules à la même échelle</text>
<rect x="146" y="466" width="9" height="4" rx="2" fill="#92400e"/>
<text x="150" y="500" font-size="16" text-anchor="middle" font-weight="normal" fill="#1f2937">bactérie ≈ 2 µm</text>
<circle cx="420" cy="468" r="45" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
<circle cx="420" cy="468" r="14" fill="#ddd6fe" stroke="#6d28d9" stroke-width="2"/>
<text x="420" y="535" font-size="16" text-anchor="middle" font-weight="normal" fill="#1f2937">cellule animale ≈ 20 µm</text>
<line x1="105" y1="545" x2="195" y2="545" stroke="#111827" stroke-width="3"/>
<line x1="105" y1="539" x2="105" y2="551" stroke="#111827" stroke-width="2"/>
<line x1="195" y1="539" x2="195" y2="551" stroke="#111827" stroke-width="2"/>
<text x="150" y="572" font-size="16" text-anchor="middle" font-weight="normal" fill="#1f2937">échelle : 20 µm</text>
</svg>
