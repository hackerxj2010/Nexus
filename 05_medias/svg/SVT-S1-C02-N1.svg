<text x="300" y="262" font-size="16" text-anchor="middle" font-weight="normal" fill="#1f2937">Les molécules se déplacent du milieu le plus concentré</text>
<text x="300" y="282" font-size="16" text-anchor="middle" font-weight="normal" fill="#1f2937">vers le moins concentré, jusqu'à l'équilibre.</text>
