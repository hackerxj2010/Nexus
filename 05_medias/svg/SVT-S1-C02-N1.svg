<text x="300.0" y="36" font-size="22" text-anchor="middle" font-weight="bold" fill="#1f2937">Diffusion et membrane plasmique</text>
<text x="300" y="70" font-size="18" text-anchor="middle" font-weight="bold" fill="#1f2937">1. Diffusion d'un colorant dans l'eau</text>
