<text x="100" y="525" font-size="16" text-anchor="middle" font-weight="normal" fill="#1f2937">gonfle puis éclate :</text>
<text x="100" y="546" font-size="17" text-anchor="middle" font-weight="bold" fill="#1f2937">hémolyse</text>
<text x="300" y="525" font-size="16" text-anchor="middle" font-weight="normal" fill="#1f2937">NaCl 9 g/L :</text>
<text x="300" y="546" font-size="17" text-anchor="middle" font-weight="bold" fill="#1f2937">forme normale</text>
<text x="500" y="525" font-size="16" text-anchor="middle" font-weight="normal" fill="#1f2937">perd de l'eau :</text>
<text x="500" y="546" font-size="17" text-anchor="middle" font-weight="bold" fill="#1f2937">se ratatine</text>
<rect x="60" y="570" width="480" height="44" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.6"/><text x="300.0" y="597.95" font-size="17" text-anchor="middle" font-weight="bold" fill="#1f2937">L'eau passe vers le milieu le plus concentré</text>
