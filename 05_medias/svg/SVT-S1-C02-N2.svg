<line x1="442" y1="190" x2="410" y2="190" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#flb)"/>
<line x1="558" y1="190" x2="590" y2="190" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#flb)"/>
<text x="100" y="266" font-size="17" text-anchor="middle" font-weight="bold" fill="#1f2937">turgescence</text>
<text x="300" y="266" font-size="17" text-anchor="middle" font-weight="bold" fill="#1f2937">état normal</text>
<text x="500" y="266" font-size="17" text-anchor="middle" font-weight="bold" fill="#1f2937">plasmolyse</text>
<line x1="470" y1="205" x2="470" y2="300" stroke="#374151" stroke-width="1.6"/><circle cx="470" cy="205" r="2.6" fill="#374151"/><text x="470" y="319" font-size="15" text-anchor="middle" font-weight="normal" fill="#1f2937">membrane décollée</text>
<text x="470" y="337" font-size="15" text-anchor="middle" font-weight="normal" fill="#1f2937">de la paroi</text>
<line x1="30" y1="345" x2="570" y2="345" stroke="#d1d5db" stroke-width="1.5"/>
<text x="300" y="378" font-size="17" text-anchor="middle" font-weight="bold" fill="#b91c1c">Globules rouges (hématies)</text>
