<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 630" width="600" height="630" role="img" aria-labelledby="titre desc" font-family="Arial, Helvetica, sans-serif">
<title id="titre">Osmose</title>
<desc id="desc">Cellules d'oignon rouge et globules rouges placés en milieu hypotonique (turgescence, hémolyse), isotonique (état normal) et hypertonique (plasmolyse, hématie ratatinée) ; flèches bleues : sens de l'eau.</desc>
<defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="flr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker><marker id="flv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="flb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker></defs>
<rect x="0" y="0" width="600" height="630" rx="22" ry="22" fill="#fffdf8"/>
<text x="300.0" y="36" font-size="22" text-anchor="middle" font-weight="bold" fill="#1f2937">Osmose</text>
<text x="100" y="72" font-size="18" text-anchor="middle" font-weight="bold" fill="#1f2937">hypotonique</text>
<text x="100" y="94" font-size="16" text-anchor="middle" font-weight="normal" fill="#1f2937">(eau pure)</text>
<text x="300" y="72" font-size="18" text-anchor="middle" font-weight="bold" fill="#1f2937">isotonique</text>
<text x="500" y="72" font-size="18" text-anchor="middle" font-weight="bold" fill="#1f2937">hypertonique</text>
<text x="500" y="94" font-size="16" text-anchor="middle" font-weight="normal" fill="#1f2937">(eau très salée)</text>
<text x="300" y="125" font-size="17" text-anchor="middle" font-weight="bold" fill="#166534">Cellules d'épiderme d'oignon rouge</text>
<rect x="35" y="140" width="130" height="100" rx="6" fill="#f0fdf4" stroke="#166534" stroke-width="6"/>
<rect x="235" y="140" width="130" height="100" rx="6" fill="#f0fdf4" stroke="#166534" stroke-width="6"/>
<rect x="435" y="140" width="130" height="100" rx="6" fill="#f0fdf4" stroke="#166534" stroke-width="6"/>
