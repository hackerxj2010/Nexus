<title id="titre">Transport actif</title>
<desc id="desc">Histogramme : l'eau de mer contient 500 mmol/L de Na+ et 12 mmol/L de K+, le suc vacuolaire de l'algue 90 mmol/L de Na+ et 500 mmol/L de K+. En dessous : la diffusion se fait vers le milieu le moins concentré sans énergie, le transport actif vers le plus concentré grâce à l'ATP.</desc>
