<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 610" width="600" height="610" role="img" aria-labelledby="titre desc" font-family="Arial, Helvetica, sans-serif">
<title id="titre">Les composantes d'un écosystème</title>
<desc id="desc">Schéma : le biotope (lumière, température, eau, sol, air) et la biocénose (végétaux, animaux, champignons et bactéries) en interaction forment l'écosystème ; exemples d'écosystèmes togolais.</desc>
<defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="flr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker><marker id="flv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="flb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker></defs>
<rect x="0" y="0" width="600" height="610" rx="22" ry="22" fill="#fffdf8"/>
<text x="300.0" y="36" font-size="22" text-anchor="middle" font-weight="bold" fill="#1f2937">Les composantes d'un écosystème</text>
<rect x="30" y="62" width="250" height="44" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/><text x="155.0" y="90.3" font-size="18" text-anchor="middle" font-weight="bold" fill="#1f2937">BIOTOPE (milieu de vie)</text>
<rect x="320" y="62" width="250" height="44" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/><text x="445.0" y="90.3" font-size="18" text-anchor="middle" font-weight="bold" fill="#1f2937">BIOCÉNOSE (êtres vivants)</text>
<circle cx="75" cy="160" r="22" fill="#facc15" stroke="#ca8a04" stroke-width="2"/>
<line x1="103.0" y1="160.0" x2="113.0" y2="160.0" stroke="#ca8a04" stroke-width="3"/>
<line x1="94.8" y1="179.8" x2="101.9" y2="186.9" stroke="#ca8a04" stroke-width="3"/>
<line x1="75.0" y1="188.0" x2="75.0" y2="198.0" stroke="#ca8a04" stroke-width="3"/>
<line x1="55.2" y1="179.8" x2="48.1" y2="186.9" stroke="#ca8a04" stroke-width="3"/>
<line x1="47.0" y1="160.0" x2="37.0" y2="160.0" stroke="#ca8a04" stroke-width="3"/>
<line x1="55.2" y1="140.2" x2="48.1" y2="133.1" stroke="#ca8a04" stroke-width="3"/>
<line x1="75.0" y1="132.0" x2="75.0" y2="122.0" stroke="#ca8a04" stroke-width="3"/>
<line x1="94.8" y1="140.2" x2="101.9" y2="133.1" stroke="#ca8a04" stroke-width="3"/>
<text x="125" y="166" font-size="16" text-anchor="start" font-weight="normal" fill="#1f2937">lumière, température</text>
<path d="M75 212 q-14 22 0 30 q14 -8 0 -30 z" fill="#60a5fa" stroke="#1d4ed8" stroke-width="2"/>
<text x="125" y="236" font-size="16" text-anchor="start" font-weight="normal" fill="#1f2937">eau, pluie, humidité</text>
<rect x="52" y="268" width="46" height="10" fill="#a16207"/><rect x="52" y="278" width="46" height="10" fill="#c2410c"/><rect x="52" y="288" width="46" height="10" fill="#9a3412"/>
<text x="125" y="290" font-size="16" text-anchor="start" font-weight="normal" fill="#1f2937">sol, roches, sels minéraux</text>
<path d="M55 335 q15 -12 30 0 t30 0" fill="none" stroke="#64748b" stroke-width="3"/><path d="M55 350 q15 -12 30 0 t30 0" fill="none" stroke="#64748b" stroke-width="3"/>
<text x="125" y="350" font-size="16" text-anchor="start" font-weight="normal" fill="#1f2937">air (O₂, CO₂), vent</text>
<rect x="362" y="165" width="8" height="30" fill="#92400e"/><circle cx="366" cy="155" r="22" fill="#22c55e" stroke="#15803d" stroke-width="2"/>
<text x="405" y="166" font-size="16" text-anchor="start" font-weight="normal" fill="#1f2937">végétaux (producteurs)</text>
<ellipse cx="366" cy="232" rx="20" ry="12" fill="#a8a29e" stroke="#57534e" stroke-width="2"/><circle cx="388" cy="222" r="7" fill="#a8a29e" stroke="#57534e" stroke-width="2"/><line x1="352" y1="242" x2="350" y2="254" stroke="#57534e" stroke-width="3"/><line x1="380" y1="242" x2="382" y2="254" stroke="#57534e" stroke-width="3"/>
<text x="405" y="236" font-size="16" text-anchor="start" font-weight="normal" fill="#1f2937">animaux (consommateurs)</text>
<path d="M348 290 q18 -26 36 0 z" fill="#f97316" stroke="#9a3412" stroke-width="2"/><rect x="362" y="290" width="8" height="12" fill="#fed7aa" stroke="#9a3412"/>
<text x="405" y="290" font-size="16" text-anchor="start" font-weight="normal" fill="#1f2937">champignons, bactéries</text>
<text x="405" y="310" font-size="16" text-anchor="start" font-weight="normal" fill="#1f2937">(décomposeurs)</text>
<line x1="285" y1="200" x2="315" y2="200" stroke="#374151" stroke-width="3" marker-end="url(#fl)"/>
<line x1="315" y1="260" x2="285" y2="260" stroke="#374151" stroke-width="3" marker-end="url(#fl)"/>
<text x="300" y="400" font-size="16" text-anchor="middle" font-weight="normal" fill="#1f2937">interactions : le milieu agit sur les êtres vivants,</text>
<text x="300" y="420" font-size="16" text-anchor="middle" font-weight="normal" fill="#1f2937">les êtres vivants agissent sur le milieu et entre eux</text>
<rect x="90" y="450" width="420" height="56" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.6"/><text x="300.0" y="473.15" font-size="19" text-anchor="middle" font-weight="bold" fill="#1f2937">ÉCOSYSTÈME = biotope + biocénose</text>
<text x="300.0" y="496.15" font-size="19" text-anchor="middle" font-weight="bold" fill="#1f2937">+ interactions</text>
<text x="300" y="545" font-size="16" text-anchor="middle" font-weight="normal" fill="#1f2937">Exemples au Togo : savane des Savanes et de Kara, forêt</text>
<text x="300" y="565" font-size="16" text-anchor="middle" font-weight="normal" fill="#1f2937">semi-décidue des Plateaux (Kloto), mangrove du lac Togo,</text>
<text x="300" y="585" font-size="16" text-anchor="middle" font-weight="normal" fill="#1f2937">lagune de Lomé, champ de maïs (agrosystème).</text>
</svg>
