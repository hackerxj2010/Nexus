<circle cx="530" cy="290" r="9" fill="#facc15" stroke="#a16207" stroke-width="2"/>
<text x="445" y="345" font-size="15" text-anchor="middle" font-weight="normal" fill="#1f2937">1 m</text>
<path d="M362 375 l-6 -14 M362 375 l0 -16 M362 375 l6 -14" stroke="#15803d" stroke-width="3" fill="none"/>
<text x="380" y="375" font-size="15" text-anchor="start" font-weight="normal" fill="#1f2937">espèce A : 6 pieds</text>
<circle cx="362" cy="400" r="8" fill="#facc15" stroke="#a16207" stroke-width="2"/>
<text x="380" y="406" font-size="15" text-anchor="start" font-weight="normal" fill="#1f2937">espèce B : 3 pieds</text>
<rect x="320" y="430" width="255" height="92" rx="10" fill="#ecfdf5" stroke="#15803d" stroke-width="1.6"/><text x="447.5" y="463.25" font-size="15" text-anchor="middle" font-weight="normal" fill="#1f2937">densité = individus / surface</text>
<text x="447.5" y="481.25" font-size="15" text-anchor="middle" font-weight="normal" fill="#1f2937">fréquence = % de quadrats</text>
<text x="447.5" y="499.25" font-size="15" text-anchor="middle" font-weight="normal" fill="#1f2937">où l'espèce est présente</text>
</svg>
