<ellipse cx="160" cy="392" rx="5" ry="3" fill="#111827"/>
<ellipse cx="150" cy="375" rx="5" ry="3" fill="#111827"/>
<line x1="160" y1="112" x2="215" y2="92" stroke="#374151" stroke-width="1.6"/><circle cx="160" cy="112" r="2.6" fill="#374151"/><text x="221" y="98" font-size="15" text-anchor="start" font-weight="normal" fill="#1f2937">lampe</text>
<line x1="150" y1="158" x2="235" y2="135" stroke="#374151" stroke-width="1.6"/><circle cx="150" cy="158" r="2.6" fill="#374151"/><text x="241" y="141" font-size="15" text-anchor="start" font-weight="normal" fill="#1f2937">sol + litière</text>
<line x1="205" y1="178" x2="240" y2="195" stroke="#374151" stroke-width="1.6"/><circle cx="205" cy="178" r="2.6" fill="#374151"/><text x="246" y="201" font-size="15" text-anchor="start" font-weight="normal" fill="#1f2937">tamis</text>
<line x1="180" y1="230" x2="215" y2="262" stroke="#374151" stroke-width="1.6"/><circle cx="180" cy="230" r="2.6" fill="#374151"/><text x="221" y="268" font-size="15" text-anchor="start" font-weight="normal" fill="#1f2937">entonnoir</text>
<line x1="188" y1="385" x2="210" y2="365" stroke="#374151" stroke-width="1.6"/><circle cx="188" cy="385" r="2.6" fill="#374151"/><text x="216" y="371" font-size="15" text-anchor="start" font-weight="normal" fill="#1f2937">alcool</text>
<text x="150" y="445" font-size="15" text-anchor="middle" font-weight="normal" fill="#1f2937">Fuyant la chaleur, la lumière</text>
<text x="150" y="463" font-size="15" text-anchor="middle" font-weight="normal" fill="#1f2937">et la sécheresse, les petits</text>
<text x="150" y="481" font-size="15" text-anchor="middle" font-weight="normal" fill="#1f2937">animaux du sol tombent</text>
<text x="150" y="499" font-size="15" text-anchor="middle" font-weight="normal" fill="#1f2937">dans l'alcool.</text>
<text x="445" y="70" font-size="18" text-anchor="middle" font-weight="bold" fill="#1f2937">Quadrat de 1 m²</text>
