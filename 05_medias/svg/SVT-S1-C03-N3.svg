<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 545" width="600" height="545" role="img" aria-labelledby="titre desc" font-family="Arial, Helvetica, sans-serif">
<title id="titre">Méthodes d'étude d'un milieu</title>
<desc id="desc">À gauche : appareil de Berlèse (lampe, échantillon de sol sur un tamis, entonnoir, flacon d'alcool) pour récolter la petite faune du sol. À droite : quadrat de 1 m² avec 6 pieds de l'espèce A et 3 de l'espèce B ; définitions de la densité et de la fréquence.</desc>
<defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="flr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker><marker id="flv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="flb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker></defs>
<rect x="0" y="0" width="600" height="545" rx="22" ry="22" fill="#fffdf8"/>
<text x="300.0" y="36" font-size="22" text-anchor="middle" font-weight="bold" fill="#1f2937">Méthodes d'étude d'un milieu</text>
<text x="150" y="70" font-size="18" text-anchor="middle" font-weight="bold" fill="#1f2937">Appareil de Berlèse</text>
<path d="M120 92 L180 92 L195 122 L105 122 Z" fill="#9ca3af" stroke="#374151" stroke-width="2"/>
