<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 710" width="600" height="710" role="img" aria-labelledby="titre desc" font-family="Arial, Helvetica, sans-serif">
<title id="titre">Réseau trophique et pyramide</title>
<desc id="desc">Réseau trophique simplifié d'une savane togolaise : graminées et arbres (producteurs) mangés par criquet, termite, rat et antilope (consommateurs I), eux-mêmes mangés par margouillat, pintade et serpent (consommateurs II) puis par un rapace (consommateur III). En dessous, pyramide des énergies : 20 000, 2 000, 180 et 16 kJ par m² et par an.</desc>
