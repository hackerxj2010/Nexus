<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 665" width="600" height="665" role="img" aria-labelledby="titre desc" font-family="Arial, Helvetica, sans-serif">
<title id="titre">Énergie et matière dans l'écosystème</title>
<desc id="desc">En haut : l'énergie solaire passe des producteurs (20 000 kJ) aux herbivores (2 000) puis aux carnivores (180) avec des pertes sous forme de chaleur. En bas : cycle du carbone entre le CO2 de l'air, les producteurs (photosynthèse), les consommateurs, les décomposeurs, et retour du CO2 par la respiration et la minéralisation.</desc>
<defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="flr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker><marker id="flv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="flb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker></defs>
<rect x="0" y="0" width="600" height="665" rx="22" ry="22" fill="#fffdf8"/>
<text x="300.0" y="36" font-size="22" text-anchor="middle" font-weight="bold" fill="#1f2937">Énergie et matière dans l'écosystème</text>
<text x="300" y="68" font-size="17" text-anchor="middle" font-weight="bold" fill="#1f2937">1. Flux d'énergie (kJ/m²/an)</text>
<circle cx="55" cy="140" r="26" fill="#facc15" stroke="#ca8a04" stroke-width="2"/>
<text x="55" y="190" font-size="15" text-anchor="middle" font-weight="normal" fill="#1f2937">Soleil</text>
<line x1="83" y1="140" x2="100" y2="140" stroke="#ca8a04" stroke-width="3" marker-end="url(#fl)"/>
<rect x="105" y="110" width="130" height="60" rx="10" fill="#dcfce7" stroke="#4b5563" stroke-width="1.6"/><text x="170.0" y="135.6" font-size="16" text-anchor="middle" font-weight="bold" fill="#1f2937">producteurs</text>
<text x="170.0" y="155.6" font-size="16" text-anchor="middle" font-weight="bold" fill="#1f2937">20 000</text>
<line x1="170" y1="172" x2="170" y2="222" stroke="#b91c1c" stroke-width="2.5" marker-end="url(#flr)"/>
<line x1="237" y1="140" x2="262" y2="140" stroke="#374151" stroke-width="3" marker-end="url(#fl)"/>
<rect x="265" y="110" width="130" height="60" rx="10" fill="#fef9c3" stroke="#4b5563" stroke-width="1.6"/><text x="330.0" y="135.6" font-size="16" text-anchor="middle" font-weight="bold" fill="#1f2937">herbivores</text>
<text x="330.0" y="155.6" font-size="16" text-anchor="middle" font-weight="bold" fill="#1f2937">2 000</text>
<line x1="330" y1="172" x2="330" y2="222" stroke="#b91c1c" stroke-width="2.5" marker-end="url(#flr)"/>
<line x1="397" y1="140" x2="422" y2="140" stroke="#374151" stroke-width="3" marker-end="url(#fl)"/>
<rect x="425" y="110" width="130" height="60" rx="10" fill="#ffedd5" stroke="#4b5563" stroke-width="1.6"/><text x="490.0" y="135.6" font-size="16" text-anchor="middle" font-weight="bold" fill="#1f2937">carnivores</text>
<text x="490.0" y="155.6" font-size="16" text-anchor="middle" font-weight="bold" fill="#1f2937">180</text>
<line x1="490" y1="172" x2="490" y2="222" stroke="#b91c1c" stroke-width="2.5" marker-end="url(#flr)"/>
<text x="300" y="245" font-size="15" text-anchor="middle" font-weight="bold" fill="#b91c1c">pertes : chaleur (respiration), déchets</text>
<text x="300" y="272" font-size="15" text-anchor="middle" font-weight="normal" fill="#1f2937">L'énergie traverse l'écosystème sans revenir : environ 10 %</text>
<text x="300" y="290" font-size="15" text-anchor="middle" font-weight="normal" fill="#1f2937">passe d'un niveau au suivant.</text>
<line x1="30" y1="310" x2="570" y2="310" stroke="#d1d5db" stroke-width="1.5"/>
<text x="300" y="340" font-size="17" text-anchor="middle" font-weight="bold" fill="#1f2937">2. Cycle du carbone (la matière est recyclée)</text>
<rect x="200" y="360" width="200" height="48" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.6"/><text x="300.0" y="389.95" font-size="17" text-anchor="middle" font-weight="bold" fill="#1f2937">CO₂ de l'air</text>
<rect x="30" y="470" width="160" height="56" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/><text x="110.0" y="494.25" font-size="15" text-anchor="middle" font-weight="normal" fill="#1f2937">producteurs</text>
<text x="110.0" y="512.25" font-size="15" text-anchor="middle" font-weight="normal" fill="#1f2937">(matière organique)</text>
<rect x="410" y="470" width="160" height="56" rx="10" fill="#fef9c3" stroke="#a16207" stroke-width="1.6"/><text x="490.0" y="503.6" font-size="16" text-anchor="middle" font-weight="normal" fill="#1f2937">consommateurs</text>
<rect x="200" y="590" width="200" height="56" rx="10" fill="#fde68a" stroke="#92400e" stroke-width="1.6"/><text x="300.0" y="613.6" font-size="16" text-anchor="middle" font-weight="normal" fill="#1f2937">décomposeurs</text>
<text x="300.0" y="633.6" font-size="16" text-anchor="middle" font-weight="normal" fill="#1f2937">(sol)</text>
<line x1="215" y1="400" x2="120" y2="466" stroke="#15803d" stroke-width="2.5" marker-end="url(#flv)"/>
<text x="70" y="430" font-size="15" text-anchor="start" font-weight="bold" fill="#15803d">photosynthèse</text>
<line x1="150" y1="470" x2="230" y2="412" stroke="#b91c1c" stroke-width="2.2" marker-end="url(#flr)"/>
<line x1="192" y1="498" x2="406" y2="498" stroke="#374151" stroke-width="2.5" marker-end="url(#fl)"/>
<text x="300" y="490" font-size="15" text-anchor="middle" font-weight="normal" fill="#1f2937">nutrition</text>
<line x1="440" y1="466" x2="385" y2="410" stroke="#b91c1c" stroke-width="2.2" marker-end="url(#flr)"/>
<text x="470" y="430" font-size="15" text-anchor="start" font-weight="bold" fill="#b91c1c">respiration</text>
<line x1="110" y1="528" x2="215" y2="588" stroke="#374151" stroke-width="2.2" stroke-dasharray="6 5" marker-end="url(#fl)"/>
<line x1="490" y1="528" x2="385" y2="588" stroke="#374151" stroke-width="2.2" stroke-dasharray="6 5" marker-end="url(#fl)"/>
<text x="40" y="575" font-size="14" text-anchor="start" font-weight="normal" fill="#1f2937">cadavres,</text>
<text x="40" y="593" font-size="14" text-anchor="start" font-weight="normal" fill="#1f2937">feuilles mortes</text>
<text x="560" y="575" font-size="14" text-anchor="end" font-weight="normal" fill="#1f2937">excréments,</text>
<text x="560" y="593" font-size="14" text-anchor="end" font-weight="normal" fill="#1f2937">cadavres</text>
<line x1="300" y1="588" x2="300" y2="412" stroke="#b91c1c" stroke-width="2.2" marker-end="url(#flr)"/>
<text x="308" y="540" font-size="14" text-anchor="start" font-weight="bold" fill="#b91c1c">minéralisation</text>
</svg>
