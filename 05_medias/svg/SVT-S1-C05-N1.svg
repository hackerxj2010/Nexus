<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-labelledby="titre desc" font-family="Arial, Helvetica, sans-serif">
<title id="titre">Couvert végétal et érosion des sols</title>
<desc id="desc">Expérience : deux bacs inclinés arrosés de la même façon ; le sol nu laisse partir une eau boueuse et abondante, le sol couvert d'herbe peu d'eau claire. Histogramme : terre emportée 480 g (sol nu), 150 g (cordon pierreux), 25 g (herbe).</desc>
