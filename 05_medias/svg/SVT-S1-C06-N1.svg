<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 610" width="600" height="610" role="img" aria-labelledby="titre desc" font-family="Arial, Helvetica, sans-serif">
<title id="titre">Les besoins minéraux de la plante</title>
<desc id="desc">Trois cultures hydroponiques : en solution complète la plante est grande et verte ; sans azote elle est chétive et jaunie ; sans potassium les bords des feuilles brunissent. En bas : une laitue contient environ 95 % d'eau, 4 % de matière organique et 1 % de minéraux (valeurs approchées).</desc>
