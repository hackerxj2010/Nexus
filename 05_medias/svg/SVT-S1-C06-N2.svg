<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 525" width="600" height="525" role="img" aria-labelledby="titre desc" font-family="Arial, Helvetica, sans-serif">
<title id="titre">L'absorption racinaire</title>
<desc id="desc">À gauche : racine avec coiffe, zone de croissance, zone pilifère couverte de poils absorbants et zone de ramification. À droite : trajet de l'eau et des ions du sol vers le poil absorbant, l'écorce, l'endoderme puis le xylème (sève brute) qui monte vers les feuilles ; l'eau entre par osmose, les ions surtout par transport actif.</desc>
