<text x="283" y="462" font-size="14" text-anchor="middle" font-weight="bold" fill="#1f2937">K</text>
<rect x="304" y="450" width="34" height="160" fill="#d6b88a" stroke="#78350f" stroke-width="2"/>
<text x="321" y="442" font-size="14" text-anchor="middle" font-weight="bold" fill="#1f2937">eau</text>
<rect x="342" y="460" width="34" height="150" fill="#d6b88a" stroke="#78350f" stroke-width="2"/>
<text x="359" y="452" font-size="14" text-anchor="middle" font-weight="bold" fill="#1f2937">Mg</text>
<rect x="380" y="465" width="34" height="145" fill="#d6b88a" stroke="#78350f" stroke-width="2"/>
<text x="397" y="457" font-size="14" text-anchor="middle" font-weight="bold" fill="#1f2937">Ca</text>
<rect x="192" y="522" width="222" height="86" fill="#60a5fa" opacity="0.65"/>
<line x1="245" y1="492" x2="245" y2="518" stroke="#1d4ed8" stroke-width="2" marker-end="url(#flb)"/>
<text x="30" y="520" font-size="14" text-anchor="start" font-weight="normal" fill="#1f2937">Le niveau (rendement)</text>
<text x="30" y="537" font-size="14" text-anchor="start" font-weight="normal" fill="#1f2937">est fixé par la planche</text>
<text x="30" y="554" font-size="14" text-anchor="start" font-weight="normal" fill="#1f2937">la plus courte : ici P,</text>
<text x="30" y="571" font-size="14" text-anchor="start" font-weight="normal" fill="#1f2937">le facteur limitant.</text>
</svg>
