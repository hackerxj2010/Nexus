<text x="119.16666666666666" y="213.0" font-size="14" text-anchor="end" font-weight="bold" fill="#b91c1c">+0,9</text>
<text x="197.5" y="159.25" font-size="14" text-anchor="end" font-weight="bold" fill="#b91c1c">+0,7</text>
