<text x="300.0" y="480.5" font-size="16" text-anchor="middle" font-weight="normal" fill="#1f2937">Photosynthèse brute = photosynthèse nette + respiration</text>
<text x="300.0" y="499.2" font-size="16" text-anchor="middle" font-weight="normal" fill="#1f2937">Au palier, la lumière n'est plus le facteur limitant :</text>
<text x="300.0" y="518.0" font-size="16" text-anchor="middle" font-weight="normal" fill="#1f2937">c'est le CO₂ (ou la température) qui limite.</text>
