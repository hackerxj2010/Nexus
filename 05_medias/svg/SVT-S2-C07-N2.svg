<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 560" width="600" height="560" role="img" aria-labelledby="titre desc" font-family="Arial, Helvetica, sans-serif">
<title id="titre">Échanges de dioxygène selon l'éclairement</title>
<desc id="desc">Courbe du dégagement net de dioxygène d'une plante en fonction de l'éclairement, en air normal et en air enrichi en CO2 : absorption d'O2 à l'obscurité (respiration seule), point de compensation, augmentation puis palier ; le palier est plus haut quand le CO2 est plus abondant. La photosynthèse brute égale la nette plus la respiration.</desc>
