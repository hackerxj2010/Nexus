<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 660" width="600" height="660" role="img" aria-labelledby="titre desc" font-family="Arial, Helvetica, sans-serif">
<title id="titre">Le chloroplaste et ses pigments</title>
<desc id="desc">En haut, ultrastructure d'un chloroplaste : double membrane, stroma, thylakoïdes empilés en grana, grain d'amidon, ADN et ribosomes. En bas à gauche, chromatogramme des pigments : carotènes près du front, puis xanthophylles, chlorophylle a et chlorophylle b. En bas à droite, spectre d'absorption de la chlorophylle avec deux pics, dans le bleu et dans le rouge, et un creux dans le vert.</desc>
