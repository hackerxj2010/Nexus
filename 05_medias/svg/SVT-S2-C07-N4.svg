<text x="285" y="225" font-size="13" text-anchor="middle" font-weight="normal" fill="#14532d">thylakoïdes</text>
<text x="365" y="250" font-size="13" text-anchor="middle" font-weight="normal" fill="#14532d">stroma</text>
