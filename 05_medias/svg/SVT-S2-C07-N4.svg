<text x="70" y="160" font-size="16" text-anchor="middle" font-weight="bold" fill="#1f2937">lumière</text>
<path d="M150 300 Q300 120 470 190 Q330 360 150 300 Z" fill="#86efac" stroke="#166534" stroke-width="3"/>
<path d="M150 300 Q310 240 470 190" fill="none" stroke="#166534" stroke-width="2"/>
