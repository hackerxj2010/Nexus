<text x="90" y="505" font-size="15" text-anchor="middle" font-weight="normal" fill="#1f2937">H₂O + ions</text>
<text x="90" y="524" font-size="14" text-anchor="middle" font-weight="normal" fill="#4b5563">(sève brute)</text>
<line x1="150" y1="320" x2="210" y2="420" stroke="#c2410c" stroke-width="2.5" marker-end="url(#flo)" stroke-dasharray="6 4"/>
<text x="215" y="440" font-size="14" text-anchor="start" font-weight="normal" fill="#1f2937">sève élaborée (saccharose)</text>
<text x="215" y="458" font-size="14" text-anchor="start" font-weight="normal" fill="#4b5563">→ réserves : amidon des tubercules</text>
<text x="215" y="476" font-size="14" text-anchor="start" font-weight="normal" fill="#4b5563">(igname, manioc), grains de maïs…</text>
<text x="470" y="300" font-size="14" text-anchor="middle" font-weight="normal" fill="#4b5563">énergie lumineuse</text>
<text x="470" y="318" font-size="14" text-anchor="middle" font-weight="normal" fill="#4b5563">→ énergie chimique</text>
<text x="470" y="336" font-size="14" text-anchor="middle" font-weight="normal" fill="#4b5563">(matière organique)</text>
<rect x="20" y="530" width="560" height="54" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
<text x="300" y="565" font-size="19" text-anchor="middle" font-weight="bold" fill="#1f2937">6 CO₂ + 12 H₂O  →  C₆H₁₂O₆ + 6 O₂ + 6 H₂O</text>
</svg>
