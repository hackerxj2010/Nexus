<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 620" width="600" height="620" role="img" aria-labelledby="titre desc" font-family="Arial, Helvetica, sans-serif">
<title id="titre">Les constituants du sol</title>
<desc id="desc">À gauche, éprouvette où un sol agité dans l'eau s'est déposé par couches : graviers au fond, puis sables grossiers, sables fins, limons, argiles restées en suspension et débris organiques flottants. À droite, composition en volume d'un sol cultivé idéal : 45 % de matières minérales, 5 % de matière organique, 25 % d'eau, 25 % d'air. En bas, classes granulométriques : argiles moins de 2 µm, limons 2 à 50 µm, sables 50 µm à 2 mm, graviers plus de 2 mm.</desc>
