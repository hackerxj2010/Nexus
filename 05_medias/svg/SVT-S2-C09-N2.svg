<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 690" width="600" height="690" role="img" aria-labelledby="titre desc" font-family="Arial, Helvetica, sans-serif">
<title id="titre">Profil d'un sol ferrallitique</title>
<desc id="desc">Coupe verticale d'un sol ferrallitique du sud du Togo : litière A0, horizon humifère A gris-brun, épais horizon B rouge riche en argiles et oxydes de fer avec gravillons, horizon C de roche altérée tachetée, puis roche mère R (granite ou gneiss). Le lessivage entraîne les éléments vers le bas ; l'altération transforme la roche en argiles. Profondeurs indicatives.</desc>
