<circle cx="375" cy="215" r="18" fill="#fde68a" stroke="#b45309" stroke-width="1.5"/>
<text x="359.2" y="220" font-size="14" font-weight="bold" fill="#1f2937"><tspan dy="0">NH</tspan><tspan dy="4" font-size="10">4</tspan><tspan dy="-10" font-size="10">+</tspan></text>
<circle cx="370" cy="145" r="18" fill="#fde68a" stroke="#b45309" stroke-width="1.5"/>
