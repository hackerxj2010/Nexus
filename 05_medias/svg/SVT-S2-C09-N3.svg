<text x="335" y="165" font-size="15" text-anchor="middle" font-weight="bold" fill="#1d4ed8">−</text>
<circle cx="340" cy="210" r="8" fill="#fffdf8" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="340" y="215" font-size="15" text-anchor="middle" font-weight="bold" fill="#1d4ed8">−</text>
<circle cx="290" cy="240" r="8" fill="#fffdf8" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="290" y="245" font-size="15" text-anchor="middle" font-weight="bold" fill="#1d4ed8">−</text>
