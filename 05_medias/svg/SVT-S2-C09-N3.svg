<text x="105" y="205" font-size="15" text-anchor="middle" font-weight="bold" fill="#1d4ed8">−</text>
<circle cx="140" cy="208" r="8" fill="#fffdf8" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="140" y="213" font-size="15" text-anchor="middle" font-weight="bold" fill="#1d4ed8">−</text>
<circle cx="190" cy="208" r="8" fill="#fffdf8" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="190" y="213" font-size="15" text-anchor="middle" font-weight="bold" fill="#1d4ed8">−</text>
<circle cx="170" cy="142" r="8" fill="#fffdf8" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="170" y="147" font-size="15" text-anchor="middle" font-weight="bold" fill="#1d4ed8">−</text>
