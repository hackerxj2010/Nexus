<path d="M560,90 L560,320" stroke="#a16207" stroke-width="22" stroke-linecap="round"/>
<path d="M549,210 L470,230" stroke="#ca8a04" stroke-width="5" stroke-linecap="round"/>
<text x="560" y="345" font-size="14" text-anchor="middle" font-weight="normal" fill="#1f2937">racine</text>
<text x="470" y="255" font-size="14" text-anchor="middle" font-weight="normal" fill="#1f2937">poil absorbant</text>
<line x1="430" y1="150" x2="500" y2="190" stroke="#b45309" stroke-width="2.5" marker-end="url(#flo)"/>
<text x="433.9" y="135" font-size="14" font-weight="bold" fill="#b45309"><tspan dy="0">K</tspan><tspan dy="-6" font-size="10">+</tspan><tspan dy="6"> absorbé</tspan></text>
<line x1="500" y1="238" x2="430" y2="285" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#flm)"/>
<text x="411.8" y="305" font-size="14" font-weight="bold" fill="#7c3aed"><tspan dy="0">H</tspan><tspan dy="-6" font-size="10">+</tspan><tspan dy="6"> libéré</tspan></text>
<text x="300" y="370" font-size="14" text-anchor="middle" font-weight="normal" fill="#4b5563">Les cations fixés ne sont pas lessivés : ils restent disponibles pour la plante.</text>
<line x1="30" y1="390" x2="570" y2="390" stroke="#d1d5db" stroke-width="1.5"/>
<text x="300" y="418" font-size="15" text-anchor="middle" font-weight="bold" fill="#1f2937">Expérience : filtration de deux colorants à travers de la terre</text>
<path d="M60,470 L180,470 L130,540 L130,570 L110,570 L110,540 Z" fill="#d6a35c" stroke="#475569" stroke-width="2.5"/>
<rect x="65" y="460" width="110" height="10" fill="#2563eb"/>
<text x="120" y="452" font-size="14" text-anchor="middle" font-weight="bold" fill="#1f2937">bleu de méthylène (cation)</text>
<path d="M90,590 L90,640 Q90,648 98,648 L142,648 Q150,648 150,640 L150,590" fill="none" stroke="#475569" stroke-width="2.5"/>
<rect x="92" y="615" width="56" height="31" fill="#f8fafc" opacity="0.9"/>
<text x="165" y="620" font-size="14" text-anchor="start" font-weight="normal" fill="#1f2937">filtrat incolore :</text>
<text x="165" y="638" font-size="14" text-anchor="start" font-weight="normal" fill="#4b5563">colorant retenu</text>
<path d="M340,470 L460,470 L410,540 L410,570 L390,570 L390,540 Z" fill="#d6a35c" stroke="#475569" stroke-width="2.5"/>
<rect x="345" y="460" width="110" height="10" fill="#e11d48"/>
<text x="400" y="452" font-size="14" text-anchor="middle" font-weight="bold" fill="#1f2937">éosine (anion)</text>
<path d="M370,590 L370,640 Q370,648 378,648 L422,648 Q430,648 430,640 L430,590" fill="none" stroke="#475569" stroke-width="2.5"/>
<rect x="372" y="615" width="56" height="31" fill="#fda4af" opacity="0.9"/>
<text x="445" y="620" font-size="14" text-anchor="start" font-weight="normal" fill="#1f2937">filtrat rouge :</text>
<text x="445" y="638" font-size="14" text-anchor="start" font-weight="normal" fill="#4b5563">colorant non retenu</text>
</svg>
