<rect x="110" y="186" width="130" height="8" rx="3" fill="#d6d3d1" stroke="#78716c" stroke-width="1"/>
<path d="M260,130 q40,-20 70,10 q30,30 0,60 q-30,35 -70,15 q-25,-30 0,-85 z" fill="#78350f" opacity="0.9"/>
<text x="175" y="227" font-size="15" text-anchor="middle" font-weight="bold" fill="#1f2937">argile</text>
<text x="298" y="182" font-size="15" text-anchor="middle" font-weight="bold" fill="#fffdf8">humus</text>
