<text x="300" y="432" font-size="16" text-anchor="middle" font-weight="bold" fill="#1f2937">Les trois composantes de la fertilité</text>
<rect x="25" y="450" width="175" height="100" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
<text x="112.5" y="487.4" font-size="14" text-anchor="middle" font-weight="bold" fill="#1f2937">physique</text>
<text x="112.5" y="504.9" font-size="14" text-anchor="middle" font-weight="normal" fill="#1f2937">structure grumeleuse,</text>
<text x="112.5" y="522.4" font-size="14" text-anchor="middle" font-weight="normal" fill="#1f2937">air, eau retenue</text>
<rect x="212" y="450" width="176" height="100" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
<text x="300.0" y="487.4" font-size="14" text-anchor="middle" font-weight="bold" fill="#1f2937">chimique</text>
<text x="300.0" y="504.9" font-size="14" text-anchor="middle" font-weight="normal" fill="#1f2937">ions nutritifs, complexe</text>
<text x="300.0" y="522.4" font-size="14" text-anchor="middle" font-weight="normal" fill="#1f2937">argilo-humique, pH</text>
<rect x="400" y="450" width="175" height="100" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
<text x="487.5" y="487.4" font-size="14" text-anchor="middle" font-weight="bold" fill="#1f2937">biologique</text>
<text x="487.5" y="504.9" font-size="14" text-anchor="middle" font-weight="normal" fill="#1f2937">humus, vers, termites,</text>
<text x="487.5" y="522.4" font-size="14" text-anchor="middle" font-weight="normal" fill="#1f2937">bactéries, champignons</text>
<text x="300" y="580" font-size="14" text-anchor="middle" font-weight="normal" fill="#4b5563">Jachère, rotation, association avec des légumineuses, fumier,</text>
<text x="300" y="600" font-size="14" text-anchor="middle" font-weight="normal" fill="#4b5563">compost et agroforesterie entretiennent ces trois composantes.</text>
