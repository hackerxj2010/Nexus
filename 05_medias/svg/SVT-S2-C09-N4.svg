<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 640" width="600" height="640" role="img" aria-labelledby="titre desc" font-family="Arial, Helvetica, sans-serif">
<title id="titre">Protéger le sol contre l'érosion</title>
<desc id="desc">Deux pentes sous la pluie. À gauche, sol nu labouré dans le sens de la pente : fort ruissellement, ravines et terre emportée. À droite, sol aménagé avec cordons pierreux, haies vives et paillage : l'eau s'infiltre et la terre est retenue. En bas, les trois composantes de la fertilité : physique, chimique et biologique.</desc>
