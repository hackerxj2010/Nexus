<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 650" width="600" height="650" role="img" aria-labelledby="titre desc" font-family="Arial, Helvetica, sans-serif">
<title id="titre">Échelle de dureté de Mohs</title>
<desc id="desc">Les dix minéraux de l'échelle de Mohs, du plus tendre au plus dur : talc 1, gypse 2, calcite 3, fluorine 4, apatite 5, orthose 6, quartz 7, topaze 8, corindon 9, diamant 10, avec des outils de référence : ongle 2,5, pièce de cuivre 3,5, verre et lame de canif 5,5, lime d'acier 6,5. Un minéral raye ceux qui sont plus tendres que lui.</desc>
<defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="flb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker><marker id="flr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker><marker id="flv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="flo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker><marker id="flm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker></defs>
<rect x="0" y="0" width="600" height="650" rx="22" ry="22" fill="#fffdf8"/>
<text x="300.0" y="36" font-size="22" text-anchor="middle" font-weight="bold" fill="#1f2937">L'échelle de dureté de Mohs</text>
<rect x="70" y="556" width="42" height="40" rx="5" fill="#e0f2fe"/>
<text x="86" y="583" font-size="18" text-anchor="middle" font-weight="bold" fill="#0f172a">1</text>
<text x="122" y="581" font-size="16" text-anchor="start" font-weight="bold" fill="#1f2937">talc</text>
<text x="122" y="598" font-size="14" text-anchor="start" font-weight="normal" fill="#4b5563">rayé par l'ongle</text>
<rect x="70" y="504" width="60" height="40" rx="5" fill="#bae6fd"/>
<text x="86" y="531" font-size="18" text-anchor="middle" font-weight="bold" fill="#0f172a">2</text>
<text x="140" y="529" font-size="16" text-anchor="start" font-weight="bold" fill="#1f2937">gypse</text>
<text x="140" y="546" font-size="14" text-anchor="start" font-weight="normal" fill="#4b5563">rayé par l'ongle</text>
<rect x="70" y="452" width="78" height="40" rx="5" fill="#7dd3fc"/>
<text x="86" y="479" font-size="18" text-anchor="middle" font-weight="bold" fill="#0f172a">3</text>
<text x="158" y="477" font-size="16" text-anchor="start" font-weight="bold" fill="#1f2937">calcite</text>
<rect x="70" y="400" width="96" height="40" rx="5" fill="#38bdf8"/>
<text x="86" y="427" font-size="18" text-anchor="middle" font-weight="bold" fill="#0f172a">4</text>
<text x="176" y="425" font-size="16" text-anchor="start" font-weight="bold" fill="#1f2937">fluorine</text>
<rect x="70" y="348" width="114" height="40" rx="5" fill="#0ea5e9"/>
<text x="86" y="375" font-size="18" text-anchor="middle" font-weight="bold" fill="#0f172a">5</text>
<text x="194" y="373" font-size="16" text-anchor="start" font-weight="bold" fill="#1f2937">apatite</text>
<rect x="70" y="296" width="132" height="40" rx="5" fill="#0284c7"/>
<text x="86" y="323" font-size="18" text-anchor="middle" font-weight="bold" fill="#ffffff">6</text>
<text x="212" y="321" font-size="16" text-anchor="start" font-weight="bold" fill="#1f2937">orthose (feldspath)</text>
<text x="212" y="338" font-size="14" text-anchor="start" font-weight="normal" fill="#4b5563">raye le verre</text>
<rect x="70" y="244" width="150" height="40" rx="5" fill="#0369a1"/>
<text x="86" y="271" font-size="18" text-anchor="middle" font-weight="bold" fill="#ffffff">7</text>
<text x="230" y="269" font-size="16" text-anchor="start" font-weight="bold" fill="#1f2937">quartz</text>
<text x="230" y="286" font-size="14" text-anchor="start" font-weight="normal" fill="#4b5563">raye le verre</text>
<rect x="70" y="192" width="168" height="40" rx="5" fill="#075985"/>
<text x="86" y="219" font-size="18" text-anchor="middle" font-weight="bold" fill="#ffffff">8</text>
<text x="248" y="217" font-size="16" text-anchor="start" font-weight="bold" fill="#1f2937">topaze</text>
<rect x="70" y="140" width="186" height="40" rx="5" fill="#0c4a6e"/>
<text x="86" y="167" font-size="18" text-anchor="middle" font-weight="bold" fill="#ffffff">9</text>
<text x="266" y="165" font-size="16" text-anchor="start" font-weight="bold" fill="#1f2937">corindon</text>
<rect x="70" y="88" width="204" height="40" rx="5" fill="#082f49"/>
<text x="86" y="115" font-size="18" text-anchor="middle" font-weight="bold" fill="#ffffff">10</text>
<text x="284" y="113" font-size="16" text-anchor="start" font-weight="bold" fill="#1f2937">diamant</text>
<text x="284" y="130" font-size="14" text-anchor="start" font-weight="normal" fill="#4b5563">le plus dur</text>
<line x1="40" y1="595" x2="40" y2="70" stroke="#374151" stroke-width="2.5" marker-end="url(#fl)"/>
<text x="30" y="330" font-size="15" text-anchor="middle" font-weight="normal" fill="#4b5563" transform="rotate(-90 30 330)">dureté croissante</text>
<line x1="378" y1="498" x2="410" y2="498" stroke="#b45309" stroke-width="2.5" stroke-dasharray="5 3"/>
<text x="416" y="503" font-size="15" text-anchor="start" font-weight="bold" fill="#92400e">ongle ≈ 2,5</text>
<line x1="378" y1="446" x2="410" y2="446" stroke="#b45309" stroke-width="2.5" stroke-dasharray="5 3"/>
<text x="416" y="451" font-size="15" text-anchor="start" font-weight="bold" fill="#92400e">pièce de cuivre ≈ 3,5</text>
<line x1="378" y1="342" x2="410" y2="342" stroke="#b45309" stroke-width="2.5" stroke-dasharray="5 3"/>
<text x="416" y="347" font-size="15" text-anchor="start" font-weight="bold" fill="#92400e">verre, canif ≈ 5,5</text>
<line x1="378" y1="290" x2="410" y2="290" stroke="#b45309" stroke-width="2.5" stroke-dasharray="5 3"/>
<text x="416" y="295" font-size="15" text-anchor="start" font-weight="bold" fill="#92400e">lime d'acier ≈ 6,5</text>
<text x="470" y="255" font-size="16" text-anchor="middle" font-weight="bold" fill="#92400e">Outils de référence</text>
<rect x="320" y="525" width="262" height="74" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
<text x="451.0" y="549.4" font-size="15" text-anchor="middle" font-weight="normal" fill="#1f2937">Un minéral raye tous ceux</text>
<text x="451.0" y="566.9" font-size="15" text-anchor="middle" font-weight="normal" fill="#1f2937">qui sont plus tendres que lui</text>
<text x="451.0" y="584.4" font-size="15" text-anchor="middle" font-weight="normal" fill="#1f2937">et est rayé par les plus durs.</text>
</svg>
