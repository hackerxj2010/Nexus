<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 640" width="600" height="640" role="img" aria-labelledby="titre desc" font-family="Arial, Helvetica, sans-serif">
<title id="titre">Érosion, transport et dépôt</title>
<desc id="desc">Profil d'un relief à la mer : la roche de la montagne est altérée (fissures, eau de pluie), érodée par le ruissellement, ses débris sont transportés par la rivière puis déposés dans la plaine et sur le littoral quand la pente et la vitesse de l'eau diminuent. En bas, coupe d'une rivière montrant les quatre modes de transport : traction des galets, saltation des sables, suspension des limons et argiles, dissolution des ions.</desc>
