<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 640" width="600" height="640" role="img" aria-labelledby="titre desc" font-family="Arial, Helvetica, sans-serif">
<title id="titre">Classification des roches sédimentaires</title>
<desc id="desc">Arbre de classification : roches sédimentaires détritiques (conglomérats, poudingues, brèches, grès, argiles), biochimiques (calcaires coquilliers et récifaux, craie, phosphates, charbon, pétrole) et chimiques (sel gemme, gypse, travertin). Exemples du bassin sédimentaire côtier du Togo : phosphates de Hahotoé-Kpogamé, calcaire de Tabligbo, argiles et sables. Tests d'identification.</desc>
<defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="flb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker><marker id="flr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker><marker id="flv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="flo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker><marker id="flm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker></defs>
<rect x="0" y="0" width="600" height="640" rx="22" ry="22" fill="#fffdf8"/>
<text x="300.0" y="36" font-size="22" text-anchor="middle" font-weight="bold" fill="#1f2937">Les grandes familles de roches sédimentaires</text>
<rect x="190" y="58" width="220" height="44" rx="10" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5"/>
<text x="300.0" y="86.0" font-size="17" text-anchor="middle" font-weight="bold" fill="#1f2937">Roches sédimentaires</text>
<path d="M300,104 L105,140" fill="none" stroke="#4b5563" stroke-width="2" marker-end="url(#fl)"/>
<rect x="13" y="145" width="184" height="58" rx="10" fill="#fde68a" stroke="#a16207" stroke-width="1.5"/>
<text x="105.0" y="169.9" font-size="15" text-anchor="middle" font-weight="bold" fill="#1f2937">Détritiques</text>
<text x="105.0" y="188.6" font-size="15" text-anchor="middle" font-weight="normal" fill="#1f2937">débris de roches</text>
<rect x="13" y="215" width="184" height="160" rx="10" fill="#ffffff" stroke="#a16207" stroke-width="1.5"/>
<text x="21" y="240" font-size="13.5" text-anchor="start" font-weight="normal" fill="#1f2937">conglomérat (&gt; 2 mm)</text>
<text x="21" y="268" font-size="13.5" text-anchor="start" font-weight="normal" fill="#1f2937">→ poudingue : galets ronds</text>
<text x="21" y="296" font-size="13.5" text-anchor="start" font-weight="normal" fill="#1f2937">→ brèche : débris anguleux</text>
<text x="21" y="324" font-size="13.5" text-anchor="start" font-weight="normal" fill="#1f2937">grès (sables cimentés)</text>
<text x="21" y="352" font-size="13.5" text-anchor="start" font-weight="normal" fill="#1f2937">argilite, argile (&lt; 2 µm)</text>
<path d="M300,104 L300,140" fill="none" stroke="#4b5563" stroke-width="2" marker-end="url(#fl)"/>
<rect x="208" y="145" width="184" height="58" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
<text x="300.0" y="169.9" font-size="15" text-anchor="middle" font-weight="bold" fill="#1f2937">Biochimiques</text>
<text x="300.0" y="188.6" font-size="15" text-anchor="middle" font-weight="normal" fill="#1f2937">restes d'êtres vivants</text>
<rect x="208" y="215" width="184" height="160" rx="10" fill="#ffffff" stroke="#15803d" stroke-width="1.5"/>
<text x="216" y="240" font-size="13.5" text-anchor="start" font-weight="normal" fill="#1f2937">calcaire coquillier, récifal</text>
<text x="216" y="268" font-size="13.5" text-anchor="start" font-weight="normal" fill="#1f2937">craie</text>
<text x="216" y="296" font-size="13.5" text-anchor="start" font-weight="normal" fill="#1f2937">phosphates</text>
<text x="216" y="324" font-size="13.5" text-anchor="start" font-weight="normal" fill="#1f2937">charbon (végétaux)</text>
<text x="216" y="352" font-size="13.5" text-anchor="start" font-weight="normal" fill="#1f2937">pétrole, gaz</text>
<path d="M300,104 L495,140" fill="none" stroke="#4b5563" stroke-width="2" marker-end="url(#fl)"/>
<rect x="403" y="145" width="184" height="58" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
<text x="495.0" y="169.9" font-size="15" text-anchor="middle" font-weight="bold" fill="#1f2937">Chimiques</text>
<text x="495.0" y="188.6" font-size="15" text-anchor="middle" font-weight="normal" fill="#1f2937">précipitation</text>
<rect x="403" y="215" width="184" height="160" rx="10" fill="#ffffff" stroke="#0369a1" stroke-width="1.5"/>
<text x="411" y="240" font-size="13.5" text-anchor="start" font-weight="normal" fill="#1f2937">sel gemme (halite)</text>
<text x="411" y="268" font-size="13.5" text-anchor="start" font-weight="normal" fill="#1f2937">gypse</text>
<text x="411" y="296" font-size="13.5" text-anchor="start" font-weight="normal" fill="#1f2937">(évaporites : lagune</text>
<text x="411" y="324" font-size="13.5" text-anchor="start" font-weight="normal" fill="#1f2937">qui s'assèche)</text>
<text x="411" y="352" font-size="13.5" text-anchor="start" font-weight="normal" fill="#1f2937">travertin, calcaire chimique</text>
<line x1="30" y1="395" x2="570" y2="395" stroke="#d1d5db" stroke-width="1.5"/>
<text x="300" y="423" font-size="16" text-anchor="middle" font-weight="bold" fill="#1f2937">Au Togo : le bassin sédimentaire côtier (sud du pays)</text>
<rect x="25" y="442" width="130" height="62" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
<text x="90.0" y="469.1" font-size="14" text-anchor="middle" font-weight="bold" fill="#1f2937">phosphates</text>
<text x="90.0" y="486.6" font-size="14" text-anchor="middle" font-weight="normal" fill="#1f2937">Hahotoé-Kpogamé</text>
<rect x="165" y="442" width="130" height="62" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
<text x="230.0" y="469.1" font-size="14" text-anchor="middle" font-weight="bold" fill="#1f2937">calcaire</text>
<text x="230.0" y="486.6" font-size="14" text-anchor="middle" font-weight="normal" fill="#1f2937">Tabligbo</text>
<rect x="305" y="442" width="130" height="62" rx="10" fill="#fde68a" stroke="#a16207" stroke-width="1.5"/>
<text x="370.0" y="469.1" font-size="14" text-anchor="middle" font-weight="bold" fill="#1f2937">argiles, sables</text>
<text x="370.0" y="486.6" font-size="14" text-anchor="middle" font-weight="normal" fill="#1f2937">plateaux du sud</text>
<rect x="445" y="442" width="130" height="62" rx="10" fill="#fde68a" stroke="#a16207" stroke-width="1.5"/>
<text x="510.0" y="469.1" font-size="14" text-anchor="middle" font-weight="bold" fill="#1f2937">sables de plage</text>
<text x="510.0" y="486.6" font-size="14" text-anchor="middle" font-weight="normal" fill="#1f2937">littoral</text>
<text x="300" y="540" font-size="14" text-anchor="middle" font-weight="normal" fill="#4b5563">Tests utiles : effervescence à l'acide → calcaire ;</text>
<text x="300" y="560" font-size="14" text-anchor="middle" font-weight="normal" fill="#4b5563">grains visibles cimentés → grès ; pâte plastique mouillée → argile ;</text>
<text x="300" y="580" font-size="14" text-anchor="middle" font-weight="normal" fill="#4b5563">goût salé, rayé par l'ongle → sel gemme ; noire, légère, brûle → charbon.</text>
<text x="300" y="615" font-size="13" text-anchor="middle" font-weight="normal" fill="#4b5563">Le reste du Togo repose surtout sur un socle de roches magmatiques et métamorphiques.</text>
</svg>
