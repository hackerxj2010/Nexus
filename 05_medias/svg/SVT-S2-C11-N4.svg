<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 640" width="600" height="640" role="img" aria-labelledby="titre desc" font-family="Arial, Helvetica, sans-serif">
<title id="titre">Coupe géologique et datation relative</title>
<desc id="desc">Coupe géologique : quatre couches sédimentaires numérotées 1 à 4 de bas en haut sont décalées par une faille F ; un filon de basalte B recoupe la faille ; une surface d'érosion tronque l'ensemble et est recouverte par la couche 5. Fossiles : trilobites dans la couche 1, ammonites dans la couche 3, nummulites dans la couche 5. Encadré : principes de superposition, de recoupement et d'identité paléontologique ; chronologie 1, 2, 3, 4, faille, filon, érosion, 5.</desc>
