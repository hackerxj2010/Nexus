<text x="40" y="440" font-size="13" text-anchor="start" font-weight="normal" fill="#4b5563">Fossiles : trilobites dans 1 (ère primaire) ; ammonites dans 3 (ère secondaire) ;</text>
<text x="40" y="458" font-size="13" text-anchor="start" font-weight="normal" fill="#4b5563">nummulites dans 5 (ère tertiaire).</text>
