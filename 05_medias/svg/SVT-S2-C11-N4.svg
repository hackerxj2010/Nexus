<text x="300.0" y="517.4" font-size="14" text-anchor="middle" font-weight="bold" fill="#1f2937">Principes de datation relative</text>
<text x="300.0" y="534.9" font-size="14" text-anchor="middle" font-weight="normal" fill="#1f2937">Superposition : une couche est plus récente que celle qu'elle recouvre.</text>
<text x="300.0" y="552.4" font-size="14" text-anchor="middle" font-weight="normal" fill="#1f2937">Recoupement : une structure (faille, filon) est plus récente que ce qu'elle coupe.</text>
<text x="300.0" y="569.9" font-size="14" text-anchor="middle" font-weight="normal" fill="#1f2937">Identité paléontologique : mêmes fossiles stratigraphiques = même âge.</text>
<text x="300.0" y="587.4" font-size="14" text-anchor="middle" font-weight="normal" fill="#1f2937">Ordre ici : 1, 2, 3, 4 → faille F → filon B → érosion → 5.</text>
</svg>
