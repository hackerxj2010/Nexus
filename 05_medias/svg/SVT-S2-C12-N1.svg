<text x="440" y="102" font-size="13" text-anchor="start" font-weight="normal" fill="#4b5563">épaisseur exagérée</text>
<line x1="366.0" y1="181.7" x2="436" y2="130" stroke="#374151" stroke-width="1.5"/><circle cx="366.0" cy="181.7" r="2.6" fill="#374151"/>
<text x="440" y="135" font-size="14" text-anchor="start" font-weight="bold" fill="#1f2937">manteau supérieur</text>
