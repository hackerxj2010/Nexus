<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 625" width="600" height="625" role="img" aria-labelledby="titre desc" font-family="Arial, Helvetica, sans-serif">
<title id="titre">Foyer, épicentre et ondes d'un séisme</title>
<desc id="desc">Coupe : le jeu brutal d'une faille en profondeur au niveau du foyer (hypocentre) émet des ondes sismiques qui se propagent dans toutes les directions ; l'épicentre est le point de la surface situé à la verticale du foyer. Une station enregistre un sismogramme : les ondes P arrivent en premier, puis les ondes S ; le retard Δt augmente avec la distance.</desc>
