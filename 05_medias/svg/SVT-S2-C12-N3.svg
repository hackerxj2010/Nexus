<path d="M330,105 Q370,85 384,82" fill="none" stroke="#292524" stroke-width="1.5" marker-end="url(#fl)"/>
<text x="30" y="30" font-size="14" text-anchor="start" font-weight="normal" fill="#1f2937">panache de cendres</text>
<text x="30" y="48" font-size="14" text-anchor="start" font-weight="normal" fill="#1f2937">et de gaz</text>
<line x1="170" y1="40" x2="248" y2="80" stroke="#374151" stroke-width="1.5"/>
