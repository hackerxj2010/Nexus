<line x1="470" y1="318" x2="520" y2="275" stroke="#374151" stroke-width="1.5"/><circle cx="470" cy="318" r="2.6" fill="#374151"/><text x="525" y="280" font-size="14" text-anchor="start" font-weight="normal" fill="#1f2937"></text>
<text x="575" y="268" font-size="14" text-anchor="end" font-weight="normal" fill="#1f2937">coulée de lave</text>
