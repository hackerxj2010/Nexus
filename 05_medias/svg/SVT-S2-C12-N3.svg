<text x="30" y="243" font-size="14" text-anchor="start" font-weight="normal" fill="#1f2937">laves et de cendres</text>
<line x1="300" y1="380" x2="175" y2="395" stroke="#374151" stroke-width="1.5"/><circle cx="300" cy="380" r="2.6" fill="#374151"/><text x="170" y="400" font-size="14" text-anchor="end" font-weight="normal" fill="#1f2937">cheminée</text>
<line x1="408" y1="256" x2="470" y2="220" stroke="#374151" stroke-width="1.5"/><circle cx="408" cy="256" r="2.6" fill="#374151"/><text x="475" y="225" font-size="14" text-anchor="start" font-weight="normal" fill="#1f2937">cône secondaire</text>
<line x1="390" y1="495" x2="440" y2="520" stroke="#374151" stroke-width="1.5"/><circle cx="390" cy="495" r="2.6" fill="#374151"/><text x="445" y="525" font-size="14" text-anchor="start" font-weight="normal" fill="#1f2937">chambre magmatique</text>
<text x="300" y="497" font-size="14" text-anchor="middle" font-weight="bold" fill="#ffffff">magma</text>
</g>
<line x1="30" y1="585" x2="570" y2="585" stroke="#d1d5db" stroke-width="1.5"/>
<rect x="30" y="598" width="262" height="88" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="161.0" y="621.4" font-size="13.5" text-anchor="middle" font-weight="bold" fill="#1f2937">Éruption effusive</text>
<text x="161.0" y="638.3" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#1f2937">lave fluide, pauvre en silice</text>
<text x="161.0" y="655.2" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#1f2937">coulées (basalte)</text>
<text x="161.0" y="672.0" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#1f2937">ex. : mont Cameroun, Nyiragongo</text>
<rect x="308" y="598" width="262" height="88" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
<text x="439.0" y="621.4" font-size="13.5" text-anchor="middle" font-weight="bold" fill="#1f2937">Éruption explosive</text>
<text x="439.0" y="638.3" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#1f2937">lave visqueuse, riche en silice,</text>
<text x="439.0" y="655.2" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#1f2937">gaz : explosions, nuées ardentes</text>
<text x="439.0" y="672.0" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#1f2937">ex. : montagne Pelée (1902)</text>
</svg>
