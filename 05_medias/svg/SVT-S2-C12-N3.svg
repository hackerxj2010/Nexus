<circle cx="300" cy="95" r="30" fill="#9ca3af" opacity="0.85"/>
<circle cx="275" cy="70" r="26" fill="#9ca3af" opacity="0.85"/>
<circle cx="325" cy="66" r="28" fill="#9ca3af" opacity="0.85"/>
<circle cx="300" cy="48" r="24" fill="#9ca3af" opacity="0.85"/>
<circle cx="345" cy="92" r="22" fill="#9ca3af" opacity="0.85"/>
<circle cx="255" cy="96" r="20" fill="#9ca3af" opacity="0.85"/>
